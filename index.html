<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Haba Messenger</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-title" content="Haba Messenger">
<link rel="manifest" href="manifest-messenger.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='45' fill='%23111111'/%3E%3Cpolygon points='20,80 170,30 80,110' fill='white' fill-opacity='.75'/%3E%3Cpolygon points='120,180 170,30 80,110' fill='white'/%3E%3Cpolygon points='20,80 80,110 80,140' fill='white' fill-opacity='.55'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Michroma&display=swap" rel="stylesheet">
<style>
:root{--accent:#111;--bg:#fff;--bg-input:#F0F2F5;--hover:#F2F2F2;--line:#EAEAEA;--text:#111;--sub:#888;--bubble-in:#F0F0F0;--bubble-out:#111;--bubble-out-text:#fff;--brand:'Michroma',sans-serif}
@media (prefers-color-scheme:dark){:root{--accent:#F2F2F7;--bg:#000;--bg-input:#1C1C1E;--hover:#1C1C1E;--line:#2A2A2C;--text:#F2F2F7;--sub:#8E8E93;--bubble-in:#2C2C2E;--bubble-out:#F2F2F7;--bubble-out-text:#000}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
/* splash (same as Haba) */
#splash{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
.mark{display:flex;flex-direction:column;align-items:center;gap:14px;height:240px;justify-content:center}
.logo{width:150px;height:150px;display:flex;align-items:center;justify-content:center;opacity:0;animation:in .5s cubic-bezier(.2,.85,.3,1.15) forwards .1s}
.logo svg{width:92px;height:92px}
.wordmark{font-family:var(--brand);font-size:20px;letter-spacing:4px;opacity:0;animation:in .01s forwards .22s}
.typed{display:inline-block;white-space:nowrap;border-right:2px solid var(--text);min-height:1em;animation:blink .75s step-end infinite .22s}
.dots{display:flex;gap:6px;opacity:0;animation:in .4s forwards .5s}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--text);opacity:.35;animation:pulse 1.1s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
.from{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;animation:in .5s forwards .6s}
.from small{font-size:12px;color:var(--sub);letter-spacing:.4px}.from b{font-family:var(--brand);font-size:13px;font-weight:400;letter-spacing:2px}
@keyframes in{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes blink{50%{border-color:transparent}}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.75)}40%{opacity:1;transform:scale(1)}}
/* auth */
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.card{width:100%;max-width:380px}
.card svg.mk{width:56px;height:56px;margin-bottom:18px}
.card h1{font-size:26px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px}
.card p{color:var(--sub);font-size:15px;line-height:1.4;margin-bottom:20px}
.row{display:flex;gap:8px;margin-bottom:12px}
.in{width:100%;height:48px;padding:0 16px;border-radius:12px;border:1px solid transparent;background:var(--bg-input);font-size:16px;outline:none}
.in:focus{border-color:var(--accent)}
.in.cc{width:84px;text-align:center;flex-shrink:0}
.btn{width:100%;height:48px;border-radius:12px;background:var(--accent);color:var(--bg);font-weight:700;font-size:16px}
.btn:disabled{opacity:.5}
.link{display:block;margin:14px auto 0;color:var(--sub);font-size:14px}
.err{color:#E41E3F;font-size:14px;min-height:20px;margin-bottom:8px}
/* app */
#app{position:fixed;inset:0;display:flex}
#list{width:380px;max-width:100%;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg)}
#convo{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.head{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 8px}
.head h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.ibtn{width:38px;height:38px;border-radius:50%;background:var(--bg-input);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ibtn svg{width:20px;height:20px}
.search{margin:4px 16px 8px}
.search .in{height:40px;border-radius:999px;font-size:15px}
#chats{flex:1;overflow-y:auto}
.chat{display:flex;gap:12px;align-items:center;padding:8px 16px;cursor:pointer}
.chat:hover,.chat.active{background:var(--hover)}
.av{width:56px;height:56px;border-radius:50%;background:var(--bubble-in) center/cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--sub)}
.av.sm{width:40px;height:40px;font-size:14px}
.cm{flex:1;min-width:0}
.cm .n{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm .p{font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat.unread .n{font-weight:700}.chat.unread .p{color:var(--text);font-weight:600}
.meta{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.meta .t{font-size:12.5px;color:var(--sub)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--bg);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.empty{padding:48px 24px;text-align:center;color:var(--sub);font-size:15px;line-height:1.5}
.ph{flex:1;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:15px;flex-direction:column;gap:12px}
.ph svg{width:72px;height:72px;opacity:.25}
.ch{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;border-bottom:1px solid var(--line)}
.ch .n{font-weight:700;font-size:16px}
#back{display:none}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px}
.b{max-width:min(75%,520px);padding:9px 14px;border-radius:18px;font-size:15px;line-height:1.35;white-space:pre-wrap;word-break:break-word;background:var(--bubble-in)}
.b.me{align-self:flex-end;background:var(--bubble-out);color:var(--bubble-out-text)}
.b small{display:block;font-size:11px;opacity:.6;margin-top:3px;text-align:right}
.sys{align-self:center;font-size:12.5px;color:var(--sub);padding:6px 0}
.compose{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.compose .in{height:42px;border-radius:999px}
.send{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send svg{width:18px;height:18px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
#modal .box{background:var(--bg);width:100%;max-width:380px;border-radius:16px;padding:20px;box-shadow:0 12px 28px rgba(0,0,0,.25)}
#modal h3{font-size:20px;font-weight:700;margin-bottom:6px}
#modal p{color:var(--sub);font-size:15px;margin-bottom:14px}
#modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#modal .acts button{height:40px;padding:0 18px;border-radius:8px;font-weight:600;background:var(--bg-input)}
#modal .acts .go{background:var(--accent);color:var(--bg)}
@media (max-width:768px){
 #list{width:100%;border-right:none}
 #convo{position:fixed;inset:0;z-index:5;transform:translateX(100%);transition:transform .25s ease}
 #app.in-chat #convo{transform:none}
 #back{display:flex}
}
</style>
</head>
<body>
<div id="splash"><div class="mark" role="img" aria-label="Haba"><div class="logo"><svg viewBox="0 0 200 200"><polygon points="20,80 170,30 80,110" fill="var(--accent)" fill-opacity=".75"/><polygon points="120,180 170,30 80,110" fill="var(--accent)"/><polygon points="20,80 80,110 80,140" fill="var(--accent)" fill-opacity=".55"/></svg></div><span class="wordmark"><span class="typed" id="typed"></span></span><div class="dots"><span></span><span></span><span></span></div></div><div class="from"><small>from</small><b>Rare Grade</b></div></div>

<div id="auth" hidden><div class="card">
 <svg class="mk" viewBox="0 0 200 200"><polygon points="20,80 170,30 80,110" fill="var(--accent)" fill-opacity=".75"/><polygon points="120,180 170,30 80,110" fill="var(--accent)"/><polygon points="20,80 80,110 80,140" fill="var(--accent)" fill-opacity=".55"/></svg>
 <div id="s-phone"><h1>Haba Messenger</h1><p>Enter your phone number to sign in or create your account.</p>
  <div class="row"><input id="cc" class="in cc" value="+1" inputmode="tel" aria-label="Country code"><input id="phone" class="in" type="tel" inputmode="tel" placeholder="Phone number" autocomplete="tel-national"></div>
  <div class="err" id="e-phone"></div><button class="btn" id="send">Send code</button></div>
 <div id="s-otp" hidden><h1>Enter the code</h1><p id="otp-sub"></p>
  <input id="otp" class="in" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" style="text-align:center;letter-spacing:8px;font-size:22px;margin-bottom:12px">
  <div class="err" id="e-otp"></div><button class="btn" id="verify">Verify</button><button class="link" id="resend">Resend code</button><button class="link" id="change">Use a different number</button></div>
 <div id="s-name" hidden><h1>What's your name?</h1><p>This is how people will see you in chats.</p>
  <input id="name" class="in" maxlength="40" placeholder="Your name" style="margin-bottom:12px"><div class="err" id="e-name"></div><button class="btn" id="save">Continue</button></div>
 <div id="recaptcha-container"></div>
</div></div>

<div id="app" hidden>
 <aside id="list">
  <div class="head"><h1>Chats</h1><div style="display:flex;gap:8px">
   <button class="ibtn" id="new" title="New chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
   <button class="ibtn" id="me" title="Account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></button></div></div>
  <div class="search"><input id="q" class="in" placeholder="Search chats" autocomplete="off"></div>
  <div id="chats"></div>
 </aside>
 <main id="convo">
  <div class="ph" id="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Select a chat to start messaging</div>
  <div id="thread" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
   <div class="ch"><button class="ibtn" id="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button><div class="av sm" id="t-av"></div><div class="n" id="t-name"></div></div>
   <div id="msgs"></div>
   <div class="compose"><input id="msg" class="in" placeholder="Message" autocomplete="off"><button class="send" id="sendmsg" aria-label="Send"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button></div>
  </div>
 </main>
</div>
<div id="modal" hidden><div class="box"><h3 id="m-title"></h3><p id="m-text"></p><input id="m-in" class="in" hidden><div class="acts"><button id="m-cancel">Cancel</button><button class="go" id="m-ok">OK</button></div></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut,RecaptchaVerifier,signInWithPhoneNumber} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import {getDatabase,ref,get,set,update,push,onValue,query,orderByChild,limitToLast,increment} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
const app=initializeApp({
            apiKey: "AIzaSyBQSPwpVbGrdCuOoyitAeWQHIeipj2MgIY",
            authDomain: "newstart-64c43.firebaseapp.com",
            databaseURL: "https://newstart-64c43-default-rtdb.firebaseio.com",
            projectId: "newstart-64c43",
            storageBucket: "newstart-64c43.firebasestorage.app",
            messagingSenderId: "941619830061",
            appId: "1:941619830061:web:de9e0f791eb8f6eacf87a4"
        }),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id), AVATAR="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 96 96%22%3E%3Ccircle cx=%2248%22 cy=%2248%22 r=%2248%22 fill=%22%23000000%22/%3E%3Ccircle cx=%2248%22 cy=%2238%22 r=%2218%22 fill=%22%23FFFFFF%22 fill-opacity=%220.85%22/%3E%3Cpath d=%22M48 60c-19 0-30 10.5-30 22v2a48 48 0 0 0 60 0v-2c0-11.5-11-22-30-22z%22 fill=%22%23FFFFFF%22 fill-opacity=%220.85%22/%3E%3C/svg%3E", E2E='\u27e6e2e1\u27e7';
let me=null,confirmation=null,verifier=null,phoneFull='',chats={},profiles={},previews={},active=null,offList=null,offMsgs=null;

/* splash typing, same as Haba */
(()=>{const el=$('typed'),t='HABA';let i=0;const k=setInterval(()=>{el.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(k)},120)})();
const hideSplash=()=>setTimeout(()=>$('splash').classList.add('out'),900);

/* dialogs */
function ask(title,text,{input=false,ok='OK',cancel=true}={}){return new Promise(res=>{$('m-title').textContent=title;$('m-text').textContent=text;const mi=$('m-in');mi.hidden=!input;mi.value='';$('m-cancel').hidden=!cancel;$('m-ok').textContent=ok;$('modal').hidden=false;if(input)mi.focus();const done=v=>{$('modal').hidden=true;res(v)};$('m-ok').onclick=()=>done(input?mi.value.trim():true);$('m-cancel').onclick=()=>done(input?null:false)})}

/* ---- E2E (same scheme and message format as Haba) ---- */
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('haba-messenger',1);q.onupgradeneeded=()=>q.result.createObjectStore('keys');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const idbGet=async k=>{const d=await idb();return new Promise((r,j)=>{const q=d.transaction('keys').objectStore('keys').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})};
const idbSet=async(k,v)=>{const d=await idb();return new Promise((r,j)=>{const t=d.transaction('keys','readwrite');t.objectStore('keys').put(v,k);t.oncomplete=r;t.onerror=()=>j(t.error)})};
const b64=b=>{let s='';new Uint8Array(b).forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)).buffer;
let kp=null;const peerKeys={},shared={};
async function myKeys(){
 if(kp)return kp;
 try{const s=await idbGet('keypair-'+me.uid);if(s&&s.privateKey)return kp=s}catch(_){}
 const pub=await get(ref(db,`users/${me.uid}/e2ee/publicKey`));
 if(pub.exists())return null; /* another device owns the published key: never overwrite it */
 const k=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
 try{await idbSet('keypair-'+me.uid,k)}catch(_){}
 await set(ref(db,`users/${me.uid}/e2ee/publicKey`),await crypto.subtle.exportKey('jwk',k.publicKey));
 return kp=k;
}
async function sharedKey(peer){
 if(shared[peer])return shared[peer];
 const my=await myKeys();if(!my)return null;
 const s=await get(ref(db,`users/${peer}/e2ee/publicKey`));if(!s.exists())return null;
 try{const pk=await crypto.subtle.importKey('jwk',s.val(),{name:'ECDH',namedCurve:'P-256'},true,[]);
  return shared[peer]=await crypto.subtle.deriveKey({name:'ECDH',public:pk},my.privateKey,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}catch(_){return null}
}
async function enc(peer,text){const k=await sharedKey(peer);if(!k)return text;const iv=crypto.getRandomValues(new Uint8Array(12));return E2E+b64(iv)+':'+b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(text)))}
async function dec(peer,p){
 if(typeof p!=='string'||!p.startsWith(E2E))return p||'';
 const k=await sharedKey(peer);if(!k)return '🔒 Encrypted message';
 try{const[iv,c]=p.slice(E2E.length).split(':');return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(unb64(iv))},k,unb64(c)))}catch(_){return '🔒 Unable to decrypt'}
}

/* ---- phone auth ---- */
function rc(){if(verifier)return verifier;verifier=new RecaptchaVerifier(auth,'recaptcha-container',{size:'invisible'});return verifier}
function resetRc(){try{verifier&&verifier.clear()}catch(_){}verifier=null;const o=$('recaptcha-container'),n=document.createElement('div');n.id='recaptcha-container';o.replaceWith(n)}
const step=s=>['phone','otp','name'].forEach(x=>$('s-'+x).hidden=x!==s);
async function sendCode(){
 const raw=$('phone').value.replace(/\D/g,'').replace(/^0+/,'');const cc=($('cc').value.trim().startsWith('+')?$('cc').value.trim():'+'+$('cc').value.trim());
 if(!raw){$('e-phone').textContent='Enter your phone number.';return}
 phoneFull=cc+raw;$('send').disabled=true;$('e-phone').textContent='';
 try{confirmation=await signInWithPhoneNumber(auth,phoneFull,rc());$('otp-sub').textContent='Enter the code sent to '+phoneFull;step('otp');$('otp').value='';$('otp').focus()}
 catch(e){$('e-phone').textContent=(e.message||'Could not send code').replace('Firebase: ','');resetRc()}
 $('send').disabled=false;
}
$('send').onclick=sendCode;
$('resend').onclick=async()=>{try{confirmation=await signInWithPhoneNumber(auth,phoneFull,rc());$('e-otp').textContent='Code resent'}catch(e){$('e-otp').textContent=(e.message||'').replace('Firebase: ','');resetRc()}};
$('change').onclick=()=>step('phone');
$('verify').onclick=async()=>{
 const code=$('otp').value.trim();if(code.length<6){$('e-otp').textContent='Enter the 6-digit code.';return}
 $('verify').disabled=true;$('e-otp').textContent='';
 try{await confirmation.confirm(code)}catch(e){$('e-otp').textContent=e.code==='auth/invalid-verification-code'||e.code==='auth/code-expired'?'That code is wrong or expired.':(e.message||'').replace('Firebase: ','')}
 $('verify').disabled=false;
};
$('otp').addEventListener('input',()=>{if($('otp').value.length===6)$('verify').click()});
$('phone').addEventListener('keydown',e=>{if(e.key==='Enter')sendCode()});
$('save').onclick=async()=>{const n=$('name').value.trim();if(!n){$('e-name').textContent='Enter your name.';return}
 await update(ref(db,'users/'+me.uid),{name:n,phoneNumber:me.phoneNumber||phoneFull,createdAt:Date.now()});showApp()};

/* ---- session ---- */
onAuthStateChanged(auth,async u=>{
 if(offList){offList();offList=null}
 if(!u){me=null;kp=null;$('app').hidden=true;$('auth').hidden=false;step('phone');hideSplash();return}
 me=u;
 const p=await get(ref(db,'users/'+u.uid));
 if(!p.exists()||!p.val().name){$('auth').hidden=false;$('app').hidden=true;step('name');hideSplash();return}
 showApp();hideSplash();
});
function showApp(){$('auth').hidden=true;$('app').hidden=false;myKeys().catch(()=>{});
 if(offList)offList();
 offList=onValue(ref(db,'user_chats/'+me.uid),s=>{chats=s.val()||{};renderList();Object.keys(chats).forEach(loadProfile)})}
async function loadProfile(uid){if(profiles[uid])return;const s=await get(ref(db,'users/'+uid));profiles[uid]=s.val()||{name:'Haba user'};renderList();if(active===uid)paintHead()}

/* ---- chat list ---- */
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const avStyle=(p)=>p&&p.photoURL?`style="background-image:url('${p.photoURL.replace(/'/g,'%27')}')"`:'';
const fmt=ts=>{if(!ts)return'';const d=new Date(ts),n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):d.toLocaleDateString([],{month:'short',day:'numeric'})};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function preview(uid,c){const key=uid+c.timestamp;if(previews[key]!==undefined)return previews[key];previews[key]=await dec(uid,c.text);renderList();return previews[key]}
function renderList(){
 const q=$('q').value.trim().toLowerCase();
 const rows=Object.entries(chats).filter(([uid,c])=>c&&c.timestamp).sort((a,b)=>b[1].timestamp-a[1].timestamp)
  .filter(([uid])=>!q||((profiles[uid]||{}).name||'').toLowerCase().includes(q));
 if(!rows.length){$('chats').innerHTML=`<div class="empty">${q?'No chats match your search.':'No conversations yet.<br>Tap the pencil to start one.'}</div>`;return}
 $('chats').innerHTML=rows.map(([uid,c])=>{const p=profiles[uid]||{},pv=previews[uid+c.timestamp];if(pv===undefined)preview(uid,c);
  const un=c.unreadCount>0&&c.senderUid!==me.uid;
  return `<div class="chat${un?' unread':''}${active===uid?' active':''}" data-uid="${esc(uid)}"><div class="av" ${avStyle(p)}>${p.photoURL?'':esc(initials(p.name))}</div><div class="cm"><div class="n">${esc(p.name||'…')}</div><div class="p">${c.senderUid===me.uid?'You: ':''}${esc(pv===undefined?'…':pv)}</div></div><div class="meta"><span class="t">${fmt(c.timestamp)}</span>${un?`<span class="badge">${c.unreadCount>99?'99+':c.unreadCount}</span>`:''}</div></div>`}).join('');
}
$('chats').onclick=e=>{const r=e.target.closest('.chat');if(r)openChat(r.dataset.uid)};
$('q').oninput=renderList;

/* ---- conversation ---- */
const tid=(a,b)=>[a,b].sort().join('_');
function paintHead(){const p=profiles[active]||{};$('t-name').textContent=p.name||'…';const a=$('t-av');a.style.backgroundImage=p.photoURL?`url('${p.photoURL}')`:'';a.textContent=p.photoURL?'':initials(p.name)}
async function openChat(uid){
 active=uid;if(offMsgs){offMsgs();offMsgs=null}
 $('ph').hidden=true;$('thread').hidden=false;$('app').classList.add('in-chat');$('msgs').innerHTML='';
 loadProfile(uid);paintHead();renderList();
 const t=tid(me.uid,uid);
 const markRead=()=>{update(ref(db),{[`user_chats/${me.uid}/${uid}/unreadCount`]:0,[`dm_threads/${t}/readReceipts/${me.uid}`]:Date.now()}).catch(()=>{})};markRead();
 offMsgs=onValue(query(ref(db,`dm_threads/${t}/messages`),orderByChild('createdAt'),limitToLast(150)),async s=>{
  const items=[];s.forEach(c=>{items.push({k:c.key,...c.val()})});
  const out=await Promise.all(items.map(async m=>{
   if(m.systemText)return `<div class="sys">${esc(m.systemText)}</div>`;
   if(m.deletedForEveryone)return `<div class="sys">Message removed</div>`;
   let txt=m.text?await dec(uid,m.text):'';if(!txt&&(m.mediaType||m.mediaURL))txt='📎 '+(m.mediaType||'Attachment')+' (open in Haba to view)';
   return `<div class="b${m.senderUid===me.uid?' me':''}">${esc(txt)}<small>${fmt(m.createdAt)}</small></div>`}));
  if(active!==uid)return;
  const box=$('msgs'),stick=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  box.innerHTML=out.join('');if(stick)box.scrollTop=box.scrollHeight;
  if(items.length&&items[items.length-1].senderUid!==me.uid)markRead();
 });
}
async function sendMsg(){
 const inp=$('msg'),text=inp.value.trim();if(!text||!active)return;inp.value='';
 const uid=active,t=tid(me.uid,uid),now=Date.now(),e=await enc(uid,text);
 const key=push(ref(db,`dm_threads/${t}/messages`)).key;
 await update(ref(db),{
  [`dm_threads/${t}/messages/${key}`]:{text:e,senderUid:me.uid,createdAt:now},
  [`user_chats/${me.uid}/${uid}`]:{text:e,timestamp:now,unreadCount:0,senderUid:me.uid},
  [`user_chats/${uid}/${me.uid}/text`]:e,[`user_chats/${uid}/${me.uid}/timestamp`]:now,
  [`user_chats/${uid}/${me.uid}/senderUid`]:me.uid,[`user_chats/${uid}/${me.uid}/unreadCount`]:increment(1)
 }).catch(()=>ask('Not sent',"Your message couldn't be sent. Check your connection and try again.",{cancel:false}));
}
$('sendmsg').onclick=sendMsg;
$('msg').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});
$('back').onclick=()=>{$('app').classList.remove('in-chat');if(offMsgs){offMsgs();offMsgs=null}active=null;$('thread').hidden=true;$('ph').hidden=false;renderList()};

/* ---- new chat / account ---- */
$('new').onclick=async()=>{
 const v=await ask('New chat','Enter their @username.',{input:true,ok:'Start chat'});if(!v)return;
 const name=v.replace(/^@/,'').toLowerCase();
 try{const s=await get(ref(db,'usernames/'+name));
  if(!s.exists()){ask('Not found',`No one with the username @${name}.`,{cancel:false});return}
  const uid=typeof s.val()==='string'?s.val():(s.val().uid||Object.keys(s.val())[0]);
  if(uid===me.uid){ask('That’s you','You can’t message yourself.',{cancel:false});return}
  await loadProfile(uid);openChat(uid)}
 catch(_){ask('Error',"Couldn't look that up. Try again.",{cancel:false})}
};
$('me').onclick=async()=>{if(await ask('Account',`Signed in as ${me.phoneNumber||'your account'}.`,{ok:'Sign out'}))signOut(auth)};
</script>
