<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Haba Messenger</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='45' fill='%23000'/%3E%3Cpath d='M54 55a13 13 0 0 1 26 0V200H54Z' fill='%23FFF'/%3E%3Cpath d='M67 114C67 88 88 78 108 78C132 78 142 94 142 116L142 200' fill='none' stroke='%23FFF' stroke-width='26' stroke-linejoin='round'/%3E%3Ccircle cx='148' cy='46' r='13' fill='%23FFB020'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --surface:#fff; --alt:#F7F8FA; --input:#F0F2F5; --border:#EDEDED;
  --text:#111; --muted:#888; --inverse:#fff; --primary:#111;
  --in-bg:#fff; --in-text:#111B21; --out-bg:#111; --out-text:#fff;
  --in-time:rgba(0,0,0,.45); --out-time:rgba(255,255,255,.75); --seen:#53BDEB;
  --chat-bg:#EFEFF2; --danger:#FF453A; --accent:#FFB020;
  --brand:'Michroma',system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#000; --surface:#1C1C1E; --alt:#111; --input:#2C2C2E; --border:#2C2C2E;
  --text:#F2F2F7; --muted:#98989D; --inverse:#111; --primary:#F2F2F7;
  --in-bg:#202C33; --in-text:#E9EDEF; --out-bg:#3A3A3C; --out-text:#fff;
  --in-time:rgba(255,255,255,.55); --chat-bg:#0B0B0C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.brand{font-family:var(--brand);font-size:20px;letter-spacing:.5px}
.brand i{color:var(--accent);font-style:normal}

/* auth */
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.card{width:100%;max-width:380px}
.card h1{margin:0 0 4px}
.card p.sub{color:var(--muted);margin:0 0 22px}
.tabs{display:flex;background:var(--input);border-radius:50px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:9px;border-radius:50px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.field{width:100%;padding:14px 18px;border-radius:50px;border:1px solid transparent;background:var(--input);margin-bottom:10px;outline:none}
.field:focus{border-color:var(--primary)}
.btn{width:100%;padding:14px;border-radius:50px;background:var(--primary);color:var(--inverse);font-weight:700;margin-top:4px}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--input);color:var(--text)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:6px 4px}
.row{display:flex;gap:8px}
.row .field:first-child{max-width:90px}

/* app layout */
#app{height:100%;display:flex}
#side{width:380px;max-width:100%;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface);min-width:0}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chat-bg);position:relative}
.bar{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 14px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
.bar .grow{flex:1;min-width:0}
.icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon:hover{background:var(--input)}
.icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.searchwrap{padding:10px 14px}
.searchwrap input{width:100%;padding:11px 16px;border-radius:50px;border:none;background:var(--input);outline:none}
#chatlist{flex:1;overflow-y:auto}
.ci{display:flex;gap:12px;padding:11px 14px;cursor:pointer;align-items:center}
.ci:hover,.ci.active{background:var(--alt)}
.av{width:48px;height:48px;border-radius:50%;background:#000 center/cover no-repeat;flex-shrink:0;position:relative}
.av.sm{width:40px;height:40px}
.dot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#34C759;border:2px solid var(--surface)}
.ci .mid{flex:1;min-width:0}
.ci .top{display:flex;justify-content:space-between;gap:8px}
.ci .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .time{font-size:12px;color:var(--muted);flex-shrink:0}
.ci .prev{display:flex;gap:8px;align-items:center;margin-top:2px}
.ci .prev span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.badge{background:var(--primary);color:var(--inverse);border-radius:50px;font-size:12px;font-weight:700;min-width:20px;height:20px;padding:0 6px;display:flex;align-items:center;justify-content:center}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
#banner{background:#FFF4D6;color:#5a4300;padding:9px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
#banner button{background:#111;color:#fff;border-radius:50px;padding:6px 12px;font-weight:600;font-size:12px;flex-shrink:0}
:root[data-theme="dark"] #banner{background:#3a2f0b;color:#ffe9a8}

/* thread */
#placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:10px;text-align:center;padding:20px}
#thread{flex:1;display:flex;flex-direction:column;min-height:0}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;background:var(--surface);color:var(--muted);font-size:12px;padding:4px 12px;border-radius:50px;margin:10px 0;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.b{max-width:min(78%,520px);padding:7px 10px 5px;border-radius:16px;position:relative;word-wrap:break-word;overflow-wrap:anywhere;box-shadow:0 1px .5px rgba(0,0,0,.13);cursor:pointer}
.b.in{align-self:flex-start;background:var(--in-bg);color:var(--in-text);border-bottom-left-radius:4px}
.b.out{align-self:flex-end;background:var(--out-bg);color:var(--out-text);border-bottom-right-radius:4px}
.b .t{white-space:pre-wrap;line-height:1.35}
.b .t a{color:inherit;text-decoration:underline}
.b .meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;margin-top:2px}
.b.in .meta{color:var(--in-time)} .b.out .meta{color:var(--out-time)}
.tick.seen{color:var(--seen)}
.b.del{font-style:italic;opacity:.7}
.b img,.b video{max-width:100%;max-height:340px;border-radius:10px;display:block;margin-bottom:4px;background:rgba(0,0,0,.08)}
.b img{min-width:140px;min-height:100px;object-fit:cover}
.b audio{max-width:240px;height:38px}
.quote{border-left:3px solid var(--accent);background:rgba(128,128,128,.15);border-radius:8px;padding:5px 8px;margin-bottom:5px;font-size:13px;opacity:.9;max-height:60px;overflow:hidden}
.quote b{display:block;font-size:12px}
.file{display:flex;gap:8px;align-items:center;padding:6px 2px}
.sys{align-self:center;font-size:12px;color:var(--muted);margin:6px 0}
.typing{align-self:flex-start;background:var(--in-bg);padding:10px 14px;border-radius:16px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
#more{align-self:center;background:var(--surface);border-radius:50px;padding:6px 14px;font-size:12px;color:var(--muted);margin-bottom:8px}
#replybar{display:flex;align-items:center;gap:10px;background:var(--surface);border-top:1px solid var(--border);padding:8px 14px}
#replybar .q{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:8px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#composer{display:flex;align-items:flex-end;gap:6px;padding:8px 10px calc(8px + var(--sab));background:var(--surface);border-top:1px solid var(--border)}
#composer textarea{flex:1;resize:none;max-height:130px;min-height:42px;padding:11px 16px;border-radius:22px;border:none;background:var(--input);outline:none;line-height:1.3}
#send{background:var(--primary);color:var(--inverse)}
#send:hover{background:var(--primary)}
.rec{color:var(--danger)}
#blocked{padding:16px;text-align:center;color:var(--muted);background:var(--surface);border-top:1px solid var(--border)}

/* menus, modals, toast */
#menu{position:fixed;z-index:50;background:var(--surface);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.25);padding:6px;min-width:170px}
#menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px}
#menu button:hover{background:var(--input)}
#menu .danger{color:var(--danger)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:20px;max-height:80%;overflow:auto;padding-bottom:calc(20px + var(--sab))}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px}}
.sheet h3{margin:0 0 12px}
.res{display:flex;gap:12px;align-items:center;padding:9px 4px;cursor:pointer;border-radius:10px}
.res:hover{background:var(--alt)}
.res small{color:var(--muted);display:block}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:50px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}
.spin{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:760px){
  #side{width:100%;border-right:none}
  #main{position:fixed;inset:0;transform:translateX(100%);transition:transform .25s ease;z-index:20}
  #app.chat-open #main{transform:none}
  .back{display:flex!important}
}
.back{display:none}

/* ---- voice notes ---- */
#composer{position:relative}
#recbar{display:none;flex:1;align-items:center;gap:10px;min-height:42px;padding:0 6px;min-width:0}
#composer.recording #btn-attach,#composer.recording #input,#composer.recording #send{display:none}
#composer.recording #recbar{display:flex}
.recdot{width:11px;height:11px;border-radius:50%;background:var(--danger);flex-shrink:0;animation:recp 1s infinite}
@keyframes recp{50%{opacity:.25}}
#rec-time{font-variant-numeric:tabular-nums;font-weight:600;min-width:38px}
#rec-hint{flex:1;text-align:center;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;will-change:transform,opacity}
#rec-cancel{display:none;color:var(--danger)}
#composer.locked #rec-cancel{display:flex}
#btn-mic{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s,background .15s}
#btn-mic .ic-send{display:none}
#btn-mic.rec{background:var(--danger);color:#fff;transform:scale(1.35);z-index:2}
#composer.locked #btn-mic{background:var(--primary);color:var(--inverse);transform:none}
#composer.locked #btn-mic .ic-mic{display:none}
#composer.locked #btn-mic .ic-send{display:block}
#reclock{display:none;position:absolute;right:8px;bottom:calc(66px + var(--sab));width:40px;height:58px;border-radius:20px;background:var(--surface);box-shadow:0 4px 16px rgba(0,0,0,.25);flex-direction:column;align-items:center;justify-content:center;font-size:15px;color:var(--muted);gap:2px}
#reclock small{font-size:9px}
#composer.recording:not(.locked) #reclock{display:flex}

/* voice bubble */
.vn{display:flex;align-items:center;gap:10px;width:240px;max-width:100%;padding:2px 0}
.vn-play{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#111;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vn-play svg{width:18px;height:18px;fill:currentColor}
.vn-play .pa{display:none}
.vn.playing .vn-play .pa{display:block}
.vn.playing .vn-play .pl{display:none}
.vn-mid{flex:1;min-width:0}
.vn-wave{display:flex;align-items:center;gap:2px;height:30px;cursor:pointer}
.vn-wave i{flex:1;min-width:2px;border-radius:2px;background:currentColor;opacity:.3}
.vn-wave i.on{opacity:1}
.b.out .vn-wave i.on{background:var(--accent)}
.b.in .vn-wave i.on{background:var(--seen)}
.vn-row{display:flex;align-items:center;justify-content:space-between;margin-top:1px}
.vn-time{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
.vn-spd{display:none;font-size:11px;font-weight:700;padding:1px 8px;border-radius:50px;background:rgba(128,128,128,.25)}
.vn.playing .vn-spd{display:inline-block}

/* typing text in chat list */
.ci .prev span.tp{color:#34C759;font-weight:600}

/* no long-press menus / selection anywhere except text fields */
html,body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
img,video,a{-webkit-touch-callout:none;-webkit-user-drag:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="auth" class="hidden">
  <div class="card">
    <h1 class="brand">Haba<i>.</i></h1>
    <p class="sub">Messenger — sign in with your Haba account.</p>
    <div class="tabs"><button id="tab-email" class="on">Email</button><button id="tab-phone">Phone</button></div>

    <div id="pane-email">
      <input class="field" id="email" type="email" placeholder="Email" autocomplete="username">
      <input class="field" id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn" id="btn-email">Sign in</button>
      <button class="btn ghost" id="btn-reset" style="margin-top:8px">Forgot password</button>
    </div>

    <div id="pane-phone" class="hidden">
      <div id="phone-step1">
        <div class="row">
          <input class="field" id="cc" value="+27" inputmode="tel">
          <input class="field" id="phone" type="tel" placeholder="Phone number" inputmode="tel" autocomplete="tel-national">
        </div>
        <button class="btn" id="btn-sendcode">Send code</button>
      </div>
      <div id="phone-step2" class="hidden">
        <input class="field" id="code" placeholder="6-digit code" inputmode="numeric" autocomplete="one-time-code">
        <button class="btn" id="btn-verify">Verify &amp; sign in</button>
        <button class="btn ghost" id="btn-back-phone" style="margin-top:8px">Use a different number</button>
      </div>
    </div>
    <div class="err" id="auth-err"></div>
    <div id="recaptcha-container"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="bar">
      <div class="grow brand">Haba<i>.</i></div>
      <button class="icon" id="btn-new" title="New chat"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      <button class="icon" id="btn-settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
    </div>
    <div id="banner" class="hidden"><span id="banner-text" style="flex:1"></span><button id="banner-btn">Unlock</button></div>
    <div class="searchwrap"><input id="filter" placeholder="Search chats" autocomplete="off"></div>
    <div id="chatlist"><div class="spin"></div></div>
  </aside>

  <section id="main">
    <div id="placeholder">
      <div class="brand" style="font-size:26px">Haba<i>.</i></div>
      <div>Select a chat to start messaging</div>
    </div>

    <div id="thread" class="hidden">
      <div class="bar">
        <button class="icon back" id="btn-back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="av sm" id="th-av"></div>
        <div class="grow">
          <div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="th-name"></div>
          <div style="font-size:12px;color:var(--muted)" id="th-status"></div>
        </div>
        <button class="icon" id="btn-thread-menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
      </div>
      <div id="msgs"></div>
      <div id="replybar" class="hidden"><div class="q" id="reply-q"></div><button class="icon" id="reply-x"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div id="blocked" class="hidden"></div>
      <div id="composer">
        <input type="file" id="file-img" accept="image/*" class="hidden">
        <button class="icon" id="btn-attach" title="Send photo"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></button>
        <div id="recbar">
          <button class="icon" id="rec-cancel" title="Delete"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></button>
          <span class="recdot"></span><span id="rec-time">0:00</span>
          <span id="rec-hint">‹ Slide to cancel</span>
        </div>
        <div id="reclock">🔒<small>▲</small></div>
        <textarea id="input" rows="1" placeholder="Message" autocomplete="off"></textarea>
        <button class="icon" id="btn-mic" title="Hold to record a voice message"><svg class="ic-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 11a7 7 0 0 1-14 0M12 18v4"/></svg><svg class="ic-send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg></button>
        <button class="icon hidden" id="send" title="Send"><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg></button>
      </div>
    </div>
  </section>
</div>

<div id="menu" class="hidden"></div>
<div id="toast"></div>
<div id="modal-root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, RecaptchaVerifier, signInWithPhoneNumber, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getDatabase, ref, onValue, get, push, set, update, off, query, orderByChild, orderByKey, limitToLast, limitToFirst, startAt, endAt, increment, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

/* Same Firebase project as the main Haba app, so accounts, chats and contacts are shared. */
const app = initializeApp({
  apiKey: "AIzaSyBQSPwpVbGrdCuOoyitAeWQHIeipj2MgIY",
  authDomain: "newstart-64c43.firebaseapp.com",
  databaseURL: "https://newstart-64c43-default-rtdb.firebaseio.com",
  projectId: "newstart-64c43",
  storageBucket: "newstart-64c43.firebasestorage.app",
  messagingSenderId: "941619830061",
  appId: "1:941619830061:web:de9e0f791eb8f6eacf87a4"
});
const auth = getAuth(app), db = getDatabase(app), storage = getStorage(app);

const $ = s => document.querySelector(s);
const AI_UID = "goza-ai-assistant";
const PAGE = 30;
const DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 96 96%22%3E%3Ccircle cx=%2248%22 cy=%2248%22 r=%2248%22 fill=%22%23000%22/%3E%3Ccircle cx=%2248%22 cy=%2238%22 r=%2218%22 fill=%22%23FFF%22 fill-opacity=%220.85%22/%3E%3Cpath d=%22M48 60c-19 0-30 10.5-30 22v2a48 48 0 0 0 60 0v-2c0-11.5-11-22-30-22z%22 fill=%22%23FFF%22 fill-opacity=%220.85%22/%3E%3C/svg%3E";
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cssUrl = u => String(u || DEFAULT_AVATAR).replace(/['"()\\\s]/g, c => encodeURIComponent(c));
const linkify = h => h.replace(/\bhttps?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
const threadIdFor = (a, b) => [a, b].sort().join('_');
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2800); }

/* ---------- theme ---------- */
function applyTheme(){

/* =====================================================================
   END-TO-END ENCRYPTION — wire-compatible with the main Haba app.
   ECDH P-256 -> AES-256-GCM, payload "⟦e2e1⟧<iv>:<cipher>[:<meta>]".
   The private key lives only in this browser (IndexedDB). It is restored
   from the user's own PIN backup. This app NEVER overwrites the public key
   already published for an account, so it can't break the main app.
   ===================================================================== */
const E2E_PREFIX = '\u27e6e2e1\u27e7';
const UNREADABLE = '🔒 Unable to decrypt message';
let kp = null;                 // my keypair {privateKey, publicKey}
let keyState = 'none';         // ready | locked | nobackup
const peerPub = {}, peerJwk = {}, shared = {};

const idb = () => new Promise((res, rej) => { const r = indexedDB.open('haba-messenger-e2ee', 1); r.onupgradeneeded = () => r.result.createObjectStore('keys'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbGet = k => idb().then(d => new Promise((res, rej) => { const q = d.transaction('keys').objectStore('keys').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }));
const idbSet = (k, v) => idb().then(d => new Promise((res, rej) => { const t = d.transaction('keys', 'readwrite'); t.objectStore('keys').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }));
const b2b64 = buf => { let s = ''; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const b642b = b => { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; };
const jwkId = j => j ? (j.x || '') + '.' + (j.y || '') : '';
const isE2E = s => typeof s === 'string' && s.startsWith(E2E_PREFIX);

async function initKeys(){
  const uid = me.uid;
  kp = null; keyState = 'locked';
  const stored = await idbGet('keypair-' + uid).catch(() => null);
  const pubSnap = await get(ref(db, `users/${uid}/e2ee/publicKey`));
  const published = pubSnap.exists() ? pubSnap.val() : null;
  if (stored && stored.privateKey && stored.publicKey) {
    const local = await crypto.subtle.exportKey('jwk', stored.publicKey);
    if (!published || jwkId(local) === jwkId(published)) { kp = stored; keyState = 'ready'; return; }
    // local key doesn't match the one peers encrypt to → treat as locked, a backup restore may fix it
  }
  if (!published) {   // brand-new account that has never used encryption: safe to create + publish
    const pair = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']);
    await idbSet('keypair-' + uid, pair);
    await set(ref(db, `users/${uid}/e2ee/publicKey`), await crypto.subtle.exportKey('jwk', pair.publicKey));
    kp = pair; keyState = 'ready'; return;
  }
  const bk = await get(ref(db, `users/${uid}/e2ee/keyBackup`));
  keyState = bk.exists() ? 'locked' : 'nobackup';
}

async function restoreFromPin(pin){
  const uid = me.uid;
  const bsnap = await get(ref(db, `users/${uid}/e2ee/keyBackup`));
  if (!bsnap.exists()) return 'nobackup';
  const b = bsnap.val();
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
    const bkKey = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: new Uint8Array(b642b(b.salt)), iterations: b.iterations || 600000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(b642b(b.iv)) }, bkKey, b642b(b.data));
    const privJwk = JSON.parse(new TextDecoder().decode(plain));
    const privateKey = await crypto.subtle.importKey('jwk', privJwk, { name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']);
    const pubJwk = { ...privJwk }; delete pubJwk.d; pubJwk.key_ops = [];
    const publicKey = await crypto.subtle.importKey('jwk', pubJwk, { name: 'ECDH', namedCurve: 'P-256' }, true, []);
    const pubSnap = await get(ref(db, `users/${uid}/e2ee/publicKey`));
    if (pubSnap.exists() && jwkId(pubSnap.val()) !== jwkId(pubJwk)) return 'mismatch';
    kp = { privateKey, publicKey };
    await idbSet('keypair-' + uid, kp);
    keyState = 'ready';
    Object.keys(shared).forEach(k => delete shared[k]);
    return 'ok';
  } catch (e) { return 'wrong'; }
}

async function getPeerPub(peer, fresh){
  if (peer === AI_UID) return null;
  if (!fresh && peerPub[peer] !== undefined) return peerPub[peer];
  const s = await get(ref(db, `users/${peer}/e2ee/publicKey`));
  if (!s.exists()) { peerPub[peer] = null; peerJwk[peer] = null; return null; }
  if (peerJwk[peer] && jwkId(peerJwk[peer]) !== jwkId(s.val())) delete shared[peer];
  peerJwk[peer] = s.val();
  peerPub[peer] = await crypto.subtle.importKey('jwk', s.val(), { name: 'ECDH', namedCurve: 'P-256' }, true, []);
  return peerPub[peer];
}
async function sharedKey(peer, fresh){
  if (!kp) return null;
  if (!fresh && shared[peer]) return shared[peer];
  const pub = await getPeerPub(peer, fresh); if (!pub) return null;
  try { return shared[peer] = await crypto.subtle.deriveKey({ name: 'ECDH', public: pub }, kp.privateKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']); }
  catch { return null; }
}
async function encText(peer, text){
  if (!text) return text;
  const pub = await getPeerPub(peer);
  if (!pub) return text;                       // peer has no key yet: same plaintext fallback as the main app
  if (!kp) throw new Error('LOCKED');
  const key = await sharedKey(peer);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text));
  const my = await crypto.subtle.exportKey('jwk', kp.publicKey);
  const meta = ':' + btoa(JSON.stringify({ s: { x: my.x, y: my.y }, r: peerJwk[peer] ? jwkId(peerJwk[peer]) : '' }));
  return E2E_PREFIX + b2b64(iv) + ':' + b2b64(ct) + meta;
}
async function tryDec(key, payload){
  const [iv, ct] = payload.slice(E2E_PREFIX.length).split(':');
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(b642b(iv)) }, key, b642b(ct)));
}
const decCache = new Map();
async function decText(peer, payload){
  if (!isE2E(payload)) return payload;
  if (decCache.has(payload)) return decCache.get(payload);
  let out = null;
  if (kp) {
    for (const fresh of [false, true]) {
      const k = await sharedKey(peer, fresh); if (!k) continue;
      try { out = await tryDec(k, payload); break; } catch {}
    }
    if (out === null) {  // sender embedded their real public key in the payload
      try {
        const m = JSON.parse(atob(payload.slice(E2E_PREFIX.length).split(':')[2]));
        const sp = await crypto.subtle.importKey('jwk', { kty: 'EC', crv: 'P-256', x: m.s.x, y: m.s.y, ext: true }, { name: 'ECDH', namedCurve: 'P-256' }, true, []);
        const k = await crypto.subtle.deriveKey({ name: 'ECDH', public: sp }, kp.privateKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        out = await tryDec(k, payload);
      } catch {}
    }
  }
  if (out === null) { if (!kp) return '🔒 Encrypted message'; out = UNREADABLE; }
  decCache.set(payload, out); return out;
}
const mediaCache = {};
function mediaSrc(m, peer){
  if (!m.mediaEncrypted) return Promise.resolve(m.mediaURL);
  if (mediaCache[m.mediaURL]) return mediaCache[m.mediaURL];
  const p = (async () => {
    const buf = await (await fetch(m.mediaURL)).arrayBuffer();
    const iv = new Uint8Array(buf.slice(0, 12)), ct = buf.slice(12);
    for (const fresh of [false, true]) {
      const k = await sharedKey(peer, fresh); if (!k) continue;
      try { return URL.createObjectURL(new Blob([await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, k, ct)], { type: m.mediaMimeType || 'application/octet-stream' })); } catch {}
    }
    throw new Error('decrypt');
  })();
  p.catch(() => delete mediaCache[m.mediaURL]);
  return mediaCache[m.mediaURL] = p;
}
async function encFile(peer, blob){
  const pub = await getPeerPub(peer);
  if (!pub) return { blob, encrypted: false };
  if (!kp) throw new Error('LOCKED');
  const key = await sharedKey(peer);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, await blob.arrayBuffer());
  return { blob: new Blob([iv, new Uint8Array(ct)]), encrypted: true };
}

let me = null;
const users = {};          // uid -> profile
const chats = {};          // uid -> user_chats meta
const previews = {};       // uid -> decrypted preview text
const typingMap = {}, typingWatch = {};   // uid -> is typing to me / listener unsubs
let chatsUnsub = null;
let activeUid = null, threadId = null, msgLimit = PAGE, rawMsgs = {};
let threadUnsubs = [];
let otherLastRead = 0, otherTyping = false, iBlocked = false, theyBlocked = false, disappearing = 0;
let replyTo = null, renderTok = 0, firstLoad = true, msgUnsub = null;

/* =============== AUTH UI =============== */
const authErr = m => $('#auth-err').textContent = m || '';
const nice = e => (e && e.code ? ({
  'auth/invalid-credential':'Wrong email or password.', 'auth/user-not-found':'No Haba account with that email — create one in the Haba app first.',
  'auth/wrong-password':'Wrong email or password.', 'auth/invalid-email':'That email address looks invalid.',
  'auth/too-many-requests':'Too many attempts. Try again in a bit.', 'auth/invalid-phone-number':'That phone number looks invalid.',
  'auth/invalid-verification-code':'That code is wrong.', 'auth/code-expired':'Code expired — request a new one.',
  'auth/unauthorized-domain':'This domain isn’t authorised in Firebase. Add it under Authentication → Settings → Authorized domains.'
}[e.code] || e.message.replace('Firebase: ', '')) : (e.message || 'Something went wrong.'));

$('#tab-email').onclick = () => { $('#tab-email').classList.add('on'); $('#tab-phone').classList.remove('on'); $('#pane-email').classList.remove('hidden'); $('#pane-phone').classList.add('hidden'); authErr(); };
$('#tab-phone').onclick = () => { $('#tab-phone').classList.add('on'); $('#tab-email').classList.remove('on'); $('#pane-phone').classList.remove('hidden'); $('#pane-email').classList.add('hidden'); authErr(); };

async function emailLogin(){
  const email = $('#email').value.trim(), pw = $('#password').value;
  if (!email || !pw) return authErr('Enter your email and password.');
  $('#btn-email').disabled = true; authErr();
  try { await signInWithEmailAndPassword(auth, email, pw); } catch (e) { authErr(nice(e)); }
  $('#btn-email').disabled = false;
}
$('#btn-email').onclick = emailLogin;
$('#password').addEventListener('keydown', e => { if (e.key === 'Enter') emailLogin(); });
$('#btn-reset').onclick = async () => {
  const email = $('#email').value.trim(); if (!email) return authErr('Enter your email above first.');
  try { await sendPasswordResetEmail(auth, email); authErr(''); toast('Password reset email sent'); } catch (e) { authErr(nice(e)); }
};

let verifier = null, confirmation = null;
function getVerifier(){
  if (verifier) { try { verifier.clear(); } catch {} verifier = null; }
  $('#recaptcha-container').innerHTML = '';
  verifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'invisible' });
  return verifier;
}
$('#btn-sendcode').onclick = async () => {
  let cc = $('#cc').value.trim(), num = $('#phone').value.trim().replace(/[\s()-]/g, '');
  if (!cc.startsWith('+')) cc = '+' + cc;
  if (num.startsWith('0')) num = num.slice(1);
  if (num.startsWith('+')) { cc = ''; }
  if (!num) return authErr('Enter your phone number.');
  $('#btn-sendcode').disabled = true; authErr();
  try { confirmation = await signInWithPhoneNumber(auth, cc + num, getVerifier()); $('#phone-step1').classList.add('hidden'); $('#phone-step2').classList.remove('hidden'); $('#code').focus(); }
  catch (e) { authErr(nice(e)); }
  $('#btn-sendcode').disabled = false;
};
$('#btn-verify').onclick = async () => {
  const code = $('#code').value.trim(); if (!code || !confirmation) return;
  $('#btn-verify').disabled = true; authErr();
  try { await confirmation.confirm(code); } catch (e) { authErr(nice(e)); }
  $('#btn-verify').disabled = false;
};
$('#btn-back-phone').onclick = () => { $('#phone-step2').classList.add('hidden'); $('#phone-step1').classList.remove('hidden'); $('#code').value = ''; authErr(); };

/* =============== SESSION =============== */
onAuthStateChanged(auth, async user => {
  if (!user) { teardown(); me = null; $('#app').classList.add('hidden'); $('#auth').classList.remove('hidden'); return; }
  me = user;
  $('#auth').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#chatlist').innerHTML = '<div class="spin"></div>';
  try { await initKeys(); } catch (e) { console.warn('key init', e); keyState = 'locked'; }
  renderBanner();
  startPresence();
  startChatList();
  if (keyState === 'locked') promptUnlock(true);
});

function startPresence(){
  onValue(ref(db, '.info/connected'), s => {
    if (s.val() !== true || !me) return;
    const st = ref(db, `users/${me.uid}/status`), ls = ref(db, `users/${me.uid}/lastSeen`);
    onDisconnect(st).set('offline'); onDisconnect(ls).set(serverTimestamp());
    set(st, 'online'); set(ls, serverTimestamp());
  });
  loadUser(me.uid);
}
function teardown(){
  if (chatsUnsub) { chatsUnsub(); chatsUnsub = null; }
  closeThread(true);
  Object.keys(chats).forEach(k => delete chats[k]); Object.keys(previews).forEach(k => delete previews[k]);
  Object.values(typingWatch).forEach(f => f()); Object.keys(typingWatch).forEach(k => delete typingWatch[k]); Object.keys(typingMap).forEach(k => delete typingMap[k]);
  kp = null; Object.keys(shared).forEach(k => delete shared[k]); decCache.clear();
}

/* =============== USERS =============== */
const userLoading = {};
function loadUser(uid){
  if (users[uid] || userLoading[uid]) return userLoading[uid] || Promise.resolve(users[uid]);
  return userLoading[uid] = get(ref(db, `users/${uid}`)).then(s => { users[uid] = s.exists() ? s.val() : { name: 'Unknown user' }; delete userLoading[uid]; return users[uid]; })
    .catch(() => { delete userLoading[uid]; users[uid] = { name: 'Unknown user' }; return users[uid]; });
}
const uName = uid => uid === me?.uid ? 'You' : (users[uid]?.name || users[uid]?.username || 'Haba user');
const uAvatar = uid => users[uid]?.photoURL || DEFAULT_AVATAR;

/* =============== CHAT LIST =============== */
function startChatList(){
  const r = ref(db, `user_chats/${me.uid}`);
  const cb = onValue(r, snap => {
    const v = snap.val() || {};
    Object.keys(chats).forEach(k => delete chats[k]);
    Object.entries(v).forEach(([uid, meta]) => { if (uid !== AI_UID && meta && typeof meta === 'object') chats[uid] = meta; });
    const uids = Object.keys(chats);
    uids.forEach(uid => {   // live "typing…" per conversation
      if (typingWatch[uid]) return;
      const tr = ref(db, `dm_threads/${threadIdFor(me.uid, uid)}/typing/${uid}`);
      const tcb = onValue(tr, s => { const v = !!s.val(); if (typingMap[uid] !== v) { typingMap[uid] = v; renderChatList(); } });
      typingWatch[uid] = () => off(tr, 'value', tcb);
    });
    Promise.all(uids.map(loadUser)).then(renderChatList);
    uids.forEach(async uid => {
      const t = chats[uid].text;
      const p = isE2E(t) ? await decText(uid, t) : (t || '');
      if (previews[uid] !== p) { previews[uid] = p; renderChatList(); }
    });
    renderChatList();
  }, err => { $('#chatlist').innerHTML = `<div class="empty">Couldn’t load chats.<br>${esc(err.message)}</div>`; });
  chatsUnsub = () => off(r, 'value', cb);
}
function fmtListTime(ts){
  if (!ts) return '';
  const d = new Date(ts), n = new Date();
  if (d.toDateString() === n.toDateString()) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const y = new Date(n); y.setDate(n.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { day: 'numeric', month: 'short' });
}
function renderChatList(){
  const q = $('#filter').value.trim().toLowerCase();
  const list = Object.entries(chats).filter(([uid]) => !q || uName(uid).toLowerCase().includes(q) || (users[uid]?.username || '').toLowerCase().includes(q))
    .sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0));
  let unread = 0;
  Object.values(chats).forEach(c => unread += c.unreadCount > 0 ? c.unreadCount : 0);
  document.title = (unread ? `(${unread}) ` : '') + 'Haba Messenger';
  const el = $('#chatlist');
  if (!list.length) { el.innerHTML = `<div class="empty">${q ? 'No chats match.' : 'No conversations yet.<br>Tap the pencil to start one.'}</div>`; return; }
  el.innerHTML = list.map(([uid, c]) => {
    const own = c.senderUid === me.uid;
    const online = users[uid]?.status === 'online';
    const pv = previews[uid] ?? (isE2E(c.text) ? '…' : c.text || '');
    return `<div class="ci ${uid === activeUid ? 'active' : ''}" data-uid="${esc(uid)}">
      <div class="av" style="background-image:url('${cssUrl(uAvatar(uid))}')">${online ? '<span class="dot"></span>' : ''}</div>
      <div class="mid"><div class="top"><span class="name">${esc(uid === me.uid ? 'My Account' : uName(uid))}</span><span class="time">${fmtListTime(c.timestamp)}</span></div>
      <div class="prev">${typingMap[uid] ? '<span class="tp">typing…</span>' : `<span>${own ? 'You: ' : ''}${esc(pv)}</span>`}${c.unreadCount > 0 ? `<div class="badge">${c.unreadCount > 99 ? '99+' : c.unreadCount}</div>` : ''}</div></div></div>`;
  }).join('');
}
$('#chatlist').addEventListener('click', e => { const ci = e.target.closest('.ci'); if (ci) openThread(ci.dataset.uid); });
$('#filter').addEventListener('input', renderChatList);

/* =============== THREAD =============== */
let chatHist = false;
function exitChat(){ if (chatHist) history.back(); else closeThread(); }   // popstate below does the real close
window.addEventListener('popstate', () => { if (!chatHist) return; chatHist = false; if (activeUid) closeThread(); });
function closeThread(silent){
  if (rec) stopRec(false);
  vnStop();
  threadUnsubs.forEach(f => f()); threadUnsubs = [];
  if (threadId && me && !silent) set(ref(db, `dm_threads/${threadId}/typing/${me.uid}`), false).catch(() => {});
  activeUid = null; threadId = null; rawMsgs = {}; replyTo = null;
  $('#thread').classList.add('hidden'); $('#placeholder').classList.remove('hidden');
  $('#app').classList.remove('chat-open');
  renderChatList();
}
async function openThread(uid){
  if (!me) return;
  if (activeUid) closeThread(true);
  activeUid = uid; threadId = threadIdFor(me.uid, uid); msgLimit = PAGE; rawMsgs = {}; firstLoad = true;
  otherLastRead = 0; otherTyping = false; iBlocked = false; theyBlocked = false; disappearing = 0; replyTo = null;
  $('#placeholder').classList.add('hidden'); $('#thread').classList.remove('hidden'); $('#app').classList.add('chat-open');
  if (!chatHist) { history.pushState({ hmChat: 1 }, ''); chatHist = true; }   // device back closes the chat, not the app
  $('#msgs').innerHTML = '<div class="spin"></div>'; $('#input').value = ''; autoGrow(); $('#replybar').classList.add('hidden');
  await loadUser(uid);
  if (activeUid !== uid) return;
  paintHeader();
  getPeerPub(uid, true).catch(() => {});

  const watch = (path, fn) => { const r = ref(db, path); const cb = onValue(r, fn); threadUnsubs.push(() => off(r, 'value', cb)); };
  watch(`users/${uid}`, s => { if (s.exists()) { users[uid] = s.val(); paintHeader(); } });
  watch(`dm_threads/${threadId}/readReceipts/${uid}`, s => { otherLastRead = s.val() || 0; paintTicks(); });
  watch(`dm_threads/${threadId}/typing/${uid}`, s => { otherTyping = !!s.val(); paintTyping(); });
  watch(`dm_threads/${threadId}/settings/disappearingSeconds`, s => { disappearing = s.val() || 0; });
  watch(`blocks/${me.uid}/${uid}`, s => { iBlocked = s.val() === true; paintBlocked(); });
  watch(`blocks/${uid}/${me.uid}`, s => { theyBlocked = s.val() === true; paintBlocked(); });
  const mq = query(ref(db, `dm_threads/${threadId}/messages`), orderByChild('createdAt'), limitToLast(msgLimit));
  const mcb = onValue(mq, s => { rawMsgs = s.val() || {}; renderMessages(); });
  msgUnsub = () => off(mq, 'value', mcb);
  threadUnsubs.push(() => msgUnsub && msgUnsub());
  update(ref(db, `user_chats/${me.uid}/${uid}`), { unreadCount: 0 }).catch(() => {});
  markRead();
  onDisconnect(ref(db, `dm_threads/${threadId}/typing/${me.uid}`)).set(false);
  renderChatList();
}
function loadOlder(){
  msgLimit += PAGE;
  if (msgUnsub) msgUnsub();
  const q = query(ref(db, `dm_threads/${threadId}/messages`), orderByChild('createdAt'), limitToLast(msgLimit));
  const cb = onValue(q, s => { rawMsgs = s.val() || {}; renderMessages(true); });
  msgUnsub = () => off(q, 'value', cb);
}
function markRead(){
  if (!threadId || localStorage.getItem('hm-receipts') === 'off') return;
  set(ref(db, `dm_threads/${threadId}/readReceipts/${me.uid}`), Date.now()).catch(() => {});
}
function paintHeader(){
  const u = users[activeUid] || {};
  $('#th-name').textContent = activeUid === me.uid ? 'My Account' : uName(activeUid);
  $('#th-av').style.backgroundImage = `url('${cssUrl(uAvatar(activeUid))}')`;
  let st = '';
  if (u.status === 'online') st = 'online';
  else if (u.lastSeen) st = 'last seen ' + fmtListTime(u.lastSeen);
  $('#th-status').textContent = otherTyping ? 'typing…' : st;
}
function paintBlocked(){
  const bl = $('#blocked'), comp = $('#composer');
  if (iBlocked || theyBlocked) { bl.textContent = iBlocked ? 'You blocked this contact. Unblock to send messages.' : 'You can’t send messages to this contact.'; bl.classList.remove('hidden'); comp.classList.add('hidden'); }
  else { bl.classList.add('hidden'); comp.classList.remove('hidden'); }
}
function paintTyping(){
  paintHeader();
  const box = $('#msgs'); let t = $('#typing-ind');
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 150;
  if (otherTyping && !t) { t = document.createElement('div'); t.id = 'typing-ind'; t.className = 'typing'; t.innerHTML = '<i></i><i></i><i></i>'; box.appendChild(t); if (near) box.scrollTop = box.scrollHeight; }
  else if (!otherTyping && t) t.remove();
}
function paintTicks(){
  document.querySelectorAll('.b.out .tick').forEach(el => {
    const seen = otherLastRead >= +el.dataset.ts;
    el.classList.toggle('seen', seen); el.textContent = seen ? '✓✓' : '✓';
  });
}
const dayLabel = ts => {
  const d = new Date(ts), n = new Date(), y = new Date(); y.setDate(n.getDate() - 1);
  if (d.toDateString() === n.toDateString()) return 'Today';

/* voice notes: hold to record · slide left to cancel · slide up to lock · release to send */
let rec = null, recChunks = [], recStart = 0, recTimer = null, recTick = null, recSampler = null, recCtx = null, recLevels = [], hold = null;
const micBtn = $('#btn-mic');
const fmtDur = s => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

async function startRec(){
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast('Voice notes aren’t supported here'); return false; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec = new MediaRecorder(stream); recChunks = []; recLevels = []; recStart = Date.now();
    rec.ondataavailable = e => e.data.size && recChunks.push(e.data);
    try {   // sample the mic level so the sent bubble can show a real waveform
      recCtx = new (window.AudioContext || window.webkitAudioContext)();
      const an = recCtx.createAnalyser(); an.fftSize = 512;
      recCtx.createMediaStreamSource(stream).connect(an);
      const buf = new Uint8Array(an.fftSize);
      recSampler = setInterval(() => { an.getByteTimeDomainData(buf); let s = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; s += v * v; } recLevels.push(Math.sqrt(s / buf.length)); }, 80);
    } catch {}
    rec.start();
    $('#composer').classList.add('recording'); micBtn.classList.add('rec');
    $('#rec-time').textContent = '0:00'; $('#rec-hint').textContent = '‹ Slide to cancel';
    recTick = setInterval(() => { $('#rec-time').textContent = fmtDur((Date.now() - recStart) / 1000); }, 250);
    recTimer = setTimeout(() => stopRec(true), 5 * 60 * 1000);
    return true;
  } catch { toast('Microphone permission denied'); return false; }
}
function makeWave(levels, n = 40){
  if (!levels.length) return null;
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = Math.floor(i * levels.length / n), b = Math.max(a + 1, Math.floor((i + 1) * levels.length / n));
    let m = 0; for (let j = a; j < b && j < levels.length; j++) m = Math.max(m, levels[j]); out.push(m);
  }
  const mx = Math.max(...out, 0.001);

}
function stopRec(send){

  const r = rec, dur = Math.round((Date.now() - recStart) / 1000), peer = activeUid, tid = threadId, wave = makeWave(recLevels);
  rec = null; if (hold) hold.locked = false;
  try { recCtx && recCtx.close(); } catch {} recCtx = null;
  $('#composer').classList.remove('recording', 'locked'); micBtn.classList.remove('rec'); micBtn.style.transform = ''; $('#rec-hint').style.cssText = '';

    const type = r.mimeType || 'audio/webm', blob = new Blob(recChunks, { type });

      const url = await getDownloadURL(snap.ref);
      const payload = withExpiry({ senderUid: me.uid, createdAt: Date.now(), mediaType: 'audio', mediaURL: url, duration: dur });
      if (wave) payload.waveform = wave;
      if (encrypted) { payload.mediaEncrypted = true; payload.mediaMimeType = type; mediaCache[url] = Promise.resolve(URL.createObjectURL(blob)); }
      await pushMessage(peer, payload, '🎤 Voice message');

  };

}
function endHold(){
  if (!rec) return;
  if ((Date.now() - recStart) < 1000) { stopRec(false); toast('Hold to record, release to send'); } else stopRec(true);

micBtn.addEventListener('contextmenu', e => e.preventDefault());
micBtn.addEventListener('pointerdown', async e => {
  if (rec && hold && hold.locked) { stopRec(true); return; }      // locked: tap the arrow to send
  if (rec || e.button > 0) return;
  e.preventDefault();

  const ok = await startRec();

  if (!h.down && !h.locked) endHold();                            // released while the permission prompt was open
});

  const dx = e.clientX - hold.x, dy = e.clientY - hold.y;

/* voice bubble player (one global Audio, so re-renders never interrupt playback) */
let vnAudio = null, vnKey = null, vnRate = 1;
function vnWave(m){
  if (Array.isArray(m.waveform) && m.waveform.length) return m.waveform;
  let h = 7; for (const c of m.key) h = (h * 31 + c.charCodeAt(0)) | 0;       // stable placeholder for notes without a waveform

}
const vnHTML = m => `<div class="vn" data-vn="${m.key}"><button class="vn-play" aria-label="Play voice message"><svg class="pl" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="pa" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button><div class="vn-mid"><div class="vn-wave">${vnWave(m).map(h => `<i style="height:${h}%"></i>`).join('')}</div><div class="vn-row"><span class="vn-time">${fmtDur(m.duration)}</span><button class="vn-spd">1×</button></div></div></div>`;

  });
}
function vnStop(){ if (vnAudio) vnAudio.pause(); vnAudio = null; vnKey = null; }
async function vnToggle(key, frac){
  const m = rawMsgs[key]; if (!m) return;

    else if (vnAudio.paused) vnAudio.play().catch(() => {}); else vnAudio.pause();
    return vnPaint();

async function doSearch(raw){
  const q = raw.trim().toLowerCase().replace(/^@/, ''), out = $('#nr'); if (!out) return;
  if (q.length < 2 || !/^[a-z0-9_.]+$/.test(q)) { out.innerHTML = '<div class="empty" style="padding:20px">Type at least 2 letters of a username</div>'; return; }
  out.innerHTML = '<div class="spin"></div>';
  try {
    const s = await get(query(ref(db, 'usernames'), orderByKey(), startAt(q), endAt(q + '\uf8ff'), limitToFirst(10)));
    const uids = []; s.forEach(c => { if (typeof c.val() === 'string') uids.push(c.val()); });
    await Promise.all(uids.map(loadUser));
    if (!$('#nr')) return;
    const list = uids.filter(u => u !== me.uid);
    $('#nr').innerHTML = list.length ? list.map(uid => `<div class="res" data-uid="${esc(uid)}"><div class="av sm" style="background-image:url('${cssUrl(uAvatar(uid))}')"></div><div><b>${esc(uName(uid))}</b><small>@${esc(users[uid]?.username || '')}</small></div></div>`).join('') : '<div class="empty" style="padding:20px">No one found</div>';
    $('#nr').querySelectorAll('.res').forEach(el => el.onclick = () => { closeModal(); openThread(el.dataset.uid); });
  } catch (e) { $('#nr') && ($('#nr').innerHTML = '<div class="empty" style="padding:20px">Search failed</div>'); }
}

/* encryption banner + unlock */
function renderBanner(){
  const b = $('#banner');
  if (keyState === 'ready') return b.classList.add('hidden');
  b.classList.remove('hidden');
  if (keyState === 'nobackup') { $('#banner-text').textContent = 'Encrypted messages can’t be read here yet: this account has no key backup. Set a backup PIN in the Haba app (Settings → Privacy), then sign in again.'; $('#banner-btn').classList.add('hidden'); }
  else { $('#banner-text').textContent = 'Enter your backup PIN to read and send encrypted messages.'; $('#banner-btn').classList.remove('hidden'); }
}
$('#banner-btn').onclick = () => promptUnlock();
function promptUnlock(auto){
  if (keyState === 'nobackup') return toast('No key backup found for this account');
  const ov = modal(`<h3>Unlock encrypted chats</h3><p style="color:var(--muted);margin:0 0 14px">Enter the backup PIN you set in the Haba app. It never leaves this device — it only unlocks your key here.</p><input class="field" id="pin" type="password" placeholder="Backup PIN" autocomplete="off" inputmode="text"><div class="err" id="pin-err"></div><button class="btn" id="pin-go">Unlock</button><button class="btn ghost" id="pin-skip" style="margin-top:8px">${auto ? 'Not now' : 'Cancel'}</button>`);
  const pin = ov.querySelector('#pin'); pin.focus();
  const go = async () => {
    if (!pin.value) return;
    ov.querySelector('#pin-go').disabled = true; ov.querySelector('#pin-err').textContent = 'Checking… this takes a moment';
    const r = await restoreFromPin(pin.value);
    if (r === 'ok') { closeModal(); renderBanner(); decCache.clear(); toast('Unlocked'); Object.keys(chats).forEach(async uid => { previews[uid] = await decText(uid, chats[uid].text); renderChatList(); }); if (activeUid) renderMessages(); }
    else { ov.querySelector('#pin-go').disabled = false; ov.querySelector('#pin-err').textContent = r === 'mismatch' ? 'This backup doesn’t match your current key.' : r === 'nobackup' ? 'No backup found.' : 'Wrong PIN. Try again.'; }
  };
  ov.querySelector('#pin-go').onclick = go;
  pin.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  ov.querySelector('#pin-skip').onclick = closeModal;
}

/* mobile keyboard: keep the composer above the keyboard */
if (window.visualViewport) {
  const fit = () => { const h = window.visualViewport.height; $('#app').style.height = h + 'px'; $('#main').style.height = h + 'px'; if (matchMedia('(max-width:760px)').matches) { $('#main').style.top = window.visualViewport.offsetTop + 'px'; } };
  window.visualViewport.addEventListener('resize', fit); window.visualViewport.addEventListener('scroll', fit);
  input.addEventListener('focus', () => setTimeout(() => { const b = $('#msgs'); b.scrollTop = b.scrollHeight; }, 300));
}
/* block long-press menus and text selection everywhere except inside text fields (so paste still works) */
const inField = t => { const el = t && t.nodeType === 3 ? t.parentElement : t; return !!(el && el.closest && el.closest('input,textarea')); };
document.addEventListener('contextmenu', e => { if (!inField(e.target)) e.preventDefault(); });
document.addEventListener('selectstart', e => { if (!inField(e.target)) e.preventDefault(); });
document.addEventListener('dragstart', e => { if (!inField(e.target)) e.preventDefault(); });
window.addEventListener('beforeunload', () => { if (threadId && me) set(ref(db, `dm_threads/${threadId}/typing/${me.uid}`), false); });
</script>
