<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Haba Messenger</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='45' fill='%23000'/%3E%3Cpath d='M54 55a13 13 0 0 1 26 0V200H54Z' fill='%23FFF'/%3E%3Cpath d='M67 114C67 88 88 78 108 78C132 78 142 94 142 116L142 200' fill='none' stroke='%23FFF' stroke-width='26' stroke-linejoin='round'/%3E%3Ccircle cx='148' cy='46' r='13' fill='%23FFB020'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --surface:#fff; --alt:#F7F8FA; --input:#F0F2F5; --border:#EDEDED;
  --text:#111; --muted:#888; --inverse:#fff; --primary:#111;
  --in-bg:#fff; --in-text:#111B21; --out-bg:#111; --out-text:#fff;
  --in-time:rgba(0,0,0,.45); --out-time:rgba(255,255,255,.75); --seen:#53BDEB;
  --chat-bg:#EFEFF2; --danger:#FF453A; --accent:#FFB020;
  --brand:'Michroma',system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#000; --surface:#1C1C1E; --alt:#111; --input:#2C2C2E; --border:#2C2C2E;
  --text:#F2F2F7; --muted:#98989D; --inverse:#111; --primary:#F2F2F7;
  --in-bg:#202C33; --in-text:#E9EDEF; --out-bg:#3A3A3C; --out-text:#fff;
  --in-time:rgba(255,255,255,.55); --chat-bg:#0B0B0C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.brand{font-family:var(--brand);font-size:20px;letter-spacing:.5px}
.brand i{color:var(--accent);font-style:normal}

/* auth */
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.card{width:100%;max-width:380px}
.card h1{margin:0 0 4px}
.card p.sub{color:var(--muted);margin:0 0 22px}
.tabs{display:flex;background:var(--input);border-radius:50px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:9px;border-radius:50px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.field{width:100%;padding:14px 18px;border-radius:50px;border:1px solid transparent;background:var(--input);margin-bottom:10px;outline:none}
.field:focus{border-color:var(--primary)}
.btn{width:100%;padding:14px;border-radius:50px;background:var(--primary);color:var(--inverse);font-weight:700;margin-top:4px}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--input);color:var(--text)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:6px 4px}
.row{display:flex;gap:8px}
.row .field:first-child{max-width:90px}

/* app layout */
#app{height:100%;display:flex}
#side{width:380px;max-width:100%;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface);min-width:0}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chat-bg);position:relative}
.bar{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 14px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
.bar .grow{flex:1;min-width:0}
.icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon:hover{background:var(--input)}
.icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.searchwrap{padding:10px 14px}
.searchwrap input{width:100%;padding:11px 16px;border-radius:50px;border:none;background:var(--input);outline:none}
#chatlist{flex:1;overflow-y:auto}
.ci{display:flex;gap:12px;padding:11px 14px;cursor:pointer;align-items:center}
.ci:hover,.ci.active{background:var(--alt)}
.av{width:48px;height:48px;border-radius:50%;background:#000 center/cover no-repeat;flex-shrink:0;position:relative}
.av.sm{width:40px;height:40px}
.dot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#34C759;border:2px solid var(--surface)}
.ci .mid{flex:1;min-width:0}
.ci .top{display:flex;justify-content:space-between;gap:8px}
.ci .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .time{font-size:12px;color:var(--muted);flex-shrink:0}
.ci .prev{display:flex;gap:8px;align-items:center;margin-top:2px}
.ci .prev span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.shim{position:relative}
.shim::after{content:'';position:absolute;inset:0;border-radius:inherit;z-index:2;pointer-events:none;background:linear-gradient(100deg,rgba(128,128,128,.28) 30%,rgba(255,255,255,.45) 50%,rgba(128,128,128,.28) 70%) 100% 0/300% 100%;animation:shm 1.25s linear infinite}
:root[data-theme="dark"] .shim::after{background:linear-gradient(100deg,rgba(90,90,95,.55) 30%,rgba(150,150,158,.55) 50%,rgba(90,90,95,.55) 70%) 100% 0/300% 100%}
@keyframes shm{to{background-position:0 0}}
.av .dot{z-index:3}
.iw{display:block;position:relative;border-radius:10px;overflow:hidden;margin-bottom:4px;max-width:100%;cursor:zoom-in}
.iw img{margin:0!important}
.mwrap.shim{min-width:200px;min-height:140px}
.mwrap.shim::after{border-radius:10px}
.verified-badge{width:16px;height:16px;flex-shrink:0;vertical-align:middle;position:relative;top:-1px;margin-left:4px;display:inline-block}
.badge{background:var(--primary);color:var(--inverse);border-radius:50px;font-size:12px;font-weight:700;min-width:20px;height:20px;padding:0 6px;display:flex;align-items:center;justify-content:center}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 30px;min-height:min(58vh,460px);color:var(--text)}
.es .art{width:150px;height:150px;margin-bottom:18px;animation:esf 4s ease-in-out infinite}
.es h3{margin:0 0 6px;font-size:20px;font-weight:800}.es p{margin:0 0 18px;color:var(--muted);font-size:15px;line-height:1.45;max-width:280px}
.es .pgbtn{padding:12px 26px;font-size:15px}
.es .art .a{fill:var(--accent)}.es .art .s{stroke:var(--text);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.es .art .t{fill:var(--input)}
@keyframes esf{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){.es .art{animation:none}}

#banner{background:#FFF4D6;color:#5a4300;padding:9px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
#banner button{background:#111;color:#fff;border-radius:50px;padding:6px 12px;font-weight:600;font-size:12px;flex-shrink:0}
:root[data-theme="dark"] #banner{background:#3a2f0b;color:#ffe9a8}

/* thread */
#placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:10px;text-align:center;padding:20px}
#thread{flex:1;display:flex;flex-direction:column;min-height:0}
#msgs .es{flex:1;min-height:0}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;background:var(--surface);color:var(--muted);font-size:12px;padding:4px 12px;border-radius:50px;margin:10px 0;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.b{max-width:min(78%,520px);padding:7px 10px 5px;border-radius:16px;position:relative;word-wrap:break-word;overflow-wrap:anywhere;box-shadow:0 1px .5px rgba(0,0,0,.13);cursor:pointer}
.b.in{align-self:flex-start;background:var(--in-bg);color:var(--in-text);border-bottom-left-radius:4px}
.b.out{align-self:flex-end;background:var(--out-bg);color:var(--out-text);border-bottom-right-radius:4px}
.b .t{white-space:pre-wrap;line-height:1.35;font-size:var(--msgsz,15px)}
.b .t a,.b .tr a{color:#0B5FFF;text-decoration:underline;text-underline-offset:2px;word-break:break-all;cursor:pointer;-webkit-tap-highlight-color:rgba(11,95,255,.25)}
.b .t a:visited,.b .tr a:visited{color:#0B5FFF}
.b.out .t a,.b.out .tr a,.b.out .t a:visited{color:#6CB6FF}
:root[data-theme="dark"] .b .t a,:root[data-theme="dark"] .b .t a:visited{color:#6CB6FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b .t a,:root:not([data-theme="light"]) .b .t a:visited{color:#6CB6FF}}
.b .meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;margin-top:2px}
.b.in .meta{color:var(--in-time)} .b.out .meta{color:var(--out-time)}
.tick.seen{color:var(--seen)}
.b.del{font-style:italic;opacity:.7}
.b img,.b video{max-width:100%;max-height:340px;border-radius:10px;display:block;margin-bottom:4px;background:rgba(0,0,0,.08)}
.b img{min-width:140px;min-height:100px;object-fit:cover}
.b audio{max-width:240px;height:38px}
.quote{border-left:3px solid var(--accent);background:rgba(128,128,128,.15);border-radius:8px;padding:5px 8px;margin-bottom:5px;font-size:13px;opacity:.9;max-height:60px;overflow:hidden}
.quote b{display:block;font-size:12px}
.file{display:flex;gap:8px;align-items:center;padding:6px 2px}
.sys{align-self:center;font-size:12px;color:var(--muted);margin:6px 0}
.typing{align-self:flex-start;background:var(--in-bg);padding:10px 14px;border-radius:16px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
#more{align-self:center;background:var(--surface);border-radius:50px;padding:6px 14px;font-size:12px;color:var(--muted);margin-bottom:8px}
#replybar{display:flex;align-items:center;gap:10px;background:var(--surface);border-top:1px solid var(--border);padding:8px 14px}
#replybar .q{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:8px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#composer{display:flex;align-items:flex-end;gap:6px;padding:8px 10px calc(8px + var(--sab));background:var(--surface);border-top:1px solid var(--border)}
#composer textarea{flex:1;resize:none;max-height:130px;min-height:42px;padding:11px 16px;border-radius:22px;border:none;background:var(--input);outline:none;line-height:1.3}
#send{background:var(--primary);color:var(--inverse)}
#send:hover{background:var(--primary)}
.rec{color:var(--danger)}
#blocked{padding:16px;text-align:center;color:var(--muted);background:var(--surface);border-top:1px solid var(--border)}

/* menus, modals, toast */
#menu{position:fixed;z-index:135;background:var(--surface);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.25);padding:6px;min-width:170px}
#menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px}
#menu button:hover{background:var(--input)}
#menu .danger{color:var(--danger)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:20px;max-height:80%;overflow:auto;padding-bottom:calc(20px + var(--sab))}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px}}
.sheet h3{margin:0 0 12px}
.res{display:flex;gap:12px;align-items:center;padding:9px 4px;cursor:pointer;border-radius:10px}
.res:hover{background:var(--alt)}
.res small{color:var(--muted);display:block}
/* chat long-press sheet rows */
.sh{display:block;width:100%;text-align:left;padding:15px 8px;font-size:16px;border-radius:10px}
.sh:hover{background:var(--input)}
.sh.danger{color:var(--danger)}
/* bottom snackbar for alerts */
#toast{position:fixed;left:50%;bottom:calc(76px + var(--sab));width:min(460px,calc(100% - 24px));transform:translate(-50%,24px);background:#2B2B2E;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.35;z-index:99;opacity:0;pointer-events:none;transition:opacity .22s,transform .28s cubic-bezier(.2,.9,.3,1.1);display:flex;align-items:center;gap:12px;box-shadow:0 6px 22px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast span{flex:1}
#toast button{color:var(--accent);font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.4px;padding:4px 2px;flex-shrink:0}
:root[data-theme="dark"] #toast{background:#3A3A3C}

/* top slide-in notification */
#notif{position:fixed;left:50%;top:calc(10px + var(--sat));width:min(440px,calc(100% - 20px));transform:translate(-50%,-160%);z-index:90;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:18px;box-shadow:0 10px 32px rgba(0,0,0,.3);padding:10px 14px;display:flex;gap:12px;align-items:center;transition:transform .38s cubic-bezier(.2,.9,.3,1.08);cursor:pointer;touch-action:none;pointer-events:none}
#notif.show{transform:translate(-50%,0);pointer-events:auto}
#notif .nmid{flex:1;min-width:0}
#notif .nmid b,#notif .nmid span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#notif .nmid span{color:var(--muted);font-size:14px;margin-top:1px}
.spin{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:760px){
  #side{width:100%;border-right:none}
  #main{position:fixed;inset:0;transform:translateX(100%);transition:transform .25s ease;z-index:20}
  #app.chat-open #main{transform:none}
  .back{display:flex!important}
}
.back{display:none}

/* ---- voice notes ---- */
#composer{position:relative}
#recbar{display:none;flex:1;align-items:center;gap:10px;min-height:42px;padding:0 6px;min-width:0}
#composer.recording #btn-attach,#composer.recording #input,#composer.recording #send{display:none}
#composer.recording #recbar{display:flex}
.recdot{width:11px;height:11px;border-radius:50%;background:var(--danger);flex-shrink:0;animation:recp 1s infinite}
@keyframes recp{50%{opacity:.25}}
#rec-time{font-variant-numeric:tabular-nums;font-weight:600;min-width:38px}
#rec-hint{flex:1;text-align:center;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;will-change:transform,opacity}
#rec-cancel{display:none;color:var(--danger)}
#composer.locked #rec-cancel{display:flex}
#composer.ai #btn-attach,#composer.ai #btn-mic{display:none!important}
#composer .ic-emoji{display:none}
#composer.emo-mode .ic-media{display:none}
#composer.emo-mode .ic-emoji{display:block}
#composer.emo-mode #btn-attach{color:var(--accent)}
#emopanel{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:2px;max-height:210px;overflow-y:auto;padding:8px 10px;background:var(--surface);border-top:1px solid var(--border);-webkit-overflow-scrolling:touch}
#emopanel.hidden{display:none}
#emopanel button{font-size:24px;line-height:1;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
#emopanel button:hover{background:var(--input)}
#emopanel .lbl{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--muted);padding:4px 4px 0}
#btn-mic{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s,background .15s}
#btn-mic .ic-send{display:none}
#btn-mic.rec{background:var(--danger);color:#fff;transform:scale(1.35);z-index:2}
#composer.locked #btn-mic{background:var(--primary);color:var(--inverse);transform:none}
#composer.locked #btn-mic .ic-mic{display:none}
#composer.locked #btn-mic .ic-send{display:block}
#reclock{display:none;position:absolute;right:8px;bottom:calc(66px + var(--sab));width:40px;height:58px;border-radius:20px;background:var(--surface);box-shadow:0 4px 16px rgba(0,0,0,.25);flex-direction:column;align-items:center;justify-content:center;font-size:15px;color:var(--muted);gap:2px}
#reclock small{font-size:9px}
#composer.recording:not(.locked) #reclock{display:flex}

/* voice bubble */
.vn{display:flex;align-items:center;gap:10px;width:240px;max-width:100%;padding:2px 0}
.vn-play{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#111;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vn-play svg{width:18px;height:18px;fill:currentColor}
.vn-play .pa{display:none}
.vn.playing .vn-play .pa{display:block}
.vn.playing .vn-play .pl{display:none}
.vn-mid{flex:1;min-width:0}
.vn-wave{display:flex;align-items:center;gap:2px;height:30px;cursor:pointer}
.vn-wave i{flex:1;min-width:2px;border-radius:2px;background:currentColor;opacity:.3}
.vn-wave i.on{opacity:1}
.b.out .vn-wave i.on{background:var(--accent)}
.b.in .vn-wave i.on{background:var(--seen)}
.vn-row{display:flex;align-items:center;justify-content:space-between;margin-top:1px}
.vn-time{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
.vn-spd{display:none;font-size:11px;font-weight:700;padding:1px 8px;border-radius:50px;background:rgba(128,128,128,.25)}
.vn.playing .vn-spd{display:inline-block}

/* iMessage-style typing bubble + message pop-in */
.typing{align-self:flex-start;position:relative;background:var(--in-bg);padding:13px 16px;border-radius:20px;display:flex;gap:5px;align-items:center;margin:4px 0 2px 6px;transform-origin:left bottom;animation:tpop .3s cubic-bezier(.2,1.3,.4,1);box-shadow:0 1px .5px rgba(0,0,0,.13)}
.typing.still{animation:none}
.typing::before,.typing::after{content:'';position:absolute;border-radius:50%;background:var(--in-bg)}
.typing::before{width:12px;height:12px;left:-3px;bottom:0}
.typing::after{width:6px;height:6px;left:-8px;bottom:-4px}
.typing i{width:8px;height:8px;background:#9A9AA0;animation:tdot 1.3s infinite}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
@keyframes tpop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.b.pop{animation:bpop .3s cubic-bezier(.2,1.25,.4,1)}
.b.in.pop{transform-origin:left bottom}
.b.out.pop{transform-origin:right bottom}
@keyframes bpop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* category pills */
#pills{display:flex;gap:8px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
#pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:7px 16px;border-radius:50px;background:var(--input);color:var(--text);font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s,color .15s}
.pill.on{background:var(--primary);color:var(--inverse)}

/* typing text in chat list */
.av{cursor:pointer}
.ci .prev span.tp{color:#34C759;font-weight:600}

/* no long-press menus / selection anywhere except text fields */
html,body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
img,video,a{-webkit-touch-callout:none;-webkit-user-drag:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}

/* message reactions + long-press popup */
.b.hasrx{margin-bottom:14px}
.rx{position:absolute;bottom:-13px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:50px;padding:1px 7px;font-size:13px;line-height:1.5;box-shadow:0 1px 3px rgba(0,0,0,.18);white-space:nowrap}
.b.out .rx{right:8px}.b.in .rx{left:8px}
.rx.mine{border-color:var(--accent)}
.rx-ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.28)}
.rx-bar{position:absolute;display:flex;flex-wrap:wrap;gap:2px;align-items:center;background:var(--surface);border-radius:30px;padding:6px 8px;box-shadow:0 8px 28px rgba(0,0,0,.3);max-width:calc(100% - 16px)}
.rx-bar.grid{border-radius:22px;width:min(320px,calc(100% - 16px))}
.rx-bar button{font-size:26px;line-height:1;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.rx-bar button:active{transform:scale(1.25)}
.rx-bar button.sel{background:var(--input)}
.rx-bar .plus{font-size:22px;color:var(--muted);background:var(--input)}

/* settings page */

#settings .about{position:absolute;left:50%;bottom:calc(100% + 2px);transform:translateX(-50%);max-width:240px;background:var(--surface);color:var(--text);border-radius:22px;padding:9px 18px;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.14);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#settings .sname i{width:11px;height:11px;border-radius:50%;background:#34C759;flex-shrink:0}
#settings .suser{text-align:center;color:var(--muted);margin:4px 0 26px}
.srow{display:flex;align-items:center;gap:22px;padding:15px 26px;cursor:pointer}
.srow:hover{background:var(--alt)}
.srow>svg{width:25px;height:25px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.srow .st{flex:1;min-width:0}
.srow .st b{display:block;font-size:17px;font-weight:600}
.srow .st span{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.srow.danger .st b,.srow.danger>svg{color:var(--danger);stroke:var(--danger)}
.srow.prem{margin:12px 16px 8px;padding:14px 16px;gap:14px;border-radius:18px;background:linear-gradient(135deg,rgba(10,132,255,.16),rgba(10,132,255,.05));border:1px solid rgba(10,132,255,.38)}

.srow.prem .pbtn{background:#0A84FF;color:#fff;border-radius:50px;padding:8px 16px;font-weight:700;font-size:13px;flex-shrink:0}
.b .tr{margin-top:6px;padding-top:6px;border-top:1px solid rgba(128,128,128,.4);white-space:pre-wrap;line-height:1.35;font-size:var(--msgsz,15px)}
.b .tr i{display:block;font-style:normal;font-size:11px;opacity:.7;margin-top:3px}
.lng{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 4px;border-bottom:1px solid var(--border);text-align:left;font-size:15px}
.lng.on{font-weight:700}.lng.on::after{content:'✓';color:var(--primary)}
.skp{background:var(--chat-bg);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;margin:14px 0 4px}
.skp div{max-width:78%;padding:8px 12px;border-radius:16px;font-size:14px;line-height:1.3}
.skp .a{background:var(--in-bg);color:var(--in-text);align-self:flex-start;border-bottom-left-radius:5px}
.skp .b{background:var(--out-bg);color:var(--out-text);align-self:flex-end;border-bottom-right-radius:5px}
.skg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.skn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;font-size:12.5px;font-weight:600;color:var(--muted)}
.skn span{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.skn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:none}
.skn.on{color:var(--text);background:var(--input)}
.skn.on span{box-shadow:0 0 0 3px var(--surface),0 0 0 5px currentColor}

.srow.prem .pon{display:inline-block;background:#0A84FF;color:#fff;border-radius:50px;padding:1px 9px;font-size:11px;font-weight:700;margin-left:8px;vertical-align:middle}
.pperk{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.pperk svg{width:22px;height:22px;stroke:#0A84FF;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin-top:1px}
.pperk b{display:block;font-size:15px}.pperk span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
#prem-pay{width:100%;padding:14px;border-radius:50px;background:#0A84FF;color:#fff;font-weight:700;font-size:16px;margin-top:10px}

.sw{width:46px;height:26px;border-radius:13px;background:var(--input);border:1px solid var(--border);position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}

.sw.on::after{transform:translateX(20px);background:var(--inverse)}

#settings .htop .icon+.icon{margin-left:auto}

.ep-row{display:flex;gap:8px;margin-top:4px}
.blk{display:flex;align-items:center;gap:12px;padding:9px 2px}

#side{position:relative}

#ct-list{flex:1;overflow-y:auto;padding-bottom:calc(16px + var(--sab))}
.crow{display:flex;gap:14px;align-items:center;padding:10px 18px;cursor:pointer}

.crow .cic{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#111;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.csec{padding:16px 18px 6px;color:var(--muted);font-size:14px;font-weight:600}

/* pages */
#pages{position:fixed;inset:0;z-index:72;background:var(--bg);display:flex;flex-direction:column}
@media(min-width:761px){#pages{right:auto;width:380px;border-right:1px solid var(--border)}}
#pg-body{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav-h) + 16px)}
#pg-tabs{display:flex;gap:8px;padding:10px 14px}
.pgav{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0;background-size:cover;background-position:center}
.pgrow{display:flex;gap:12px;align-items:center;padding:10px 16px;cursor:pointer}
.pgrow:hover{background:var(--alt)}
.pgrow .mid{flex:1;min-width:0}
.pgrow .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pgbtn{padding:7px 16px;border-radius:50px;background:var(--primary);color:var(--inverse);font-weight:600;font-size:13px;flex-shrink:0}

.pgcover{height:120px;background-size:cover;background-position:center}
.pghead{padding:0 16px 12px;margin-top:-30px}

.pgcta{background:var(--input);border-radius:14px;margin:0 14px 8px;padding:12px 14px}
select.field{appearance:none}
/* dark mode: true black everywhere, including bars and bottom nav */

:root[data-theme="dark"] #bnav .nb,:root[data-theme="dark"] #bnav .nd,:root[data-theme="dark"] .dot{border-color:#000}
:root[data-theme="dark"] html,:root[data-theme="dark"] body{background:#000}
/* status music */
.musb{height:40px;max-width:46vw;padding:0 14px;border-radius:22px;background:rgba(0,0,0,.4);color:#fff;display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;flex-shrink:0}

.musb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.musb.on{background:var(--accent);color:#111}
#msheet{position:fixed;inset:0;z-index:140;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}

.mrow{display:flex;gap:12px;align-items:center;padding:8px 2px;cursor:pointer}

.mrow .mid{flex:1;min-width:0}

#mtabs,#msub{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;flex-shrink:0}

.mhero{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:8px 0 4px}
.mcard{flex:0 0 88%;scroll-snap-align:center;display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:var(--input);border:1px solid var(--border)}
.mdots{display:flex;gap:5px;justify-content:center;padding:4px 0 6px}
.mdots i{width:6px;height:6px;border-radius:50%;background:var(--border)}.mdots i.on{background:var(--accent)}
.mrow .art,.mcard .art{position:relative;width:52px;height:52px;border-radius:8px;background:var(--input) center/cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff}
.mrow .art svg,.mcard .art svg{filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.mcard .mid{flex:1;min-width:0}.mcard .mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mcard .mid span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:13px}
.mst,.mgo{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text)}

#sv-music{position:absolute;top:calc(74px + var(--sat));left:50%;transform:translateX(-50%);z-index:7;max-width:80%;display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;background:rgba(0,0,0,.45);font-size:13px;font-weight:600;pointer-events:none}

#sv-bot .pill2{background:rgba(0,0,0,.45);color:#fff;border-radius:22px;padding:0 16px;height:40px;display:flex;align-items:center;gap:8px;font-weight:600}
#sv-bot .pill2 svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#sv-rx{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(66px + var(--sab));z-index:9;display:flex;gap:4px;padding:6px 8px;border-radius:30px;background:rgba(30,30,30,.92);box-shadow:0 6px 24px rgba(0,0,0,.5)}
#sv-rx button{font-size:26px;width:44px;height:44px;border-radius:50%;line-height:1}#sv-rx button.on{background:rgba(255,255,255,.2)}
#sv-like span{font-size:21px;line-height:1}
.cmt{display:flex;gap:10px;padding:8px 0}.cmt .b{flex:1;min-width:0}.cmt b{font-size:14px}.cmt small{color:var(--muted);margin-left:6px}.cmt p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}.cmt .x{color:var(--muted);font-size:20px;padding:0 6px}
#cm-list{max-height:48vh;overflow-y:auto;margin-bottom:8px}
#cm-row{display:flex;gap:8px;align-items:center}#cm-row input{flex:1}
#stx,#smd{position:fixed;inset:0;z-index:125;display:flex;flex-direction:column;color:#fff}
#stx .top,#smd .top{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 12px 10px}
#stx .top .grow,#smd .top .grow{flex:1}
.postb{background:var(--accent);color:#111;font-weight:800;border-radius:22px;padding:0 20px;height:40px}
.postb:disabled{opacity:.5}
#smd{background:#000}
#smd .prev{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#smd .prev img,#smd .prev video{max-width:100%;max-height:100%;object-fit:contain}
#smd .capw{padding:10px 14px calc(14px + var(--sab));display:flex;gap:10px;align-items:center}
#smd .capw input{flex:1;background:rgba(255,255,255,.14);border:0;outline:0;color:#fff;border-radius:22px;padding:12px 16px;font-size:15px;user-select:text;-webkit-user-select:text}
#smd .capw input::placeholder{color:rgba(255,255,255,.6)}
#smd .cnt{position:absolute;top:10px;right:12px;background:rgba(0,0,0,.55);border-radius:12px;padding:3px 10px;font-size:13px;font-weight:600}
#stx textarea{flex:1;min-height:0;background:transparent;border:0;outline:0;color:#fff;text-align:center;font-size:28px;line-height:1.25;font-weight:700;resize:none;padding:20px 28px;user-select:text;-webkit-user-select:text}
#stx textarea::placeholder{color:rgba(255,255,255,.6)}
#stx .fonts,#stx .stxc{flex:0 0 auto;display:flex;flex-wrap:nowrap;align-items:center;gap:10px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:6px 14px;scroll-snap-type:x proximity}
#stx .fonts::-webkit-scrollbar,#stx .stxc::-webkit-scrollbar,#smd-strip::-webkit-scrollbar{display:none}
#stx .fonts button{flex:0 0 auto;padding:8px 16px;border-radius:20px;background:rgba(255,255,255,.18);color:#fff;font-size:16px;border:2px solid transparent;white-space:nowrap}
#stx .fonts button.on{border-color:#fff;background:rgba(255,255,255,.3)}
#stx .stxc{padding:6px 14px calc(16px + var(--sab));min-height:calc(58px + var(--sab))}
#stx .stxc i{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.45);cursor:pointer;scroll-snap-align:center;box-sizing:border-box}
#stx .stxc i.on{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.3)}
.sheet.e2e{animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.e2e .grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:-8px auto 14px}
.e2e h3{text-align:center;margin:0 0 4px;font-size:19px}
.e2e .sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 6px}
.e2e .art{color:var(--text);display:block;width:100%;max-width:340px;margin:6px auto 10px}
.e2e .pt{display:flex;gap:12px;align-items:flex-start;margin:12px 0}
.e2e .pt i{flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent);color:#111;font-style:normal;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.e2e .pt b{display:block;font-size:15px;margin-bottom:2px}
.e2e .pt span{display:block;color:var(--muted);font-size:13.5px;line-height:1.4}
.e2e .fine{color:var(--muted);font-size:12px;text-align:center;margin:10px 0 14px}
.e2e .how{display:block;margin:12px auto 0;background:none;border:0;color:var(--accent);font-weight:600;font-size:13.5px;padding:6px}
#smd-trim{display:none;padding:8px 20px 4px;user-select:none;-webkit-user-select:none}
#smd-trim.on{display:block}
#smd-trim .tt{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:8px;color:rgba(255,255,255,.9)}
#smd-trim .tt b{color:var(--accent)}
#smd-trim .trk{position:relative;height:42px;border-radius:8px;background:rgba(255,255,255,.16);touch-action:none}
#smd-trim .sel{position:absolute;top:0;bottom:0;border-top:3px solid var(--accent);border-bottom:3px solid var(--accent);background:rgba(255,255,255,.18);cursor:grab;touch-action:none}
#smd-trim .h{position:absolute;top:-3px;bottom:-3px;width:18px;background:var(--accent);display:flex;align-items:center;justify-content:center;cursor:ew-resize;touch-action:none}
#smd-trim .h::after{content:'';width:3px;height:16px;border-radius:2px;background:rgba(0,0,0,.55)}
#smd-trim .h.l{left:-2px;border-radius:8px 0 0 8px}
#smd-trim .h.r{right:-2px;border-radius:0 8px 8px 0}
#smd-trim .hint{font-size:11.5px;color:rgba(255,255,255,.6);margin-top:6px}
#smd-strip{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;align-items:center}
#smd-strip .th{position:relative;flex:0 0 auto;width:54px;height:54px;border-radius:10px;overflow:hidden;border:2px solid transparent;background:#222;cursor:pointer}
#smd-strip .th.on{border-color:var(--accent)}
#smd-strip .th img,#smd-strip .th video{width:100%;height:100%;object-fit:cover;pointer-events:none}
#smd-strip .th b{position:absolute;top:0;right:0;width:20px;height:20px;border-radius:0 0 0 8px;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
#smd-strip .th.add{display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;border:2px dashed rgba(255,255,255,.4);background:transparent}
#upbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:150;pointer-events:none;opacity:0;transition:opacity .2s}
#upbar.on{opacity:1}
#upbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s;border-radius:0 2px 2px 0}
.upjob .uth{width:46px;height:46px;border-radius:10px;overflow:hidden;background:var(--input);flex-shrink:0;margin:0 6px 0 6px}
.upjob .uth img,.upjob .uth video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.upjob .pb{height:4px;border-radius:2px;background:var(--input);margin-top:7px;overflow:hidden}
.upjob .pb i{display:block;height:100%;background:var(--accent);transition:width .25s}
.upjob.err .mid b{color:var(--danger)}
.upjob .uadd{font-size:20px}

/* ---- groups ---- */
#groups{position:fixed;inset:0;z-index:72;background:var(--bg);display:flex;flex-direction:column}
@media(min-width:761px){#groups{right:auto;width:380px;border-right:1px solid var(--border)}}
#gr-tabs{display:flex;gap:8px;padding:10px 14px}
#gr-body{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav-h) + 16px)}
#groups.chat #gr-body{padding-bottom:6px;background:var(--chat-bg)}
body.gr-chat #bnav{display:none}
#gr-msgs{display:flex;flex-direction:column;gap:3px;padding:14px 12px}
.b .gname{font-size:12.5px;font-weight:700;margin-bottom:2px}
#gr-composer{display:flex;align-items:flex-end;gap:6px;padding:8px 10px calc(8px + var(--sab));background:var(--surface);border-top:1px solid var(--border)}
#gr-composer textarea{flex:1;resize:none;max-height:130px;min-height:42px;padding:11px 16px;border-radius:22px;border:none;background:var(--input);outline:none;line-height:1.3}
#gr-send{background:var(--primary);color:var(--inverse)}
.grhero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px 24px}
.grhero h2{margin:14px 0 4px;font-size:22px}
.grhero p{margin:6px 0 18px;color:var(--muted);white-space:pre-wrap;max-width:320px}
.grhero .pgbtn{padding:12px 34px;font-size:15px}
.grpick{max-height:230px;overflow-y:auto;margin:4px 0 10px;border-radius:12px}
.grpick .res input{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0}
.grpick .res .mid{flex:1;min-width:0}
.grmem{display:flex;gap:12px;align-items:center;padding:8px 2px}
.grmem .mid{flex:1;min-width:0}
.grmem .mid span{display:block;color:var(--muted);font-size:12px}
.grmem .rm{color:var(--danger);font-size:13px;font-weight:600;padding:6px 8px}
.grfield{border-radius:18px;resize:none}
:root[data-theme="dark"] #groups .bar,:root[data-theme="dark"] #gr-composer{background:#000}
#netbar{position:fixed;left:0;right:0;top:0;z-index:99999;padding:calc(var(--sat) + 4px) 12px 5px;text-align:center;font-size:12px;font-weight:600;color:#fff;background:#2B2B2E;transform:translateY(-110%);transition:transform .25s;pointer-events:none}
#netbar.show{transform:none}
#netbar.ok{background:#1F9D55}
.b.pending{opacity:.72}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="auth" class="hidden">
  <div class="card">
    <h1 class="brand">Haba<i>.</i></h1>
    <p class="sub">Messenger — sign in with your Haba account.</p>
    <div class="tabs"><button id="tab-email" class="on">Email</button><button id="tab-phone">Phone</button></div>

    <div id="pane-email">
      <input class="field" id="email" type="email" placeholder="Email" autocomplete="username">
      <input class="field" id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn" id="btn-email">Sign in</button>
      <button class="btn ghost" id="btn-reset" style="margin-top:8px">Forgot password</button>
    </div>

    <div id="pane-phone" class="hidden">
      <div id="phone-step1">
        <div class="row">
          <input class="field" id="cc" value="+27" inputmode="tel">
          <input class="field" id="phone" type="tel" placeholder="Phone number" inputmode="tel" autocomplete="tel-national">
        </div>
        <button class="btn" id="btn-sendcode">Send code</button>
      </div>
      <div id="phone-step2" class="hidden">
        <input class="field" id="code" placeholder="6-digit code" inputmode="numeric" autocomplete="one-time-code">
        <button class="btn" id="btn-verify">Verify &amp; sign in</button>
        <button class="btn ghost" id="btn-back-phone" style="margin-top:8px">Use a different number</button>
      </div>
    </div>
    <div class="err" id="auth-err"></div>
    <div id="recaptcha-container"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="bar">
      <div class="grow brand">Haba<i>.</i></div>
      <button class="icon" id="btn-ai" title="Haba AI" aria-label="Haba AI"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/><path d="M19 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8Z"/></svg></button>
      <button class="icon" id="btn-settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
    </div>
    <div id="banner" class="hidden"><span id="banner-text" style="flex:1"></span><button id="banner-btn">Unlock</button></div>
    <div class="searchwrap"><input id="filter" placeholder="Search chats" autocomplete="off"></div>
    <div id="pills"><button class="pill on" data-f="all">All</button><button class="pill" data-f="unread">Unread</button><button class="pill" data-f="online">Online</button><button class="pill" data-f="groups">Groups</button></div>
    <div id="chatlist"><div class="spin"></div></div>
    <button id="fab" title="Contacts"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></button>
  </aside>

  <section id="main">
    <div id="placeholder">
      <div class="brand" style="font-size:26px">Haba<i>.</i></div>
      <div>Select a chat to start messaging</div>
    </div>

    <div id="thread" class="hidden">
      <div class="bar">
        <button class="icon back" id="btn-back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="av sm" id="th-av"></div>
        <div class="grow">
          <div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="th-name"></div>
          <div style="font-size:12px;color:var(--muted)" id="th-status"></div>
        </div>
        <button class="icon" id="btn-thread-menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
      </div>
      <div id="msgs"></div>
      <div id="replybar" class="hidden"><div class="q" id="reply-q"></div><button class="icon" id="reply-x"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div id="blocked" class="hidden"></div>
      <div id="emopanel" class="hidden"></div>
      <div id="composer">
        <input type="file" id="file-img" accept="image/*" class="hidden">
        <button class="icon" id="btn-attach" title="Send photo"><svg class="ic-media" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><svg class="ic-emoji" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14.5a4.5 4.5 0 0 0 8 0M9 9.5h.01M15 9.5h.01"/></svg></button>
        <div id="recbar">
          <button class="icon" id="rec-cancel" title="Delete"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></button>
          <span class="recdot"></span><span id="rec-time">0:00</span>
          <span id="rec-hint">‹ Slide to cancel</span>
        </div>
        <div id="reclock">🔒<small>▲</small></div>
        <textarea id="input" rows="1" placeholder="Message" autocomplete="off"></textarea>
        <button class="icon" id="btn-mic" title="Hold to record a voice message"><svg class="ic-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 11a7 7 0 0 1-14 0M12 18v4"/></svg><svg class="ic-send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg></button>
        <button class="icon hidden" id="send" title="Send"><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg></button>
      </div>
    </div>
  </section>
  <nav id="bnav">
    <button data-tab="chats" class="on"><span class="pl"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.6-.8L3 21l1.9-5.4A8.4 8.4 0 1 1 21 11.5Z"/></svg><span class="nb hidden" id="nb-chats"></span></span>Chats</button>
    <button data-tab="updates"><span class="pl"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-dasharray="3.2 3"/><circle cx="12" cy="12" r="3.6"/></svg><span class="nd hidden" id="nd-upd"></span></span>Updates</button>
    <button data-tab="pages"><span class="pl"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></span>Pages</button>
    <button data-tab="settings"><span class="pl"><i class="nav-av" id="nav-av"></i></span>You</button>
  </nav>
</div>

<div id="upbar"><i></i></div>
<div id="updates" class="hidden">
  <div class="bar"><div class="grow" style="font-weight:800;font-size:20px">Updates</div></div>
  <div id="up-list"></div>
  <div id="up-fabs">
    <button id="up-text" title="Text status"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    <button id="up-cam" title="Photo or video"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="13" r="4"/></svg></button>
  </div>
  <input type="file" id="up-file" accept="image/*,video/*" multiple class="hidden">
</div>
<div id="sv" class="hidden">
  <div id="sv-stage"></div>
  <div id="sv-hit"></div>
  <div id="sv-bars"></div>
  <div id="sv-top">
    <button class="svb" id="sv-close" title="Close"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="av sm" id="sv-av"></div>
    <div class="svn"><b id="sv-name"></b><small id="sv-time"></small></div>
    <button class="svb" id="sv-more" title="Options"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
  </div>
  <div id="sv-music" class="hidden"><svg width="14" height="14" style="stroke:#fff;fill:none;stroke-width:2;flex-shrink:0" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span id="sv-music-t"></span></div>
  <div id="sv-cap" class="hidden"></div>
  <div id="sv-rx" class="hidden"></div>
  <div id="sv-bot">
    <button class="pill2" id="sv-cm"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12Z"/></svg><span id="sv-cc">Reply</span></button>
    <button class="pill2 hidden" id="sv-views"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span id="sv-vc">0</span></button>
    <button class="svb hidden" id="sv-like" title="Like"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8Z"/></svg></button>
  </div>
</div>
<div id="stx" class="hidden">
  <div class="top"><button class="svb" id="stx-close" title="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button><div class="grow"></div><button class="musb" id="stx-mus" title="Add music"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>Music</span></button><button class="postb" id="stx-post">Post</button></div>
  <textarea id="stx-input" maxlength="400" placeholder="Type a status"></textarea>
  <div class="fonts" id="stx-fonts"></div>
  <div class="stxc" id="stx-sw"></div>
</div>
<div id="smd" class="hidden">
  <div class="top"><button class="svb" id="smd-close" title="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button><div class="grow"></div><button class="musb" id="smd-mus" title="Add music"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>Music</span></button><button class="postb" id="smd-post">Post</button></div>
  <div class="prev" id="smd-prev"></div>
  <div id="smd-trim"><div class="tt"><span class="tl"></span><span class="tr"></span></div><div class="trk"><div class="sel"><i class="h l"></i><i class="h r"></i></div></div><div class="hint">Drag the handles to trim. Status videos can be up to 60 seconds.</div></div>
  <div id="smd-strip"></div>
  <div class="capw"><input id="smd-cap" maxlength="200" placeholder="Add a caption…" autocomplete="off" enterkeyhint="done"></div>

/* ONE SOUND AT A TIME: whatever starts making sound (voice note, chat video, status video, status music, song preview) pauses everything else that is audible. */
(() => {
  const live = new Set();                       // every media element that has started playing (incl. detached new Audio())
  const audible = el => !!el && !el.muted && el.volume > 0;
  const stopOthers = me => live.forEach(o => {
    if (o !== me && !o.paused && !o.ended && audible(o)) { try { o.pause(); } catch (e) {} }
    if (o.paused || o.ended) live.delete(o);
  });
  const claim = el => { if (!el || !audible(el)) return; live.add(el); stopOthers(el); };
  const _play = HTMLMediaElement.prototype.play;
  HTMLMediaElement.prototype.play = function (...a) { claim(this); return _play.apply(this, a); };
  ['play', 'playing', 'volumechange'].forEach(ev => document.addEventListener(ev, e => { const t = e.target; if (t && t.tagName && /^(AUDIO|VIDEO)$/.test(t.tagName) && !t.paused) claim(t); }, true));
})();

    if (!buf) { buf = await (await fetch(m.mediaURL)).arrayBuffer(); if (buf.byteLength < 30e6) HDB.bset('x|' + m.mediaURL, buf); }
    const iv = new Uint8Array(buf.slice(0, 12)), ct = buf.slice(12);
    for (const fresh of [false, true]) {
      const k = await sharedKey(peer, fresh); if (!k) continue;
      try { return URL.createObjectURL(new Blob([await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, k, ct)], { type: m.mediaMimeType || 'application/octet-stream' })); } catch {}
    }
    throw new Error('decrypt');
  })();
  p.catch(() => delete mediaCache[m.mediaURL]);
  return mediaCache[m.mediaURL] = p;
}
async function encFile(peer, blob){
  const pub = await getPeerPub(peer);
  if (!pub) return { blob, encrypted: false };
  if (!kp) throw new Error('LOCKED');
  const key = await sharedKey(peer);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, await blob.arrayBuffer());
  return { blob: new Blob([iv, new Uint8Array(ct)]), encrypted: true };
}

/* =============== OFFLINE DB (IndexedDB) ===============
   Cached so the app opens instantly and keeps working offline: profiles, chat list, recent messages per
   chat (kept exactly as stored on the server — E2E ciphertext stays ciphertext), encrypted media as
   ciphertext, and small images/avatars. Everything is wiped on sign-out. */
const HDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no idb'));
    const r = indexedDB.open('haba-messenger-cache', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('blobs'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = (store, mode, fn) => open().then(d => new Promise((res, rej) => {
    const t = d.transaction(store, mode); const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && 'result' in req ? req.result : undefined); t.onerror = t.onabort = () => rej(t.error);
  })).catch(() => undefined);
  let writes = 0;
  const prune = async () => {
    try {
      const d = await open(), rows = [];
      await new Promise(res => { const c = d.transaction('blobs').objectStore('blobs').openCursor(); c.onsuccess = () => { const cur = c.result; if (!cur) return res(); rows.push({ k: cur.key, t: cur.value.t || 0, n: cur.value.n || 0 }); cur.continue(); }; c.onerror = () => res(); });
      let total = rows.reduce((a, r) => a + r.n, 0); const MAX = 220e6, KEEP = 160e6;
      if (total <= MAX) return;
      rows.sort((a, b) => a.t - b.t);
      for (const r of rows) { if (total <= KEEP) break; await run('blobs', 'readwrite', s => s.delete(r.k)); total -= r.n; }
    } catch {}
  };
  return {
    get: k => run('kv', 'readonly', s => s.get(k)),
    set: (k, v) => run('kv', 'readwrite', s => s.put(v, k)),
    bget: async k => { const r = await run('blobs', 'readonly', s => s.get(k)); return r ? r.v : null; },
    bset: (k, v) => { const n = v.size || v.byteLength || 0; if (++writes % 15 === 0) setTimeout(prune, 2000); return run('blobs', 'readwrite', s => s.put({ v, t: Date.now(), n }, k)); },
    bdel: k => run('blobs', 'readwrite', s => s.delete(k)),
    clear: async () => { await run('kv', 'readwrite', s => s.clear()); await run('blobs', 'readwrite', s => s.clear()); }
  };
})();

}

/* shimmer overlay on avatars while their image is still loading (never a flat placeholder) */

function hydrateAv(root){

/* outbox: unsent messages persist in the offline DB (text and media stay encrypted) and send when back online */
let obQ = [], obBusy = false, obT = null, obReady = Promise.resolve();
const obSave = () => { if (me) HDB.set('ob|' + me.uid, obQ); };
function obInit(){

async function obAddMedia(peer, tid, blob, name, payload, preview){

async function flushOutbox(){
  if (obBusy || !me || !obQ.length || !netOK()) return;
  obBusy = true; clearTimeout(obT);
  try {
    while (obQ.length && netOK()) {
      const it = obQ[0];
      try {
        const p = { ...it.payload };
        if (it.kind === 'media') {
          const blob = await HDB.bget('ob|b|' + it.id);
          if (!blob) throw Object.assign(new Error('lost'), { fatal: true });
          const snap = await uploadBytes(sRef(storage, `dm_media/${it.tid}/${p.createdAt}_${it.name}`), blob);
          p.mediaURL = await getDownloadURL(snap.ref);

        } else throw e;

}

/* prefetch: chat images land in the offline DB as soon as a thread loads, not only when scrolled into view */
const pfSeen = new Set(), pfQ = []; let pfActive = 0;
function pfRun(){
  while (pfActive < 3 && pfQ.length) { const fn = pfQ.shift(); pfActive++; fn().catch(() => {}).finally(() => { pfActive--; pfRun(); }); }
}
function prefetchMedia(raw){
  if (!navigator.onLine || (navigator.connection && navigator.connection.saveData)) return;
  Object.values(raw || {}).filter(m => m && m.mediaURL && m.mediaType === 'image' && !m.viewOnce && !m.deleted)
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 30).forEach(m => {
      if (pfSeen.has(m.mediaURL)) return; pfSeen.add(m.mediaURL);
      const enc = !!m.mediaEncrypted, key = (enc ? 'x|' : 'i|') + m.mediaURL;
      pfQ.push(async () => {
        if (await HDB.bget(key)) return;
        const r = await fetch(m.mediaURL); if (!r.ok) { pfSeen.delete(m.mediaURL); return; }
        if (enc) { const b = await r.arrayBuffer(); if (b.byteLength < 30e6) HDB.bset(key, b); }
        else { const b = await r.blob(); if (b.size < 8e6) HDB.bset(key, b); }
      });
    });

}
/* once per session, quietly cache the latest messages + images of the most recent chats */
async function warmTopThreads(){
  if (warmed || !me || !navigator.onLine || (navigator.connection && navigator.connection.saveData)) return;
  warmed = true;
  const top = Object.entries(chats).sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0)).slice(0, 6).map(e => e[0]);
  for (const u of top) {
    if (u === activeUid || !me) continue;
    try {
      const tid = threadIdFor(me.uid, u), raw = (await get(query(ref(db, `dm_threads/${tid}/messages`), limitToLast(20)))).val();
      if (!raw) continue;
      if (!(await HDB.get('m|' + tid))) saveThread(tid, raw); else prefetchMedia(raw);   // never shrink an existing cache
    } catch {}
  }
}

function saveThread(tid, raw){
  const ents = Object.entries(raw || {});
  if (ents.length > 150) ents.sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
  HDB.set('m|' + tid, Object.fromEntries(ents.slice(0, 150)));

}
async function paintCached(){

/* =============== USERS =============== */
const userLoading = {}, userFresh = new Set();
function loadUser(uid){
  if (uid === AI_UID) { if (!users[uid]) users[uid] = { name: AI_NAME }; return Promise.resolve(users[uid]); }

  const msgs = Object.entries(rawMsgs).map(([key, v]) => ({ key, ...v })).filter(m => !m.senderUid || m.senderUid === me.uid || m.senderUid === uid).filter(m => !m.expiresAt || m.expiresAt > now).filter(m => (m.createdAt || 0) > (chats[uid]?.clearedAt || 0)).concat(obQ.filter(q => q.peer === uid && !rawMsgs[q.id]).map(q => ({ key: q.id, ...q.payload, _pend: true, _pendMedia: q.kind === 'media' }))).sort((a, b) => a.createdAt - b.createdAt);
  await Promise.all(msgs.map(async m => {
    if (m.text && !m.deleted) m._t = await decText(uid, m.text);
    if (m.replyToMessage && m.replyToMessage.text) m._rt = await decText(uid, m.replyToMessage.text);
  }));
  if (tok !== renderTok || uid !== activeUid) return;

  const box = $('#msgs');
  const prevH = box.scrollHeight, prevTop = box.scrollTop;
  const near = firstLoad || (prevH - prevTop - box.clientHeight < 150);
  let html = '', last = null;
  if (Object.keys(rawMsgs).length >= msgLimit) html += '<button id="more">Load older messages</button>';
  if (uid === AI_UID) html += `<div class="sys">${AI_NAME} replies come from Haba’s AI service. These chats aren’t end-to-end encrypted.</div>`;
  if (!msgs.length) html += emptyState('hello', 'No messages yet', `Send the first message to ${uName(uid)}.`, iBlocked || theyBlocked ? '' : 'Say hi 👋', 'sayhi');
  for (const m of msgs) {
    const isNew = !firstLoad && !keepScroll && !renderedKeys.has(m.key) && now - m.createdAt < 10000;
    if (isNew && !m._pend && m.senderUid && m.senderUid !== me.uid) msgPing(true);
    const dk = new Date(m.createdAt).toDateString();
    if (dk !== last) { html += `<div class="day">${esc(dayLabel(m.createdAt))}</div>`; last = dk; }
    if (m.systemText) { html += `<div class="sys">${esc(m.systemText)}</div>`; continue; }
    const out = m.senderUid === me.uid;
    if (m.deleted) { html += `<div class="b ${out ? 'out' : 'in'} del" data-key="${m.key}"><div class="t">🚫 This message was deleted</div><div class="meta">${fmtTime(m.createdAt)}</div></div>`; continue; }
    let inner = '';
    if (m.replyToMessage) {
      const rm = m.replyToMessage, rt = m._rt || (rm.mediaType ? '📎 ' + rm.mediaType : 'Message');
      inner += `<div class="quote"><b>${esc(uName(rm.senderUid))}</b>${esc(rt)}</div>`;
    }
    if (m._pendMedia) inner += `<div class="t">${m.mediaType === 'audio' ? '🎤 Voice message' : '📷 Photo'}</div>`;
    else if (m.viewOnce) inner += `<div class="t">🔒 View-once ${esc(m.mediaType || 'media')} — open it in the Haba app</div>`;
    else if (m.mediaURL) {
      const mt = m.mediaType || '';
      if (mt === 'image') inner += `<span class="iw shim" data-open="${m.key}"><img data-mk="${m.key}" alt="photo"></span>`;
      else if (mt === 'video') inner += `<div class="mwrap shim" data-open="${m.key}"><video data-mk="${m.key}" playsinline muted preload="metadata"></video><span class="playbadge">▶</span></div>`;
      else if (mt === 'audio') inner += vnHTML(m);
      else inner += `<div class="file" data-file="${m.key}">📄 <div><b>${esc(m.fileName || 'File')}</b><div style="font-size:12px;opacity:.7">${m.fileSize ? fmtSize(m.fileSize) + ' · ' : ''}tap to download</div></div></div>`;
    }
    if (m._t) inner += `<div class="t">${linkify(esc(m._t))}</div>`;
    { const tr = trStore.get(trKey(m.key)); if (tr) inner += `<div class="tr">${esc(tr.text)}<i>Translated to ${esc(trName(tr.lang))}</i></div>`; }
    const ticks = m._pend ? '<span class="tick">🕓</span>' : out ? `<span class="tick ${otherLastRead >= m.createdAt ? 'seen' : ''}" data-ts="${m.createdAt}">${otherLastRead >= m.createdAt ? '✓✓' : '✓'}</span>` : '';
    const rxl = m.reactions && typeof m.reactions === 'object' ? Object.values(m.reactions).filter(x => typeof x === 'string' && x) : [];
    let rxHTML = '';
    if (rxl.length) { const cnt = {}; rxl.forEach(x => cnt[x] = (cnt[x] || 0) + 1); const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]).join(''); rxHTML = `<div class="rx${typeof m.reactions[me.uid] === 'string' ? ' mine' : ''}">${esc(top)}${rxl.length > 1 ? ' ' + rxl.length : ''}</div>`; }
    html += `<div class="b ${out ? 'out' : 'in'}${m._pend ? ' pending' : ''}${isNew ? ' pop' : ''}${rxl.length ? ' hasrx' : ''}" data-key="${m.key}">${inner}<div class="meta">${m.editedAt ? 'edited · ' : ''}${fmtTime(m.createdAt)} ${ticks}</div>${rxHTML}</div>`;
  }
  box.innerHTML = html;
  msgs.forEach(m => renderedKeys.add(m.key));
  paintTyping(true);
  if (near) box.scrollTop = box.scrollHeight; else if (keepScroll) box.scrollTop = box.scrollHeight - prevH + prevTop;
  firstLoad = false;
  vnPaint();

  box.querySelectorAll('[data-mk]').forEach(async el => {
    const m = rawMsgs[el.dataset.mk]; if (!m) return;
    try {
      const src = await mediaSrc(m, uid);
      if (el.isConnected) {
        const done = () => { const w = el.closest('.shim'); if (w) w.classList.remove('shim'); };
        if (el.tagName === 'IMG') { el.onload = () => { done(); if (near) box.scrollTop = box.scrollHeight; }; el.onerror = done; if (el.complete && el.naturalWidth) done(); }
        else { el.onloadeddata = done; el.onloadedmetadata = done; el.onerror = done; }

      }
    } catch { if (el.isConnected) { const s = document.createElement('div'); s.className = 't'; s.textContent = kp ? '🔒 Couldn’t decrypt media' : '🔒 Encrypted media — unlock to view'; (el.closest('[data-open]') || el).replaceWith(s); } }
  });

  // anything new from them while the chat is open counts as read
  const latestIn = msgs.filter(m => m.senderUid !== me.uid).pop();
  if (latestIn && document.visibilityState === 'visible') { markRead(); update(ref(db, `user_chats/${me.uid}/${uid}`), { unreadCount: 0 }).catch(() => {}); }
}

function msgPopup(b){

    bar.style.top = Math.max(8, r.top - bh - 8) + 'px';

    menu.style.top = Math.max(8, Math.min(r.bottom + 8, innerHeight - mh - 8)) + 'px';
  };
  const draw = more => {

function lockedGuard(err, retry){
  if (err && err.message === 'LOCKED') { promptUnlock(false, retry); return true; }   // open the unlock sheet right away; the send resumes after unlocking
  return false;
}
async function pushMessage(peer, payload, previewEncrypted, fixedKey){
  const tid = threadIdFor(me.uid, peer);
  const key = fixedKey || push(ref(db, `dm_threads/${tid}/messages`)).key;
  const ts = payload.createdAt;
  const u = {};
  u[`dm_threads/${tid}/messages/${key}`] = payload;
  // field-level writes so pinned / hidden / clearedAt on my own node are never wiped
  u[`user_chats/${me.uid}/${peer}/text`] = previewEncrypted;
  u[`user_chats/${me.uid}/${peer}/timestamp`] = ts;
  u[`user_chats/${me.uid}/${peer}/unreadCount`] = 0;
  u[`user_chats/${me.uid}/${peer}/senderUid`] = me.uid;
  u[`user_chats/${peer}/${me.uid}/text`] = previewEncrypted;
  u[`user_chats/${peer}/${me.uid}/timestamp`] = ts;
  u[`user_chats/${peer}/${me.uid}/unreadCount`] = increment(1);
  u[`user_chats/${peer}/${me.uid}/senderUid`] = me.uid;
  await update(ref(db), u);
}
function withExpiry(p){ if (disappearing > 0) p.expiresAt = p.createdAt + disappearing * 1000; return p; }
async function replyPayload(peer){
  if (!replyTo) return null;
  const r = { key: replyTo.key, senderUid: replyTo.senderUid, text: replyTo.text, mediaType: replyTo.mediaType };
  return r;
}
let aiBusy = false;
/* Haba AI: messages go into the normal dm_thread, then habaAIChat answers and the reply is written back (same flow as the Haba app). */
async function sendToAI(text){
  if (aiBusy) return toast(`${AI_NAME} is still replying…`);
  if (!netOK()) return toast('You’re offline');
  const uid = me.uid, tid = threadIdFor(uid, AI_UID), base = `user_chats/${uid}/${AI_UID}`;
  input.value = ''; autoGrow(); $('#reply-x').click();
  clearTimeout(typingT); typingOn = false;
  aiBusy = true;
  const now = Date.now(), key = push(ref(db, `dm_threads/${tid}/messages`)).key;
  try {
    await update(ref(db), {
      [`dm_threads/${tid}/messages/${key}`]: { text, senderUid: uid, createdAt: now },
      [base + '/text']: text, [base + '/timestamp']: now, [base + '/unreadCount']: 0, [base + '/senderUid']: uid, [base + '/hidden']: null
    });
  } catch (e) { aiBusy = false; return toast('Message failed to send'); }
  set(ref(db, `dm_threads/${tid}/typing/${AI_UID}`), true).catch(() => {});
  try {
    const cleared = chats[AI_UID]?.clearedAt || 0;
    const hs = await get(query(ref(db, `dm_threads/${tid}/messages`), orderByChild('createdAt'), limitToLast(30)));
    const conv = Object.values(hs.val() || {}).filter(m => (m.createdAt || 0) > cleared).sort((a, b) => a.createdAt - b.createdAt)
      .map(m => ({ role: m.senderUid === AI_UID ? 'assistant' : 'user', content: (typeof m.text === 'string' ? m.text : '').trim() })).filter(m => m.content);
    if (!conv.length || conv[conv.length - 1].role !== 'user') conv.push({ role: 'user', content: text });
    const res = await habaAIChatCallable({ messages: conv });
    const reply = res.data && res.data.text;
    if (!reply) throw new Error('Empty response');
    const t2 = Date.now(), k2 = push(ref(db, `dm_threads/${tid}/messages`)).key;
    await update(ref(db), {
      [`dm_threads/${tid}/messages/${k2}`]: { text: reply, senderUid: AI_UID, createdAt: t2 },
      [base + '/text']: reply, [base + '/timestamp']: t2, [base + '/senderUid']: AI_UID,
      [base + '/unreadCount']: activeUid === AI_UID ? 0 : increment(1)
    });
  } catch (e) { console.error('habaAIChat failed', e); toast(`Couldn’t reach ${AI_NAME} right now (${e.code || e.message || 'error'}). Try again.`); }
  finally { aiBusy = false; set(ref(db, `dm_threads/${tid}/typing/${AI_UID}`), false).catch(() => {}); }
}
async function sendText(){
  const text = input.value.trim(); if (!text || !activeUid || iBlocked || theyBlocked) return;
  if (activeUid === AI_UID) return sendToAI(text);
  const peer = activeUid;
  try {
    const enc = await encText(peer, text);
    const payload = withExpiry({ text: enc, senderUid: me.uid, createdAt: Date.now() });
    const rp = await replyPayload(peer); if (rp) payload.replyToMessage = rp;
    input.value = ''; autoGrow(); $('#reply-x').click();
    clearTimeout(typingT); typingOn = false; set(ref(db, `dm_threads/${threadId}/typing/${me.uid}`), false).catch(() => {});
    if (!netOK()) { await obAdd({ id: newKey(threadIdFor(me.uid, peer)), peer, tid: threadIdFor(me.uid, peer), kind: 'text', payload, preview: enc }); return; }
    await pushMessage(peer, payload, enc);
  } catch (e) { if (!lockedGuard(e, () => { if (activeUid === peer && input.value.trim()) sendText(); })) { toast('Message failed to send'); console.error(e); } }
}

function prepSquare(file, size = 512){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const m = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error('blob')); }, 'image/jpeg', .88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

    if (b1.val() === true || b2.val() === true) throw new Error('BLOCKED');
  }
  const enc = await encText(peer, text), qenc = await encText(peer, quoteRaw);

  await loadUser(uid);
  const bl = blockedIds.has(uid);
  const ov = modal(`<div style="display:flex;gap:12px;align-items:center;margin-bottom:8px"><div class="av sm" style="background-image:url('${cssUrl(uAvatar(uid))}')"></div><b>${esc(uName(uid))}${vbadge(uid)}</b></div>
    <button class="sh" id="cc-msg">Message</button><button class="sh" id="cc-block">${bl ? 'Unblock' : 'Block'}</button><button class="sh danger" id="cc-rm">Remove contact</button>`);
  ov.querySelector('#cc-msg').onclick = () => { closeModal(); if (bl) toast('Unblock to send messages'); else goChat(uid); };
  ov.querySelector('#cc-block').onclick = () => { closeModal(); set(ref(db, `blocks/${me.uid}/${uid}`), bl ? null : true).then(() => { bl ? blockedIds.delete(uid) : blockedIds.add(uid); renderContacts(); toast(bl ? 'Unblocked' : 'Blocked'); }).catch(() => toast('Couldn’t update')); };
  ov.querySelector('#cc-rm').onclick = () => { closeModal(); set(ref(db, `contacts/${me.uid}/${uid}`), null).then(() => { contactIds = contactIds.filter(x => x !== uid); renderContacts(); toast('Contact removed'); }).catch(() => toast('Couldn’t remove contact')); };
}
/* =============== PHONEBOOK SYNC (Contact Picker API — same approach as Haba) =============== */
const contactPickerOK = 'contacts' in navigator && 'ContactsManager' in window;
const phoneKey = raw => String(raw || '').replace(/\D/g, '').slice(-10);   // last 10 digits so local and +27… formats match
async function syncPhoneContacts(){
  if (!contactPickerOK) return void modal('<h3>Not supported here</h3><p style="color:var(--muted);line-height:1.45;margin:0">Phonebook sync works in Chrome on Android. On other browsers, use <b>New contact</b> to find people by @username.</p>');
  let picked;
  try { picked = await navigator.contacts.select(['name', 'tel'], { multiple: true }); }
  catch (e) { if (e && e.name !== 'AbortError') toast('Couldn’t access your contacts'); return; }
  if (!picked || !picked.length) return;
  const ov = modal('<h3>Contacts on Haba</h3><div id="sc-r"><div class="spin"></div></div>');
  const out = () => ov.querySelector('#sc-r');
  try {
    // phone → uid map lives only in memory for this call; numbers are never cached
    const snap = await get(ref(db, 'users')), map = {};
    snap.forEach(c => { const v = c.val(), k = phoneKey(v && v.phoneNumber); if (k.length >= 7 && c.key !== me.uid && c.key !== AI_UID) map[k] = c.key; });
    const found = new Map(); let others = 0;
    picked.forEach(c => {
      const cname = (c.name && c.name[0]) || 'Contact'; let uid = null;
      for (const t of (c.tel || [])) { const k = phoneKey(t); if (k.length >= 7 && map[k]) { uid = map[k]; break; } }
      if (uid) { if (!found.has(uid)) found.set(uid, cname); } else others++;
    });
    found.forEach((_, uid) => { if (!users[uid]) { users[uid] = snap.child(uid).val() || { name: 'Unknown user' }; userFresh.add(uid); cacheUser(uid); warmAvatar(users[uid].photoURL); } });
    if (!contactIds.length) { try { const cs = await get(ref(db, `contacts/${me.uid}`)); cs.forEach(c => { if (c.val() && c.key !== me.uid) contactIds.push(c.key); }); } catch {} }
    const box = out(); if (!box) return;
    if (!found.size) { box.innerHTML = `<div class="empty" style="padding:20px">None of the ${picked.length} contact${picked.length === 1 ? '' : 's'} you picked are on Haba yet.</div>`; }
    else {
      box.innerHTML = [...found].map(([uid, cname]) => `<div class="blk" data-uid="${esc(uid)}"><div class="av sm" style="background-image:url('${cssUrl(uAvatar(uid))}')"></div><div class="nm" style="cursor:pointer"><b>${esc(uName(uid))}${vbadge(uid)}</b><small>${esc(cname)}</small></div><button>${contactIds.includes(uid) ? 'Chat' : 'Add'}</button></div>`).join('')
        + (others ? `<div class="empty" style="padding:14px 0 0">${others} other${others === 1 ? '' : 's'} not on Haba yet</div>` : '');
      box.querySelectorAll('.blk').forEach(el => {
        const uid = el.dataset.uid, btn = el.querySelector('button');
        el.querySelector('.nm').onclick = () => { closeModal(); goChat(uid); };
        btn.onclick = async () => {
          if (contactIds.includes(uid)) { closeModal(); return goChat(uid); }
          try { await set(ref(db, `contacts/${me.uid}/${uid}`), true); contactIds = [...contactIds, uid]; btn.textContent = 'Chat'; renderContacts(); toast('Added to contacts'); }
          catch { toast('Couldn’t update contacts'); }
        };
      });
    }
  } catch (e) { console.warn('phonebook sync', e); const box = out(); if (box) box.innerHTML = '<div class="empty" style="padding:20px">Couldn’t check your contacts. Try again.</div>'; }
}
function addContactModal(){
  const ov = modal('<h3>New contact</h3><input class="field" id="ac-s" placeholder="Search by username" autocomplete="off" autocapitalize="none"><div id="ac-r"><div class="empty" style="padding:20px">Type at least 2 letters of a username</div></div>');
  const inp = ov.querySelector('#ac-s'); inp.focus();
  inp.addEventListener('input', () => { clearTimeout(acT); acT = setTimeout(() => acSearch(inp.value), 250); });
}
async function acSearch(raw){
  const q = raw.trim().toLowerCase().replace(/^@/, ''), out = $('#ac-r'); if (!out) return;
  if (q.length < 2 || !/^[a-z0-9_.]+$/.test(q)) { out.innerHTML = '<div class="empty" style="padding:20px">Type at least 2 letters of a username</div>'; return; }
  out.innerHTML = '<div class="spin"></div>';
  try {
    const sn = await get(query(ref(db, 'usernames'), orderByKey(), startAt(q), endAt(q + '\uf8ff'), limitToFirst(10)));
    const uids = []; sn.forEach(c => { if (typeof c.val() === 'string' && c.val() !== me.uid) uids.push(c.val()); });
    await Promise.all(uids.map(loadUser));
    const box = $('#ac-r'); if (!box) return;
    if (!uids.length) { box.innerHTML = '<div class="empty" style="padding:20px">No one found</div>'; return; }
    box.innerHTML = uids.map(uid => `<div class="blk" data-uid="${esc(uid)}"><div class="av sm" style="background-image:url('${cssUrl(uAvatar(uid))}')"></div><div class="nm" style="cursor:pointer"><b>${esc(uName(uid))}${vbadge(uid)}</b><small>@${esc(users[uid]?.username || '')}</small></div><button>${contactIds.includes(uid) ? 'Added ✓' : 'Add'}</button></div>`).join('');
    box.querySelectorAll('.blk').forEach(el => {
      const uid = el.dataset.uid, btn = el.querySelector('button');
      el.querySelector('.nm').onclick = () => { closeModal(); goChat(uid); };
      btn.onclick = async () => {
        const has = contactIds.includes(uid);
        try {
          await set(ref(db, `contacts/${me.uid}/${uid}`), has ? null : true);
          contactIds = has ? contactIds.filter(x => x !== uid) : [...contactIds, uid];
          btn.textContent = has ? 'Add' : 'Added ✓'; renderContacts(); toast(has ? 'Contact removed' : 'Added to contacts');
        } catch { toast('Couldn’t update contacts'); }
      };
    });
  } catch { $('#ac-r') && ($('#ac-r').innerHTML = '<div class="empty" style="padding:20px">Search failed</div>'); }
}

$('#btn-ai').onclick = () => { if (activeUid !== AI_UID) openThread(AI_UID); };
async function doSearch(raw){
  const q = raw.trim().toLowerCase().replace(/^@/, ''), out = $('#nr'); if (!out) return;
  if (q.length < 2 || !/^[a-z0-9_.]+$/.test(q)) { out.innerHTML = '<div class="empty" style="padding:20px">Type at least 2 letters of a username</div>'; return; }

/* encryption banner + unlock */
function renderBanner(){
  const bn = $('#banner'), btn = $('#banner-btn');
  if (keyState === 'ready' && backupState !== 'no') return bn.classList.add('hidden');
  bn.classList.remove('hidden'); btn.classList.remove('hidden');
  if (keyState === 'ready') { $('#banner-text').textContent = 'Create a backup PIN so you can read your encrypted chats on a new phone or browser.'; btn.textContent = 'Create PIN'; }
  else if (keyState === 'nobackup') { $('#banner-text').textContent = 'Encrypted messages can’t be read here yet: this account has no key backup.'; btn.textContent = 'Options'; }
  else { $('#banner-text').textContent = 'Enter your backup PIN to read and send encrypted messages.'; btn.textContent = 'Unlock'; }
}
$('#banner-btn').onclick = () => keyState === 'ready' ? createPinSheet({}) : keyState === 'nobackup' ? nobackupSheet() : promptUnlock();
