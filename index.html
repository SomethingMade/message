<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haba Lite</title>
<style>
:root{--hdr:#008069;--hdrtx:#fff;--bg:#fff;--tx:#111b21;--mute:#667781;--line:#e9edef;--chatbg:#efeae2;--in:#fff;--out:#d9fdd3;--intx:#111b21;--acc:#25d366;--inp:#fff;--alt:#f0f2f5;--tick:#53bdeb}
@media(prefers-color-scheme:dark){:root{--hdr:#202c33;--hdrtx:#e9edef;--bg:#111b21;--tx:#e9edef;--mute:#8696a0;--line:#222d34;--chatbg:#0b141a;--in:#202c33;--out:#005c4b;--intx:#e9edef;--acc:#00a884;--inp:#2a3942;--alt:#202c33}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;justify-content:center}
#app{width:100%;max-width:720px;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.view{display:none;flex:1;flex-direction:column;min-height:0}.view.on{display:flex}
header{display:flex;align-items:center;gap:12px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--hdr);color:var(--hdrtx);min-height:58px}
header h1{font-size:20px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:12px;opacity:.75;font-weight:400;display:block}
.ic{background:none;border:0;color:inherit;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.ic:active{background:rgba(255,255,255,.15)}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input{font:inherit;color:var(--tx);border:0;outline:0;width:100%;background:transparent}
.av{width:49px;height:49px;border-radius:50%;background:#dfe5e7 center/cover;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:19px;color:#fff;background-color:#8696a0}
header .av{width:40px;height:40px;font-size:16px}
.list{flex:1;overflow:auto}
.row{display:flex;gap:14px;align-items:center;padding:0 16px;cursor:pointer}
.row:active{background:var(--alt)}
.row .meta{flex:1;min-width:0;padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.row .mid{flex:1;min-width:0}.row .mid b{display:block;font-weight:500;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid span{color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.row .side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.time{color:var(--mute);font-size:12px}.time.un{color:var(--acc)}
.badge{background:var(--acc);color:#fff;border-radius:11px;min-width:20px;height:20px;padding:0 6px;text-align:center;font-size:12px;font-weight:600;line-height:20px}
.fab{position:absolute;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:16px;border:0;background:var(--acc);color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.searchbar{display:flex;align-items:center;gap:10px;flex:1;background:var(--alt);border-radius:22px;padding:0 14px;height:40px;color:var(--mute)}
#v-find header{background:var(--bg);color:var(--tx);border-bottom:1px solid var(--line)}
#v-find .searchbar input{color:var(--tx)}
.msgs{flex:1;overflow:auto;padding:10px 8%;display:flex;flex-direction:column;gap:2px;background-color:var(--chatbg);
 background-image:radial-gradient(rgba(128,128,128,.10) 1.2px,transparent 1.3px),radial-gradient(rgba(128,128,128,.07) 1.2px,transparent 1.3px);background-size:26px 26px;background-position:0 0,13px 13px}
@media(max-width:520px){.msgs{padding:10px 10px}}
.b{max-width:80%;padding:6px 8px 6px 9px;border-radius:8px;background:var(--in);color:var(--intx);box-shadow:0 1px .5px rgba(11,20,26,.13);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;position:relative;align-self:flex-start;margin-top:2px}
.b.me{align-self:flex-end;background:var(--out)}
.b.first{border-top-left-radius:0;margin-top:6px}.b.me.first{border-top-left-radius:8px;border-top-right-radius:0}
.b .t{float:right;margin:7px 0 -3px 10px;font-size:11px;color:var(--mute);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.tk{width:16px;height:11px;fill:none;stroke:var(--mute);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tk.seen{stroke:var(--tick)}
.day,.sys{align-self:center;background:var(--in);color:var(--mute);font-size:12.5px;padding:5px 11px;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13);margin:8px 0;text-transform:uppercase;letter-spacing:.2px}
.sys{text-transform:none}
.lock{align-self:center;background:#fff3c4;color:#54656f;font-size:12px;padding:6px 12px;border-radius:8px;text-align:center;margin:6px 0 8px;max-width:90%}
@media(prefers-color-scheme:dark){.lock{background:#182229;color:#ffd279}}
.b i{opacity:.75}
form.bar{display:flex;align-items:flex-end;gap:8px;padding:8px 8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--chatbg)}
.pill{flex:1;background:var(--inp);border-radius:24px;padding:11px 16px;display:flex;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.send{width:48px;height:48px;border-radius:50%;border:0;background:var(--acc);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.send svg{width:22px;height:22px;fill:#fff}
.login{margin:auto;width:min(360px,90%);display:flex;flex-direction:column;gap:14px;text-align:center}
.logo{width:84px;height:84px;border-radius:50%;background:var(--acc);margin:0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;font-weight:700}
.login .in{background:var(--alt);border-radius:10px;padding:13px 14px;text-align:left}
.btn{border:0;border-radius:24px;padding:13px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.link{background:none;color:var(--acc)}
.err{color:#ea0038;font-size:13px;min-height:16px}
.mute{color:var(--mute);padding:28px;text-align:center}
.sel{background:var(--alt);border-radius:10px;padding:13px 14px;width:100%;font:inherit;color:var(--tx);border:0}
.otp{letter-spacing:.5em;text-align:center;font-size:26px}
.hint{color:var(--mute);font-size:13px}
.form{display:flex;flex-direction:column;gap:14px;padding:22px 20px;overflow:auto}
.form label{font-size:13px;color:var(--acc);margin-bottom:-8px;text-align:left}
.btn:disabled{opacity:.5}
.big{width:96px;height:96px;font-size:40px;margin:8px auto}
.btn.out{background:none;color:#ea0038}

</head>
<body>
<div id="app">

  <div class="view" id="v-auth">
    <div class="login">
      <div class="logo">h</div>
      <h2 style="font-weight:500">Enter your phone number</h2>
      <div id="s-phone" style="display:flex;flex-direction:column;gap:14px">
        <p class="hint">Haba Lite will send a text message with a 6-digit code to verify your number.</p>
        <select class="sel" id="cc"></select>
        <div class="in"><input id="ph" type="tel" inputmode="tel" placeholder="Phone number" autocomplete="tel-national"></div>
        <button class="btn" id="send-otp">Next</button>
      </div>
      <div id="s-otp" style="display:none;flex-direction:column;gap:14px">
        <p class="hint" id="otp-to"></p>
        <div class="in"><input id="otp" class="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······"></div>
        <button class="btn link" id="resend" disabled>Resend code</button>
        <button class="btn link" id="wrong">Wrong number?</button>
      </div>
      <div class="err" id="auth-err"></div>
      <div id="rc"></div>
    </div>
  </div>

  <div class="view" id="v-setup">
    <header><h1>Profile info</h1></header>
    <div class="form">
      <div class="av big" id="su-av"></div>
      <label>Your name</label><div class="in" style="background:var(--alt);border-radius:10px;padding:13px 14px"><input id="su-name" maxlength="40" placeholder="Name"></div>
      <label>About</label><div class="in" style="background:var(--alt);border-radius:10px;padding:13px 14px"><input id="su-about" maxlength="80" placeholder="Hey there! I am using Haba."></div>
      <div class="err" id="su-err"></div>
      <button class="btn" id="su-save">Continue</button>
    </div>
  </div>

  <div class="view" id="v-list">
    <header><h1>Haba Lite</h1>
      <button class="ic" id="me-btn" title="Profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
    </header>
    <div class="list" id="chats"></div>
    <button class="fab" id="new" title="New chat"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3 8.7 8.7 0 0 1-3.7-.8L3 20.5l1.6-4.9A8.1 8.1 0 0 1 4 11.5 8.4 8.4 0 0 1 12.5 3.2 8.4 8.4 0 0 1 21 11.5z"/><path d="M12 8v7M8.5 11.5h7"/></svg></button>
  </div>

  <div class="view" id="v-find">
    <header>
      <button class="ic" id="find-back"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <div class="searchbar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><input id="q" type="tel" inputmode="tel" placeholder="Phone number, then Enter"></div>
    </header>
    <div class="list" id="found"></div>
  </div>

  <div class="view" id="v-chat">
    <header>
      <button class="ic" id="back"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <div class="av" id="c-av"></div>
      <h1><span id="c-name"></span><span class="sub" id="c-sub"></span></h1>
    </header>
    <div class="msgs" id="msgs"></div>
    <form class="bar" id="send">
      <div class="pill"><input id="txt" placeholder="Message" autocomplete="off"></div>
      <button class="send" title="Send"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
    </form>
  </div>

  <div class="view" id="v-me">
    <header><button class="ic" id="me-back"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button><h1>Profile</h1></header>
    <div class="form">
      <div class="av big" id="me-av"></div>
      <label>Name</label><div class="in" style="background:var(--alt);border-radius:10px;padding:13px 14px"><input id="me-name" maxlength="40"></div>
      <label>About</label><div class="in" style="background:var(--alt);border-radius:10px;padding:13px 14px"><input id="me-about" maxlength="80"></div>
      <label>Phone</label><div class="hint" id="me-phone" style="text-align:left"></div>
      <div class="err" id="me-err"></div>
      <button class="btn" id="me-save">Save</button>
      <button class="btn out" id="out">Sign out</button>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getAuth, onAuthStateChanged, RecaptchaVerifier, signInWithPhoneNumber, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getDatabase, ref, onValue, off, get, set, push, update, remove, increment, query, limitToLast, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyBQSPwpVbGrdCuOoyitAeWQHIeipj2MgIY",
  authDomain: "newstart-64c43.firebaseapp.com",
  databaseURL: "https://newstart-64c43-default-rtdb.firebaseio.com",
  projectId: "newstart-64c43",
  storageBucket: "newstart-64c43.firebasestorage.app",
  messagingSenderId: "941619830061",
  appId: "1:941619830061:web:de9e0f791eb8f6eacf87a4"
});
const auth = getAuth(app), db = getDatabase(app);
const $ = id => document.getElementById(id);
const E2E = '\u27e6e2e1\u27e7';
const threadIdFor = (a, b) => [a, b].sort().join('_');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => t ? new Date(t).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
const dayLabel = t => sameDay(t, Date.now()) ? 'Today' : sameDay(t, Date.now() - 864e5) ? 'Yesterday' : new Date(t).toLocaleDateString([], {day:'numeric', month:'long', year:'numeric'});
const listTime = t => !t ? '' : sameDay(t, Date.now()) ? fmt(t) : sameDay(t, Date.now() - 864e5) ? 'Yesterday' : new Date(t).toLocaleDateString([], {day:'2-digit', month:'2-digit', year:'2-digit'});
const TICKS = seen => `<svg class="tk${seen ? ' seen' : ''}" viewBox="0 0 16 11"><path d="M1 6l3 3 6-7M6 8l1 1 6-7"/></svg>`;
const preview = t => !t ? '' : String(t).startsWith(E2E) ? '🔒 Encrypted message' : t;
const clean = e => (e && e.message || 'Something went wrong').replace('Firebase: ', '');

let me = null, peer = null, unsubs = [], profiles = {}, myCC = '+27';
const show = id => document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id));
const clearSubs = () => { unsubs.forEach(u => u()); unsubs = []; };
const sub = (r, cb) => { onValue(r, cb, () => {}); unsubs.push(() => off(r, 'value', cb)); };

async function profile(uid) {
  if (profiles[uid]) return profiles[uid];
  try { profiles[uid] = (await get(ref(db, `users/${uid}`))).val() || {}; } catch { profiles[uid] = {}; }
  return profiles[uid];
}
const avatar = (p, el) => {
  const url = p.photoURL && !String(p.photoURL).startsWith('data:image/svg') ? p.photoURL : '';
  el.style.backgroundImage = url ? `url('${url}')` : '';
  el.textContent = url ? '' : (p.name || '?')[0].toUpperCase();
};

/* ================= PHONE LOGIN ================= */
const CODES = [['+27','🇿🇦 South Africa'],['+263','🇿🇼 Zimbabwe'],['+264','🇳🇦 Namibia'],['+267','🇧🇼 Botswana'],['+258','🇲🇿 Mozambique'],['+260','🇿🇲 Zambia'],['+266','🇱🇸 Lesotho'],['+268','🇸🇿 Eswatini'],['+254','🇰🇪 Kenya'],['+255','🇹🇿 Tanzania'],['+256','🇺🇬 Uganda'],['+234','🇳🇬 Nigeria'],['+233','🇬🇭 Ghana'],['+44','🇬🇧 United Kingdom'],['+1','🇺🇸 US / Canada'],['+91','🇮🇳 India']];
$('cc').innerHTML = CODES.map(([c, n]) => `<option value="${c}">${n} (${c})</option>`).join('');
try { const s = localStorage.getItem('cc'); if (s) $('cc').value = s; } catch {}

// "082 123 4567" -> +27821234567 ; "+27 82…" and "0027 82…" are kept as international
const toE164 = (raw, cc) => {
  const p = String(raw).trim().replace(/[^\d+]/g, '');
  if (p.startsWith('+')) return p;
  if (p.startsWith('00')) return '+' + p.slice(2);
  return cc + p.replace(/^0+/, '');
};
const authErr = m => { $('auth-err').textContent = m || ''; };
const step = n => { $('s-phone').style.display = n === 'phone' ? 'flex' : 'none'; $('s-otp').style.display = n === 'otp' ? 'flex' : 'none'; authErr(); };

let confirmation = null, rc = null, tick = null;
const resetRc = () => { try { rc && rc.clear(); } catch {} rc = null; const f = document.createElement('div'); f.id = 'rc'; $('rc').replaceWith(f); };
function countdown() {
  clearInterval(tick); let n = 30; $('resend').disabled = true;
  const t = () => { $('resend').textContent = n > 0 ? `Resend code in ${n}s` : 'Resend code'; if (n-- <= 0) { clearInterval(tick); $('resend').disabled = false; } };
  t(); tick = setInterval(t, 1000);
}
async function sendOtp(num) {
  authErr(); $('send-otp').disabled = true;
  try {
    rc = rc || new RecaptchaVerifier(auth, 'rc', { size: 'invisible' });
    confirmation = await signInWithPhoneNumber(auth, num, rc);
    $('otp-to').textContent = `Code sent to ${num}`;
    step('otp'); $('otp').value = ''; $('otp').focus(); countdown();
  } catch (e) { authErr(clean(e)); resetRc(); }
  finally { $('send-otp').disabled = false; }
}
$('send-otp').onclick = () => {
  const num = toE164($('ph').value, $('cc').value);
  if (num.replace(/\D/g, '').length < 8) return authErr('Enter a valid phone number');
  try { localStorage.setItem('cc', $('cc').value); } catch {}
  sendOtp(num);
};
$('ph').addEventListener('keydown', e => { if (e.key === 'Enter') $('send-otp').click(); });
$('resend').onclick = () => sendOtp(toE164($('ph').value, $('cc').value));
$('wrong').onclick = () => { clearInterval(tick); step('phone'); };
$('otp').oninput = async () => {
  const v = $('otp').value = $('otp').value.replace(/\D/g, '').slice(0, 6);
  if (v.length !== 6 || !confirmation) return;
  authErr();
  try { await confirmation.confirm(v); }
  catch (e) { authErr(e.code === 'auth/invalid-verification-code' ? 'Wrong code, try again' : clean(e)); $('otp').value = ''; }
};

/* ================= SESSION + PROFILE ================= */
onAuthStateChanged(auth, async u => {
  me = u; clearSubs(); profiles = {};
  if (!u) { show('v-auth'); step('phone'); return; }
  myCC = CODES.map(c => c[0]).filter(c => (u.phoneNumber || '').startsWith(c)).sort((a, b) => b.length - a.length)[0] || '+27';
  const p = await profile(u.uid);
  if (!p.name) { $('su-name').value = u.displayName || ''; avatar({ name: u.displayName || '?' }, $('su-av')); return show('v-setup'); }
  if (u.phoneNumber && p.phoneNumber !== u.phoneNumber) update(ref(db, `users/${u.uid}`), { phoneNumber: u.phoneNumber }).catch(() => {});
  touchSeen(); show('v-list'); loadChats();
});
const touchSeen = () => { if (me) update(ref(db, `users/${me.uid}`), { lastSeen: Date.now() }).catch(() => {}); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) touchSeen(); });

$('su-save').onclick = async () => {
  const name = $('su-name').value.trim();
  if (!name) return $('su-err').textContent = 'Please enter your name';
  try {
    // displayName matters: the full Haba app copies it back into users/{uid}/name on login.
    await updateProfile(me, { displayName: name });
    const data = { name, about: $('su-about').value.trim() || 'Hey there! I am using Haba.', phoneNumber: me.phoneNumber || '', createdAt: Date.now() };
    await update(ref(db, `users/${me.uid}`), data);
    profiles[me.uid] = data; touchSeen(); show('v-list'); loadChats();
  } catch (e) { $('su-err').textContent = clean(e); }
};
$('me-btn').onclick = async () => {
  const p = await profile(me.uid);
  $('me-name').value = p.name || ''; $('me-about').value = p.about || ''; $('me-phone').textContent = me.phoneNumber || '';
  $('me-err').textContent = ''; avatar(p, $('me-av')); show('v-me');
};
$('me-back').onclick = () => show('v-list');
$('me-save').onclick = async () => {
  const name = $('me-name').value.trim();
  if (!name) return $('me-err').textContent = 'Name can\'t be empty';
  try {
    await updateProfile(me, { displayName: name });
    const data = { name, about: $('me-about').value.trim() };
    await update(ref(db, `users/${me.uid}`), data);
    profiles[me.uid] = { ...profiles[me.uid], ...data }; show('v-list');
  } catch (e) { $('me-err').textContent = clean(e); }
};
$('out').onclick = () => signOut(auth);

/* ================= CHAT LIST ================= */
function loadChats() {
  const r = ref(db, `user_chats/${me.uid}`);
  sub(r, async snap => {
    const items = Object.entries(snap.val() || {}).filter(([, c]) => !c.archived).sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0));
    if (!items.length) { $('chats').innerHTML = '<div class="mute">No chats yet.<br>Tap the green button to message someone by phone number.</div>'; return; }
    const ps = await Promise.all(items.map(([uid]) => profile(uid)));
    $('chats').innerHTML = '';
    items.forEach(([uid, c], i) => {
      const p = ps[i], row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<div class="av"></div><div class="meta"><div class="mid"><b>${esc(p.name || p.username || 'Contact')}</b><span>${c.senderUid === me.uid ? '✓ ' : ''}${esc(preview(c.text))}</span></div><div class="side"><div class="time${c.unreadCount ? ' un' : ''}">${listTime(c.timestamp)}</div>${c.unreadCount ? `<span class="badge">${c.unreadCount}</span>` : ''}</div></div>`;
      avatar(p, row.querySelector('.av'));
      row.onclick = () => openChat(uid);
      $('chats').appendChild(row);
    });
  });
}

/* ================= FIND PEOPLE BY PHONE NUMBER ================= */
const rowFor = (uid, p) => {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<div class="av"></div><div class="meta"><div class="mid"><b>${esc(p.name || 'Contact')}</b><span>${esc(p.about || p.phoneNumber || '')}</span></div></div>`;
  avatar(p, row.querySelector('.av')); row.onclick = () => openChat(uid); return row;
};
const invite = () => {
  const d = { title: 'Haba', text: 'Message me on Haba', url: location.origin + location.pathname };
  navigator.share ? navigator.share(d).catch(() => {}) : navigator.clipboard && navigator.clipboard.writeText(d.url);
};
function openFind() {
  show('v-find'); $('q').value = '';
  $('found').innerHTML = '<div class="mute">Type a phone number and press Enter</div>';
  if ('contacts' in navigator && 'ContactsManager' in window) {
    const b = document.createElement('button'); b.className = 'btn'; b.style.cssText = 'margin:14px 16px;width:calc(100% - 32px)';
    b.textContent = 'Find people from my contacts'; b.onclick = pickContacts; $('found').prepend(b);
  }
}
$('new').onclick = openFind;
$('find-back').onclick = () => show('v-list');
$('q').addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const num = toE164($('q').value, myCC);
  if (num.replace(/\D/g, '').length < 8) return;
  $('found').innerHTML = '<div class="mute">Searching…</div>';
  try {
    const v = (await get(query(ref(db, 'users'), orderByChild('phoneNumber'), equalTo(num)))).val() || {};
    const ids = Object.keys(v).filter(u => u !== me.uid);
    $('found').innerHTML = '';
    if (!ids.length) {
      const d = document.createElement('div'); d.className = 'mute';
      d.innerHTML = `${esc(num)} isn't on Haba yet.<br><br><button class="btn" id="inv">Invite</button>`;
      $('found').appendChild(d); $('inv').onclick = invite; return;
    }
    ids.forEach(u => { profiles[u] = v[u]; $('found').appendChild(rowFor(u, v[u])); });
  } catch (err) { $('found').innerHTML = `<div class="mute">Search failed: ${esc(clean(err))}</div>`; }
});
// Android Chrome only: matches device contacts against Haba users by the last 9 digits.
async function pickContacts() {
  try {
    const picked = await navigator.contacts.select(['name', 'tel'], { multiple: true });
    if (!picked.length) return;
    $('found').innerHTML = '<div class="mute">Checking contacts…</div>';
    const all = (await get(ref(db, 'users'))).val() || {};
    const byKey = {};
    Object.entries(all).forEach(([u, p]) => { const k = String(p.phoneNumber || '').replace(/\D/g, '').slice(-9); if (k.length === 9 && u !== me.uid) byKey[k] = u; });
    const seen = new Set(); let miss = 0; $('found').innerHTML = '';
    picked.forEach(c => (c.tel || []).forEach(t => {
      const u = byKey[t.replace(/\D/g, '').slice(-9)];
      if (u && !seen.has(u)) { seen.add(u); profiles[u] = all[u]; $('found').appendChild(rowFor(u, all[u])); } else if (!u) miss++;
    }));
    const n = document.createElement('div'); n.className = 'mute';
    n.textContent = seen.size ? `${miss} other numbers aren't on Haba` : 'None of those contacts are on Haba yet';
    $('found').appendChild(n);
  } catch (e) { /* picker cancelled */ }
}

/* ================= CONVERSATION ================= */
const seenText = t => !t ? '' : sameDay(t, Date.now()) ? `last seen today at ${fmt(t)}` : sameDay(t, Date.now() - 864e5) ? `last seen yesterday at ${fmt(t)}` : `last seen ${new Date(t).toLocaleDateString()}`;
let typingTimer = null, iAmTyping = false;
const setTyping = on => {
  if (!peer || iAmTyping === on) return; iAmTyping = on;
  const r = ref(db, `dm_threads/${threadIdFor(me.uid, peer)}/typing/${me.uid}`);
  (on ? set(r, true) : remove(r)).catch(() => {});
};

async function openChat(uid) {
  clearSubs(); peer = uid;
  const p = await profile(uid), tid = threadIdFor(me.uid, uid);
  $('c-name').textContent = p.name || p.username || 'Contact';
  $('c-sub').textContent = ''; avatar(p, $('c-av'));
  $('msgs').innerHTML = ''; show('v-chat');
  update(ref(db, `user_chats/${me.uid}/${uid}`), { unreadCount: 0 }).catch(() => {});

  let list = [], lastRead = 0, typing = false, lastSeen = 0;
  const head = () => { $('c-sub').textContent = typing ? 'typing…' : seenText(lastSeen); };
  const draw = () => {
    const box = $('msgs'), near = box.scrollHeight - box.scrollTop - box.clientHeight < 150 || !box.children.length;
    box.innerHTML = '<div class="lock">Messages are stored in Haba. Encrypted messages can only be read in the full app.</div>';
    let prev = null, lastDay = null;
    for (const m of list) {
      if (m.expiresAt && m.expiresAt < Date.now()) continue;
      const t = m.createdAt || 0;
      if (!lastDay || !sameDay(t, lastDay)) { const dd = document.createElement('div'); dd.className = 'day'; dd.textContent = dayLabel(t); box.appendChild(dd); lastDay = t; prev = null; }
      const d = document.createElement('div');
      if (m.systemText) { d.className = 'sys'; d.textContent = m.systemText; prev = null; box.appendChild(d); continue; }
      const mine = m.senderUid === me.uid;
      d.className = 'b' + (mine ? ' me' : '') + (prev !== m.senderUid ? ' first' : '');
      prev = m.senderUid;
      let body;
      if (typeof m.text === 'string' && m.text.startsWith(E2E)) body = '<i>🔒 Encrypted. Open in the full Haba app to read.</i>';
      else if (m.text) body = esc(m.text);
      else body = `<i>[${esc(m.mediaType || 'attachment')}] Open in Haba</i>`;
      d.innerHTML = `${body}<span class="t">${fmt(t)}${mine ? TICKS(lastRead >= t) : ''}</span>`;
      box.appendChild(d);
    }
    if (near) box.scrollTop = box.scrollHeight;
  };
  sub(query(ref(db, `dm_threads/${tid}/messages`), limitToLast(200)), snap => {
    list = Object.values(snap.val() || {}).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    draw(); update(ref(db, `user_chats/${me.uid}/${uid}`), { unreadCount: 0 }).catch(() => {});
  });
  sub(ref(db, `dm_threads/${tid}/readReceipts/${uid}`), s => { lastRead = s.val() || 0; draw(); });
  sub(ref(db, `dm_threads/${tid}/typing/${uid}`), s => { const v = s.val(); typing = !!v && !(typeof v === 'number' && Date.now() - v > 10000); head(); });
  sub(ref(db, `users/${uid}/lastSeen`), s => { lastSeen = typeof s.val() === 'number' ? s.val() : 0; head(); });
}
const leaveChat = () => { clearTimeout(typingTimer); setTyping(false); clearSubs(); peer = null; show('v-list'); loadChats(); };
$('back').onclick = leaveChat;
$('txt').addEventListener('input', () => { setTyping(true); clearTimeout(typingTimer); typingTimer = setTimeout(() => setTyping(false), 3000); });

$('send').onsubmit = async e => {
  e.preventDefault();
  const text = $('txt').value.trim();
  if (!text || !peer) return;
  clearTimeout(typingTimer); setTyping(false);
  $('txt').value = '';
  try {
    if ((await get(ref(db, `blocks/${peer}/${me.uid}`))).val() === true) { $('txt').value = text; return alert("You can't message this contact."); }
    const tid = threadIdFor(me.uid, peer), now = Date.now();
    const key = push(ref(db, `dm_threads/${tid}/messages`)).key, u = {};
    u[`dm_threads/${tid}/messages/${key}`] = { senderUid: me.uid, createdAt: now, text };
    u[`user_chats/${me.uid}/${peer}`] = { text, timestamp: now, unreadCount: 0, senderUid: me.uid };
    u[`user_chats/${peer}/${me.uid}/text`] = text;
    u[`user_chats/${peer}/${me.uid}/timestamp`] = now;
    u[`user_chats/${peer}/${me.uid}/unreadCount`] = increment(1);
    u[`user_chats/${peer}/${me.uid}/senderUid`] = me.uid;
    await update(ref(db), u);
  } catch { $('txt').value = text; alert("Couldn't send. Check your connection."); }
};
</script>
</body>
