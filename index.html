function showE2EIntro(next, auto, label){
  const ov = modal(`<div class="grab"></div><h3>Your chats are end-to-end encrypted</h3><p class="sub">Here’s how it works, in 30 seconds.</p>${E2E_ART}
    <div class="pt"><i>1</i><div><b>Locked on your phone</b><span>Messages, photos and voice notes are scrambled with a key before they leave this device.</span></div></div>
    <div class="pt"><i>2</i><div><b>Only the two of you can open them</b><span>Your private key stays on this device, so only you and the person you’re chatting with can read the conversation.</span></div></div>
    <div class="pt"><i>3</i><div><b>Your PIN brings your key to a new device</b><span>On a new phone or browser, enter the backup PIN you set in the Haba app. The PIN never leaves this device.</span></div></div>
    <p class="fine">If a contact hasn’t turned on encryption yet, messages to them are sent without it.</p>
    <button class="btn" id="e2e-go">${label || (keyState === 'ready' ? 'Got it' : 'Unlock my chats')}</button><button class="btn ghost" id="e2e-skip" style="margin-top:8px">${next ? 'Not now' : 'Close'}</button>`);
  ov.firstElementChild.classList.add('e2e');
  ov.querySelector('#e2e-go').onclick = () => { if (next) next(); else closeModal(); };
  ov.querySelector('#e2e-skip').onclick = closeModal;
}
function introSeen(){ let seen = false; try { seen = localStorage.getItem('hm-e2ee-intro') === '1'; localStorage.setItem('hm-e2ee-intro', '1'); } catch {} return seen; }
function promptUnlock(auto, retry){
  if (keyState === 'nobackup') return nobackupSheet(retry);
  if (!introSeen()) return showE2EIntro(() => unlockSheet(auto, retry), auto);   // first time: explain before asking for the PIN
  unlockSheet(auto, retry);
}
function unlockSheet(auto, retry){
  const ov = modal(`<div class="grab"></div><h3>Unlock encrypted chats</h3><p style="color:var(--muted);margin:0 0 14px;text-align:center">${retry ? 'Enter your backup PIN and your message will send right after.' : 'Enter the backup PIN you set in the Haba app. It never leaves this device — it only unlocks your key here.'}</p><input class="field" id="pin" type="password" placeholder="Backup PIN" autocomplete="off" inputmode="text"><div class="err" id="pin-err"></div><button class="btn" id="pin-go">Unlock</button><button class="btn ghost" id="pin-skip" style="margin-top:8px">${auto ? 'Not now' : 'Cancel'}</button><button class="how" id="pin-forgot" style="color:var(--danger)">Forgot PIN?</button><button class="how" id="pin-how">How does encryption work?</button>`);
  ov.firstElementChild.classList.add('e2e');
  const pin = ov.querySelector('#pin'); pin.focus();
  const go = async () => {
    if (!pin.value) return;
    ov.querySelector('#pin-go').disabled = true; ov.querySelector('#pin-err').textContent = 'Checking… this takes a moment';
    const r = await restoreFromPin(pin.value);
    if (r === 'ok') {
      closeModal(); renderBanner(); decCache.clear(); toast(retry ? 'Unlocked — sending…' : 'Unlocked'); renderSettings();
      Object.keys(chats).forEach(async uid => { previews[uid] = await decText(uid, chats[uid].text); renderChatList(); }); if (activeUid) renderMessages();
      if (retry) { try { retry(); } catch (e) { console.error(e); } }
    }
    else { ov.querySelector('#pin-go').disabled = false; ov.querySelector('#pin-err').textContent = r === 'mismatch' ? 'This backup doesn’t match your current key.' : r === 'nobackup' ? 'No backup found.' : 'Wrong PIN. Try again.'; }
  };
  ov.querySelector('#pin-go').onclick = go;
  pin.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  ov.querySelector('#pin-skip').onclick = closeModal;
  ov.querySelector('#pin-forgot').onclick = () => startFreshSheet(retry);
  ov.querySelector('#pin-how').onclick = () => showE2EIntro(() => unlockSheet(auto, retry), auto);
}

/* ----- create / change the backup PIN ----- */
function promptCreatePin(){ if (!introSeen()) showE2EIntro(() => createPinSheet({ auto: true }), true, 'Create backup PIN'); else createPinSheet({ auto: true }); }
function createPinSheet(o){
  o = o || {};
  const title = o.reset ? 'Set a new backup PIN' : o.change ? 'Change backup PIN' : 'Create a backup PIN';
  const lead = o.reset ? 'This PIN protects the new key we’ll create for you.' : o.change ? 'Your new PIN replaces the old one. Your chats and key stay the same.' : 'Your key lives only on this device. A PIN-protected backup lets you read your chats on a new phone or browser.';
  const ov = modal(`<div class="grab"></div><h3>${title}</h3><p style="color:var(--muted);margin:0 0 12px;text-align:center">${lead}</p>
    <input class="field" id="np1" type="password" placeholder="New PIN (at least 6 characters)" autocomplete="new-password" inputmode="text"><input class="field" id="np2" type="password" placeholder="Confirm PIN" autocomplete="new-password" inputmode="text" style="margin-top:8px">
    <div class="err" id="np-err"></div><p class="fine" style="margin:4px 0 12px">Longer is safer. If you forget this PIN you can set a new one, but older encrypted messages will stay unreadable.</p>
    <button class="btn" id="np-go">${o.change ? 'Save new PIN' : 'Save backup PIN'}</button><button class="btn ghost" id="np-skip" style="margin-top:8px">${o.auto ? 'Not now' : 'Cancel'}</button><button class="how" id="np-how">How does encryption work?</button>`);
  ov.firstElementChild.classList.add('e2e');
  const q = id => ov.querySelector(id), err = t => q('#np-err').textContent = t || ''; q('#np1').focus();
  const go = async () => {
    const a = q('#np1').value, b = q('#np2').value;
    if (a.length < 6) return err('Use at least 6 characters.');
    if (a !== b) return err('The two PINs don’t match.');
    q('#np-go').disabled = true; err('Securing your key… this takes a moment');
    try {
      if (o.reset) await resetKeys(a); else await saveBackup(a);
    } catch (e) { console.error(e); q('#np-go').disabled = false; return err(e && e.message === 'LOCKED' ? 'Unlock your chats first.' : 'Couldn’t save the backup. Check your connection and try again.'); }
    closeModal(); renderBanner(); renderSettings(); toast(o.reset ? 'New key and backup PIN created' : 'Backup PIN saved');
    if (o.reset) { Object.keys(chats).forEach(async uid => { previews[uid] = await decText(uid, chats[uid].text); renderChatList(); }); if (activeUid) renderMessages(); }
    if (o.retry) { try { o.retry(); } catch (e) { console.error(e); } }
  };
  q('#np-go').onclick = go;
  ov.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  q('#np-skip').onclick = closeModal;
  q('#np-how').onclick = () => showE2EIntro(() => createPinSheet(o), o.auto, 'Continue');
}
/* no key on this device and no PIN backup on the account */
function nobackupSheet(retry){
  const ov = modal(`<div class="grab"></div><h3>No key backup found</h3><p class="sub" style="margin-bottom:12px">This account has encrypted chats, but no backup PIN was ever saved, and this browser doesn’t hold the key.</p>
    <div class="pt"><i>A</i><div><b>Use the Haba app</b><span>If the Haba app is signed in on another device, open Settings → Privacy there and create a backup PIN, then sign in here again.</span></div></div>
    <div class="pt"><i>B</i><div><b>Start fresh</b><span>Create a new key and a new backup PIN. You can send and receive encrypted messages again, but older encrypted messages stay unreadable.</span></div></div>
    <button class="btn" id="nb-ok">I’ll use the Haba app</button><button class="btn ghost" id="nb-new" style="margin-top:8px;color:var(--danger)">Start fresh with a new key</button>`);
  ov.firstElementChild.classList.add('e2e');
  ov.querySelector('#nb-ok').onclick = closeModal;
  ov.querySelector('#nb-new').onclick = () => startFreshSheet(retry);
}
/* Forgot the backup PIN (or never had one): replace the key with a new one and set a new PIN. Old encrypted messages can't be recovered. */
function startFreshSheet(retry){
  const c = modal(`<div class="grab"></div><h3>Forgot your PIN?</h3><p class="sub" style="margin-bottom:10px">You can set a new PIN, but it comes with a new encryption key. This can’t be undone.</p>
    <div class="pt"><i>!</i><div><b>Old encrypted messages stay locked</b><span>Messages encrypted with your previous key can never be read again, because the old PIN is the only way to open it.</span></div></div>
    <div class="pt"><i>!</i><div><b>Other devices need the new PIN</b><span>Anywhere else you use Haba, you’ll unlock with the new backup PIN. Contacts may need to reopen their app before new messages reach you.</span></div></div>
    <button class="btn" id="nf-go" style="margin-top:6px;background:var(--danger)">Create a new PIN</button><button class="btn ghost" id="nf-x" style="margin-top:8px">Cancel</button>`);
  c.firstElementChild.classList.add('e2e');
  c.querySelector('#nf-x').onclick = closeModal;
  c.querySelector('#nf-go').onclick = () => createPinSheet({ reset: true, retry });
}
