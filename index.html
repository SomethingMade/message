<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>Lumina - Social Network</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.21.3/index.js"></script>
    
    <style>
        /* ── Modern Light Theme Variables ── */
        :root {
            --bg-body: #F0F2F5;
            --bg-surface: #FFFFFF;
            --primary-orange: #FF8C00;
            --primary-hover: #E67E00;
            --text-primary: #050505;
            --text-secondary: #65676B;
            --border-dim: #CED0D4;
            --hover-overlay: rgba(0, 0, 0, 0.05);
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.1);
            --shadow-modal: 0 12px 28px rgba(0, 0, 0, 0.2);
        }

        /* ── Core Global Resets & Anti-Highlight/Selection ── */
        *, *::before, *::after { 
            box-sizing: border-box; margin: 0; padding: 0; 
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        input, textarea {
            -webkit-user-select: auto;
            -khtml-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
            -webkit-touch-callout: default;
        }

        /* Prevent long press context menu on media */
        img, video, .clickable-user {
            -webkit-touch-callout: none !important;
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
        }

        html, body { 
            height: 100%; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-body); 
            color: var(--text-primary); 
            -webkit-font-smoothing: antialiased; 
            overflow-y: scroll;
        }

        /* ── Splash Screen Loading Animation ── */
        .splash-screen {
            position: fixed; inset: 0; background: var(--bg-body); z-index: 9999;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
        }
        .loading-dots { display: flex; gap: 8px; margin-top: 20px; }
        .loading-dots span {
            width: 14px; height: 14px; background-color: var(--primary-orange);
            border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* ── Top Navigation Bar ── */
        .top-navbar {
            position: fixed; top: 0; left: 0; right: 0; height: 56px;
            background: var(--bg-surface);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 16px; box-shadow: var(--shadow-sm); z-index: 100;
        }
        
        .nav-left { display: flex; align-items: center; gap: 12px; width: 320px; }
        .hamburger-btn { background: transparent; border: none; font-size: 20px; color: var(--text-secondary); cursor: pointer; padding: 8px; border-radius: 50%; transition: background 0.2s; }
        .hamburger-btn:hover { background: var(--hover-overlay); }
        .brand-text { font-size: 24px; font-weight: 700; color: var(--primary-orange); text-decoration: none; letter-spacing: -0.5px; margin-right: 8px; cursor: pointer; }
        
        .search-bar { background: #F0F2F5; border-radius: 50px; padding: 8px 16px; display: flex; align-items: center; gap: 8px; flex: 1; color: var(--text-secondary); }
        .search-bar input { border: none; background: transparent; outline: none; width: 100%; font-size: 15px; }

        .nav-center { display: flex; gap: 8px; height: 100%; }
        .nav-tab { width: 110px; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--text-secondary); cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s; }
        .nav-tab:hover { background: var(--hover-overlay); border-radius: 8px; margin: 4px 0; height: 48px; }
        .nav-tab.active { color: var(--primary-orange); border-bottom-color: var(--primary-orange); border-radius: 0; margin: 0; height: 100%; background: transparent; }

        .nav-right { display: flex; align-items: center; gap: 12px; width: 320px; justify-content: flex-end; }
        .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: #E4E6EB; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text-primary); cursor: pointer; border: none; transition: background 0.2s; }
        .icon-btn:hover { background: #D8DADF; }
        .nav-profile { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 1px solid var(--border-dim); }

        /* ── Navigation Drawer ── */
        .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: none; opacity: 0; transition: opacity 0.3s ease; }
        .drawer-overlay.active { display: block; opacity: 1; }
        .drawer-content { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: var(--bg-surface); z-index: 1001; box-shadow: var(--shadow-modal); transition: left 0.3s ease; overflow-y: auto; padding: 16px 8px; }
        .drawer-content.active { left: 0; }
        
        .sidebar-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-md); font-weight: 500; font-size: 15px; cursor: pointer; transition: background 0.2s; color: var(--text-primary); }
        .sidebar-item:hover { background: var(--hover-overlay); }
        .sidebar-item img, .sidebar-item .icon-circle { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .sidebar-item .icon-circle { background: #E4E6EB; display: flex; align-items: center; justify-content: center; color: var(--text-primary); font-size: 20px; }
        .right-sidebar { display: none; flex-direction: column; position: sticky; top: 76px; height: calc(100vh - 76px); overflow-y: auto; padding: 0 8px; }

        /* ── Application Structural Grid ── */
        .app-wrapper { display: grid; padding-top: 76px; max-width: 100%; margin: 0 auto; grid-template-columns: 1fr; gap: 20px; }
        .feed-container { max-width: 680px; width: 100%; margin: 0 auto; padding: 0 16px; position: relative; }
        
        /* View Sections */
        .view-section { display: none; flex-direction: column; gap: 16px; }
        .view-section.active { display: flex; }

        /* ── Profile View ── */
        .profile-card { background: var(--bg-surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); margin-bottom: 4px; }
        .profile-cover { width: 100%; height: 250px; background-color: #E4E6EB; background-size: cover; background-position: center; position: relative; }
        .profile-info-section { padding: 16px 24px 24px; position: relative; text-align: center; margin-top: -80px; }
        .profile-avatar-large { width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--bg-surface); object-fit: cover; background: white; margin: 0 auto 12px; position: relative; z-index: 2; box-shadow: var(--shadow-sm); }
        .profile-display-name { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
        .profile-bio-text { font-size: 15px; color: var(--text-secondary); margin-bottom: 20px; max-width: 400px; margin-left: auto; margin-right: auto; line-height: 1.4; }

        /* Composer Card */
        .composer-card { background: var(--bg-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 12px 16px 10px; margin-bottom: 16px; }
        .composer-top { display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--border-dim); padding-bottom: 12px; margin-bottom: 12px; }
        .composer-input-btn { flex: 1; background: #F0F2F5; border-radius: 50px; padding: 10px 16px; font-size: 17px; color: var(--text-secondary); cursor: pointer; transition: background 0.2s; border: none; text-align: left; outline: none; }
        .composer-input-btn:hover { background: #E4E6EB; }
        .composer-actions { display: flex; justify-content: space-between; }
        .composer-action-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px; border-radius: var(--radius-md); font-weight: 600; font-size: 15px; color: var(--text-secondary); cursor: pointer; transition: background 0.2s; }
        .composer-action-btn:hover { background: var(--hover-overlay); }

        /* Post Render Card */
        .post-card { background: var(--bg-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 12px 16px 4px; display: flex; flex-direction: column; }
        .post-header { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; justify-content: space-between; position: relative; }
        .post-header-left { display: flex; gap: 10px; align-items: center; cursor: pointer; }
        .post-author-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-dim); }
        .post-header-text { display: flex; flex-direction: column; }
        .post-author-name { font-weight: 600; font-size: 15px; color: var(--text-primary); }
        .post-author-name:hover { text-decoration: underline; }
        .post-time { font-size: 13px; color: var(--text-secondary); }
        
        /* Context Menu Styles */
        .post-context-menu { position: relative; }
        .context-trigger { background: transparent; border: none; font-size: 18px; color: var(--text-secondary); cursor: pointer; width: 36px; height: 36px; border-radius: 50%; transition: 0.2s; }
        .context-trigger:hover { background: var(--hover-overlay); }
        .context-dropdown { position: absolute; right: 0; top: 100%; background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-modal); width: max-content; min-width: 150px; display: none; z-index: 100; border: 1px solid var(--border-dim); overflow: hidden; }
        .context-dropdown.active { display: block; }
        .context-dropdown button { width: 100%; text-align: left; padding: 12px 16px; background: none; border: none; font-size: 15px; font-weight: 500; cursor: pointer; color: var(--text-primary); transition: background 0.2s; display: flex; align-items: center; gap: 8px; }
        .context-dropdown button:hover { background: var(--hover-overlay); }
        .context-dropdown button.danger { color: #DC3545; }

        .post-text { font-size: 15px; line-height: 1.5; color: var(--text-primary); margin-bottom: 12px; white-space: pre-wrap; word-break: break-word; }
        
        /* Media & Custom Video Controls */
        .post-media-container { margin: 0 -16px 12px; display: flex; justify-content: center; background: #000; }
        .post-attached-media { width: 100%; max-height: 500px; object-fit: cover; }
        .post-attached-media.video { object-fit: contain; }
        
        .custom-video-wrapper { position: relative; margin: 0 -16px 12px; display: flex; justify-content: center; background: #000; }
        .custom-controls { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.7)); display: flex; align-items: center; gap: 12px; padding: 20px 16px 12px; opacity: 0; transition: opacity 0.3s; z-index: 10; }
        .custom-video-wrapper:hover .custom-controls, .custom-video-wrapper:active .custom-controls { opacity: 1; }
        .custom-controls button { background: none; border: none; color: white; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; }
        .custom-controls button:hover { color: var(--primary-orange); }
        
        .seek-bar { flex: 1; cursor: pointer; height: 6px; -webkit-appearance: none; background: rgba(255,255,255,0.4); border-radius: 4px; outline: none; }
        .seek-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: var(--primary-orange); border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
        .seek-bar::-moz-range-thumb { width: 14px; height: 14px; background: var(--primary-orange); border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.5); border: none; }
        
        .video-spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 4px solid rgba(255, 255, 255, 0.3); border-top: 4px solid var(--primary-orange); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; display: none; z-index: 5; pointer-events: none; }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        .post-stats { display: flex; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid var(--border-dim); color: var(--text-secondary); font-size: 15px; }
        .post-actions-row { display: flex; justify-content: space-between; padding: 4px 0; }
        .action-icon-group { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 6px; border-radius: var(--radius-md); font-weight: 600; font-size: 15px; color: var(--text-secondary); cursor: pointer; transition: background 0.2s; }
        .action-icon-group:hover { background: var(--hover-overlay); }
        .action-icon-group.liked { color: var(--primary-orange); }

        .scroll-anchor { height: 20px; width: 100%; margin-top: 10px; }

        /* ── Modals & Overlays ── */
        .overlay-modal { position: fixed; inset: 0; background: rgba(255,255,255,0.8); display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
        .overlay-modal.active { display: flex; }
        .modal-sheet { background: var(--bg-surface); width: 100%; max-width: 600px; border-radius: var(--radius-lg); box-shadow: var(--shadow-modal); display: flex; flex-direction: column; max-height: 85vh; border: 1px solid var(--border-dim); animation: modalIn 0.2s ease-out; }
        @keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-header { padding: 16px; border-bottom: 1px solid var(--border-dim); display: flex; justify-content: center; align-items: center; position: relative; }
        .modal-header h3 { font-size: 20px; font-weight: 700; margin: 0; }
        .modal-close-btn { position: absolute; right: 16px; background: #E4E6EB; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; color: var(--text-secondary); }
        .modal-close-btn:hover { background: #D8DADF; }
        
        .modal-body { padding: 16px; overflow-y: auto; flex: 1; }
        
        #composer-modal-text, #edit-profile-bio { width: 100%; border: none; outline: none; font-size: 16px; resize: none; font-family: inherit; margin-bottom: 12px; }
        #composer-modal-text { font-size: 24px; min-height: 120px; }
        .media-preview-box { display: none; position: relative; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-dim); margin-bottom: 12px; max-height: 300px; }
        .media-preview-box img, .media-preview-box video { width: 100%; height: 100%; object-fit: cover; max-height: 300px;}
        .clear-preview-btn { position: absolute; top: 8px; right: 8px; background: white; border: 1px solid var(--border-dim); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; box-shadow: var(--shadow-sm); z-index: 10; }
        
        .btn-primary { background: var(--primary-orange); color: white; border: none; padding: 10px; border-radius: var(--radius-md); font-weight: 600; font-size: 15px; cursor: pointer; width: 100%; transition: background 0.2s; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-primary:disabled { background: #E4E6EB; color: #BCC0C4; cursor: not-allowed; }
        
        .btn-secondary { background: #E4E6EB; color: var(--text-primary); border: none; padding: 10px; border-radius: var(--radius-md); font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s; display: inline-flex; align-items: center; gap: 8px; justify-content: center;}
        .btn-secondary:hover { background: #D8DADF; }

        /* Auth Gate */
        .auth-gate { position: fixed; inset: 0; background: var(--bg-body); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--bg-surface); padding: 24px; border-radius: var(--radius-md); box-shadow: var(--shadow-modal); width: 100%; max-width: 400px; text-align: center; }
        .auth-input, .edit-input { width: 100%; padding: 14px; border: 1px solid var(--border-dim); border-radius: var(--radius-md); font-size: 16px; margin-bottom: 12px; outline: none; }
        .auth-input:focus, .edit-input:focus { border-color: var(--primary-orange); box-shadow: 0 0 0 2px rgba(255,140,0,0.2); }
        
        /* Edit Profile Specifics */
        .edit-profile-field { margin-bottom: 16px; text-align: left; }
        .edit-profile-field label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: var(--text-secondary); }

        #toast-box { position: fixed; bottom: 20px; left: 20px; z-index: 500; display: flex; flex-direction: column; gap: 8px; }
        .toast { background: #333; color: white; padding: 12px 20px; border-radius: var(--radius-md); font-size: 14px; box-shadow: var(--shadow-modal); animation: toastIn 0.3s; }
        @keyframes toastIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        @media (min-width: 768px) {
            .app-wrapper { grid-template-columns: 1fr; max-width: 680px; }
            .nav-center { display: flex; } 
        }
        @media (min-width: 1100px) {
            .app-wrapper { grid-template-columns: 680px 280px; max-width: 1000px; justify-content: center; }
            .right-sidebar { display: flex; }
        }
        @media (max-width: 767px) {
            .nav-center, .nav-left .search-bar { display: none; }
            .nav-left { width: auto; }
            .nav-right { width: auto; flex: 1; }
        }
    </style>
</head>
<body>

    <div id="splash-screen" class="splash-screen">
        <h1 style="color: var(--primary-orange); font-size: 48px; font-weight: 700; margin:0; letter-spacing: -1.5px;">Lumina</h1>
        <div class="loading-dots"><span></span><span></span><span></span></div>
    </div>

    <div id="auth-screen" class="auth-gate">
        <div style="margin-bottom: 30px;">
            <h1 style="color: var(--primary-orange); font-size: 48px; font-weight: 700; margin:0; letter-spacing: -1.5px;">Lumina</h1>
            <p style="font-size: 20px; color: var(--text-primary); margin-top: 8px;">Connect with friends and the world around you on Lumina.</p>
        </div>
        <div class="auth-card">
            <input type="email" id="login-email" class="auth-input" placeholder="Email address">
            <input type="password" id="login-pass" class="auth-input" placeholder="Password">
            <button class="btn-primary" id="action-login" style="font-size: 20px; padding: 12px;">Log In</button>
            <hr style="border: 0; border-top: 1px solid var(--border-dim); margin: 20px 0;">
            <button class="btn-primary" id="action-google" style="background: #fff; color: #333; border: 1px solid var(--border-dim); display:flex; align-items:center; justify-content:center; gap:8px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:18px" alt=""> Continue with Google
            </button>
        </div>
    </div>

    <nav class="top-navbar">
        <div class="nav-left">
            <button class="hamburger-btn" onclick="toggleDrawer()"><i class="fa-solid fa-bars"></i></button>
            <a onclick="switchView('home')" class="brand-text">Lumina</a>
        </div>
        <div class="nav-center">
            <div class="nav-tab active" onclick="switchView('home')"><i class="fa-solid fa-house"></i></div>
            <div class="nav-tab"><i class="fa-solid fa-user-group"></i></div>
            <div class="nav-tab"><i class="fa-solid fa-store"></i></div>
        </div>
        <div class="nav-right">
            <button class="icon-btn" title="Notifications"><i class="fa-solid fa-bell"></i></button>
            <img id="nav-profile-pic" src="https://ui-avatars.com/api/?name=User&background=FF8C00&color=fff" class="nav-profile" onclick="openProfile(currentUser.uid)">
        </div>
    </nav>

    <div id="drawer-overlay" class="drawer-overlay" onclick="toggleDrawer()"></div>
    <div id="drawer-content" class="drawer-content">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 12px 16px; border-bottom: 1px solid var(--border-dim); margin-bottom: 12px;">
            <span class="brand-text" onclick="switchView('home')">Lumina</span>
            <button class="icon-btn" style="width: 32px; height: 32px;" onclick="toggleDrawer()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="sidebar-item" onclick="openProfile(currentUser.uid)">
            <img id="drawer-profile-pic" src="https://ui-avatars.com/api/?name=User&background=FF8C00&color=fff" alt="">
            <span id="drawer-profile-name">Loading...</span>
        </div>
        <hr style="border:0; border-top: 1px solid var(--border-dim); margin: 8px 0;">
        <div class="sidebar-item" id="drawer-logout-trigger"><div class="icon-circle"><i class="fa-solid fa-arrow-right-from-bracket"></i></div> Log Out</div>
    </div>

    <div class="app-wrapper">
        <main class="feed-container">
            
            <!-- HOME VIEW -->
            <div id="app-home-view" class="view-section active">
                <div class="composer-card">
                    <div class="composer-top">
                        <img id="composer-avatar" src="https://ui-avatars.com/api/?name=User&background=FF8C00&color=fff" class="post-author-img">
                        <button class="composer-input-btn" onclick="openComposerModal()">What's on your mind?</button>
                    </div>
                </div>
                <div id="posts-stream-target" style="display: flex; flex-direction: column; gap: 16px;"></div>
                <div id="home-scroll-anchor" class="scroll-anchor"></div>
            </div>

            <!-- PROFILE VIEW -->
            <div id="app-profile-view" class="view-section">
                <div class="profile-card">
                    <div class="profile-cover" id="profile-cover-display"></div>
                    <div class="profile-info-section">
                        <img id="profile-avatar-display" src="" class="profile-avatar-large">
                        <h2 class="profile-display-name" id="profile-name-display">Loading...</h2>
                        <p class="profile-bio-text" id="profile-bio-display"></p>
                        <button class="btn-secondary" id="edit-profile-btn" style="display: none; margin: 0 auto;" onclick="openEditProfileModal()">
                            <i class="fa-solid fa-pen"></i> Edit Profile
                        </button>
                    </div>
                </div>
                <div class="composer-card" id="profile-composer-card" style="display: none;">
                    <div class="composer-top">
                        <img id="profile-composer-avatar" src="" class="post-author-img">
                        <button class="composer-input-btn" onclick="openComposerModal()">Write a post...</button>
                    </div>
                </div>
                <div id="profile-posts-stream-target" style="display: flex; flex-direction: column; gap: 16px;"></div>
            </div>

        </main>
        
        <aside class="right-sidebar">
            <h3 style="color: var(--text-secondary); font-size: 15px; margin: 12px 12px 8px;">Sponsored</h3>
            <div class="sidebar-item" style="align-items: flex-start;">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=100&q=80" style="border-radius: 8px; width:100px; height:100px; object-fit: cover;">
                <div><div style="font-weight: 600;">Premium Sneakers</div><div style="font-size: 13px; color: var(--text-secondary);">store.example.com</div></div>
            </div>
        </aside>
    </div>

    <!-- CREATE POST MODAL -->
    <div id="composer-modal" class="overlay-modal">
        <div class="modal-sheet">
            <div class="modal-header">
                <h3>Create post</h3>
                <button class="modal-close-btn" onclick="closeComposerModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <textarea id="composer-text" placeholder="What's on your mind?"></textarea>
                <div id="preview-box" class="media-preview-box"></div>
                <div style="border: 1px solid var(--border-dim); border-radius: var(--radius-md); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <span style="font-weight: 600;">Add to your post</span>
                    <label style="color: #45BD62; cursor: pointer; font-size: 24px;">
                        <i class="fa-solid fa-images"></i>
                        <input type="file" id="post-media-file" accept="image/*,video/*" style="display:none;">
                    </label>
                </div>
                <button class="btn-primary" id="submit-post-btn">Post</button>
            </div>
        </div>
    </div>

    <!-- EDIT PROFILE MODAL -->
    <div id="edit-profile-modal" class="overlay-modal">
        <div class="modal-sheet">
            <div class="modal-header">
                <h3>Edit Profile</h3>
                <button class="modal-close-btn" onclick="closeEditProfileModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="edit-profile-field">
                    <label>Profile Picture</label>
                    <div style="display: flex; align-items: center; gap: 16px;">
                        <img id="edit-avatar-preview" src="" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-dim);">
                        <label class="btn-secondary" style="cursor: pointer;">
                            Change <input type="file" id="edit-avatar-input" accept="image/*" style="display:none;">
                        </label>
                    </div>
                </div>
                <div class="edit-profile-field">
                    <label>Cover Photo</label>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <div id="edit-cover-preview" style="width: 100%; height: 100px; background-color: #E4E6EB; background-size: cover; background-position: center; border-radius: var(--radius-md);"></div>
                        <label class="btn-secondary" style="width: fit-content; cursor: pointer;">
                            Change <input type="file" id="edit-cover-input" accept="image/*" style="display:none;">
                        </label>
                    </div>
                </div>
                <div class="edit-profile-field">
                    <label>Display Name</label>
                    <input type="text" id="edit-name-input" class="edit-input">
                </div>
                <div class="edit-profile-field">
                    <label>Bio</label>
                    <textarea id="edit-bio-input" class="edit-input" style="min-height: 80px; resize: none;"></textarea>
                </div>
                <button class="btn-primary" id="save-profile-btn">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="toast-box"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut as fbSignOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, push, set, get, update, onValue, remove, query, orderByChild, limitToLast, equalTo } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBQSPwpVbGrdCuOoyitAeWQHIeipj2MgIY",
            authDomain: "newstart-64c43.firebaseapp.com",
            databaseURL: "https://newstart-64c43-default-rtdb.firebaseio.com",
            projectId: "newstart-64c43"
        };

        const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/dqkujefxj/auto/upload";
        const CLOUDINARY_PRESET = "banter_box"; 

        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const database = getDatabase(fbApp);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let userProfile = {};
        let selectedMediaBlob = null;
        let selectedMediaType = null;
        let currentFeedLimit = 10;
        let feedUnsubscribe = null;
        let activeProfileUid = null;
        let profileFeedUnsubscribe = null;

        // Pending profile edits
        let pendingAvatarBlob = null;
        let pendingCoverBlob = null;

        // Prevent Context Menu on Media Globally
        document.addEventListener('contextmenu', event => {
            if (event.target.tagName === 'IMG' || event.target.tagName === 'VIDEO' || event.target.closest('.clickable-user')) {
                event.preventDefault();
            }
        });

        function toast(msg) {
            const box = document.getElementById('toast-box');
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerText = msg;
            box.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }

        window.toggleDrawer = () => {
            const overlay = document.getElementById('drawer-overlay');
            const content = document.getElementById('drawer-content');
            if (overlay.classList.contains('active')) {
                overlay.classList.remove('active');
                content.classList.remove('active');
                setTimeout(() => overlay.style.display = 'none', 300);
            } else {
                overlay.style.display = 'block';
                void overlay.offsetWidth; 
                overlay.classList.add('active');
                content.classList.add('active');
            }
        };

        window.openComposerModal = () => document.getElementById('composer-modal').classList.add('active');
        window.closeComposerModal = () => {
            document.getElementById('composer-modal').classList.remove('active');
            clearMediaSelection();
        };

        window.switchView = (viewName) => {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            if(viewName === 'home') {
                document.getElementById('app-home-view').classList.add('active');
                activeProfileUid = null;
                attachRealtimeTimelineFeed();
            } else if (viewName === 'profile') {
                document.getElementById('app-profile-view').classList.add('active');
            }
            window.scrollTo(0,0);
        };

        async function uploadMediaFile(file) {
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", CLOUDINARY_PRESET);
            try {
                const response = await fetch(CLOUDINARY_URL, { method: "POST", body: formData });
                if (!response.ok) throw new Error("Cloudinary upload failed");
                const data = await response.json();
                return data.secure_url;
            } catch (err) {
                console.error(err);
                toast("Media processing failed.");
                return null;
            }
        }

        onAuthStateChanged(auth, async (user) => {
            const splash = document.getElementById('splash-screen');
            const gate = document.getElementById('auth-screen');
            if (user) {
                currentUser = user;
                splash.style.display = 'none';
                gate.style.display = 'none';
                listenToUserProfile(user);
                switchView('home');
            } else {
                currentUser = null;
                splash.style.display = 'none';
                gate.style.display = 'flex';
            }
        });

        function listenToUserProfile(user) {
            const userRef = ref(database, `users/${user.uid}`);
            onValue(userRef, async (snap) => {
                let p = snap.exists() ? snap.val() : {};
                let forcedUpdates = false;

                if (!p.name) { p.name = user.displayName || 'Lumina User'; forcedUpdates = true; }
                if (!p.photoURL) { p.photoURL = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=FF8C00&color=fff`; forcedUpdates = true; }
                if (!p.coverURL) { p.coverURL = 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=800&q=80'; forcedUpdates = true;}

                userProfile = p;
                if (forcedUpdates) await update(userRef, { name: p.name, photoURL: p.photoURL, coverURL: p.coverURL });
                
                ['nav-profile-pic', 'drawer-profile-pic', 'composer-avatar', 'profile-composer-avatar'].forEach(id => {
                    const el = document.getElementById(id);
                    if(el) el.src = p.photoURL;
                });
                
                ['drawer-profile-name'].forEach(id => {
                    const el = document.getElementById(id);
                    if(el) el.innerText = p.name;
                });

                // Update active profile view if it's the current user
                if (activeProfileUid === currentUser.uid) {
                    populateProfileHeader(p, true);
                }
            });
        }

        document.getElementById('action-login').addEventListener('click', () => { toast("Please use Google Sign-in for demo"); });
        document.getElementById('action-google').addEventListener('click', () => { signInWithPopup(auth, provider).catch(e => toast(e.message)); });
        document.getElementById('drawer-logout-trigger').addEventListener('click', () => fbSignOut(auth).then(() => window.location.reload()));

        /* Media Upload logic for Posts */
        const clearMediaSelection = () => {
            selectedMediaBlob = null;
            selectedMediaType = null;
            document.getElementById('post-media-file').value = '';
            document.getElementById('preview-box').innerHTML = '';
            document.getElementById('preview-box').style.display = 'none';
            document.getElementById('composer-text').value = '';
        };

        document.getElementById('post-media-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedMediaBlob = file;
                selectedMediaType = file.type.startsWith('video/') ? 'video' : 'image';
                const previewBox = document.getElementById('preview-box');
                previewBox.innerHTML = '<button class="clear-preview-btn" id="clear-media-btn"><i class="fa-solid fa-xmark"></i></button>';
                if(selectedMediaType === 'video') {
                    const vid = document.createElement('video');
                    vid.src = URL.createObjectURL(file);
                    vid.controls = true;
                    previewBox.appendChild(vid);
                } else {
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(file);
                    previewBox.appendChild(img);
                }
                document.getElementById('clear-media-btn').addEventListener('click', clearMediaSelection);
                previewBox.style.display = 'block';
            }
        });

        document.getElementById('submit-post-btn').addEventListener('click', async () => {
            const textVal = document.getElementById('composer-text').value.trim();
            if (!textVal && !selectedMediaBlob) return toast("Post cannot be empty.");

            const btn = document.getElementById('submit-post-btn');
            btn.disabled = true; btn.innerText = "Posting...";

            let resolvedMediaUrl = null;
            if (selectedMediaBlob) resolvedMediaUrl = await uploadMediaFile(selectedMediaBlob);

            const postObject = {
                text: textVal,
                mediaUrl: resolvedMediaUrl || "",
                mediaType: resolvedMediaUrl ? selectedMediaType : "",
                uid: currentUser.uid,
                authorName: userProfile.name,
                authorAvatar: userProfile.photoURL,
                timestamp: Date.now(),
                likesCount: 0,
                likes: {}
            };

            push(ref(database, 'social_posts'), postObject).then(() => {
                clearMediaSelection();
                btn.disabled = false; btn.innerText = "Post";
                closeComposerModal();
                toast("Posted successfully!");
            }).catch(() => { btn.disabled = false; btn.innerText = "Post"; });
        });

        /* View & Profile Handling */
        window.openProfile = async (uid) => {
            toggleDrawer(); // Close drawer if open
            const drawerOverlay = document.getElementById('drawer-overlay');
            if(drawerOverlay.classList.contains('active')) {
                drawerOverlay.classList.remove('active');
                document.getElementById('drawer-content').classList.remove('active');
                drawerOverlay.style.display = 'none';
            }

            activeProfileUid = uid;
            switchView('profile');
            
            document.getElementById('profile-name-display').innerText = "Loading...";
            document.getElementById('profile-bio-display').innerText = "";
            document.getElementById('edit-profile-btn').style.display = 'none';
            document.getElementById('profile-composer-card').style.display = 'none';

            // Fetch user info
            const uSnap = await get(ref(database, `users/${uid}`));
            const profileData = uSnap.exists() ? uSnap.val() : { name: "Unknown User", photoURL: "https://ui-avatars.com/api/?name=User" };
            
            populateProfileHeader(profileData, uid === currentUser.uid);
            loadProfileFeed(uid);
        };

        function populateProfileHeader(data, isCurrentUser) {
            document.getElementById('profile-name-display').innerText = data.name || "User";
            document.getElementById('profile-bio-display').innerText = data.bio || "";
            document.getElementById('profile-avatar-display').src = data.photoURL;
            document.getElementById('profile-cover-display').style.backgroundImage = `url(${data.coverURL || 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=800&q=80'})`;
            
            if (isCurrentUser) {
                document.getElementById('edit-profile-btn').style.display = 'inline-flex';
                document.getElementById('profile-composer-card').style.display = 'block';
            }
        }

        /* Edit Profile Modal Logic */
        window.openEditProfileModal = () => {
            document.getElementById('edit-name-input').value = userProfile.name || "";
            document.getElementById('edit-bio-input').value = userProfile.bio || "";
            document.getElementById('edit-avatar-preview').src = userProfile.photoURL || "";
            document.getElementById('edit-cover-preview').style.backgroundImage = `url(${userProfile.coverURL || ''})`;
            
            pendingAvatarBlob = null;
            pendingCoverBlob = null;
            document.getElementById('edit-avatar-input').value = '';
            document.getElementById('edit-cover-input').value = '';

            document.getElementById('edit-profile-modal').classList.add('active');
        };

        window.closeEditProfileModal = () => {
            document.getElementById('edit-profile-modal').classList.remove('active');
        };

        document.getElementById('edit-avatar-input').addEventListener('change', (e) => {
            if(e.target.files[0]) {
                pendingAvatarBlob = e.target.files[0];
                document.getElementById('edit-avatar-preview').src = URL.createObjectURL(pendingAvatarBlob);
            }
        });

        document.getElementById('edit-cover-input').addEventListener('change', (e) => {
            if(e.target.files[0]) {
                pendingCoverBlob = e.target.files[0];
                document.getElementById('edit-cover-preview').style.backgroundImage = `url(${URL.createObjectURL(pendingCoverBlob)})`;
            }
        });

        document.getElementById('save-profile-btn').addEventListener('click', async () => {
            const btn = document.getElementById('save-profile-btn');
            btn.disabled = true; btn.innerText = "Saving...";

            let newAvatarUrl = userProfile.photoURL;
            let newCoverUrl = userProfile.coverURL;
            const newName = document.getElementById('edit-name-input').value.trim();
            const newBio = document.getElementById('edit-bio-input').value.trim();

            if (pendingAvatarBlob) {
                const avUrl = await uploadMediaFile(pendingAvatarBlob);
                if(avUrl) newAvatarUrl = avUrl;
            }
            if (pendingCoverBlob) {
                const cvUrl = await uploadMediaFile(pendingCoverBlob);
                if(cvUrl) newCoverUrl = cvUrl;
            }

            if(newName) {
                await update(ref(database, `users/${currentUser.uid}`), {
                    name: newName, bio: newBio, photoURL: newAvatarUrl, coverURL: newCoverUrl
                });
                toast("Profile updated successfully.");
                closeEditProfileModal();
            } else {
                toast("Name cannot be empty.");
            }
            
            btn.disabled = false; btn.innerText = "Save Changes";
        });

        /* Feed Rendering & Custom Video Observers */
        const videoPlaybackObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target;
                if (entry.isIntersecting) {
                    video.play().catch(e => console.log("Autoplay prevented.", e));
                } else {
                    video.pause();
                }
            });
        }, { threshold: 0.5 });

        const infiniteScrollObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && !activeProfileUid) {
                    currentFeedLimit += 5;
                    attachRealtimeTimelineFeed();
                }
            });
        }, { rootMargin: "200px" });

        function attachRealtimeTimelineFeed() {
            if (feedUnsubscribe) feedUnsubscribe();
            const streamTarget = document.getElementById('posts-stream-target');
            const feedQuery = query(ref(database, 'social_posts'), orderByChild('timestamp'), limitToLast(currentFeedLimit));

            feedUnsubscribe = onValue(feedQuery, (snapshot) => {
                if(activeProfileUid) return; // Prevent overwriting if user quickly switched views
                renderPostsFromSnapshot(snapshot, streamTarget);
                
                let anchor = document.getElementById('home-scroll-anchor');
                if (!anchor) {
                    anchor = document.createElement('div');
                    anchor.id = 'home-scroll-anchor';
                    anchor.className = 'scroll-anchor';
                    document.getElementById('app-home-view').appendChild(anchor);
                }
                infiniteScrollObserver.observe(anchor);
            });
        }

        function loadProfileFeed(uid) {
            if (profileFeedUnsubscribe) profileFeedUnsubscribe();
            const streamTarget = document.getElementById('profile-posts-stream-target');
            streamTarget.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-secondary);">Loading posts...</div>';
            
            // Querying posts specifically for this user
            const profileQuery = query(ref(database, 'social_posts'), orderByChild('uid'), equalTo(uid));
            
            profileFeedUnsubscribe = onValue(profileQuery, (snapshot) => {
                if(activeProfileUid !== uid) return; // Ignore if switched to another profile
                if(!snapshot.exists()) {
                    streamTarget.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-secondary);">No posts yet.</div>';
                    return;
                }
                renderPostsFromSnapshot(snapshot, streamTarget);
            });
        }

        function renderPostsFromSnapshot(snapshot, targetElement) {
            targetElement.innerHTML = '';
            if (!snapshot.exists()) return;

            const postsArray = [];
            snapshot.forEach((child) => { postsArray.push({ id: child.key, ...child.val() }); });
            postsArray.sort((a, b) => b.timestamp - a.timestamp);

            postsArray.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                
                let mediaTag = '';
                if (post.mediaUrl) {
                    if (post.mediaType === 'video' || post.mediaUrl.match(/\.(mp4|webm|mov|ogg)$/i)) {
                        mediaTag = `
                            <div class="custom-video-wrapper">
                                <div class="video-spinner"></div>
                                <video src="${post.mediaUrl}" class="post-attached-media video" loop muted playsinline preload="auto"></video>
                                <div class="custom-controls">
                                    <button class="play-pause-btn"><i class="fa-solid fa-play"></i></button>
                                    <input type="range" class="seek-bar" value="0" min="0" step="0.1">
                                    <button class="mute-btn"><i class="fa-solid fa-volume-xmark"></i></button>
                                </div>
                            </div>
                        `;
                    } else {
                        mediaTag = `<div class="post-media-container"><img src="${post.mediaUrl}" class="post-attached-media"></div>`;
                    }
                }
                
                const diffMins = Math.round((Date.now() - post.timestamp)/60000);
                const timeString = diffMins < 60 ? `${diffMins}m` : (diffMins < 1440 ? `${Math.floor(diffMins/60)}h` : new Date(post.timestamp).toLocaleDateString());

                const postLikesObj = post.likes || {};
                const hasLiked = !!postLikesObj[currentUser.uid];
                
                card.innerHTML = `
                    <div class="post-header">
                        <div class="post-header-left clickable-user" data-uid="${post.uid}">
                            <img src="${post.authorAvatar}" class="post-author-img">
                            <div class="post-header-text">
                                <span class="post-author-name">${escapeHtml(post.authorName)}</span>
                                <span class="post-time">${timeString}</span>
                            </div>
                        </div>
                        ${post.uid === currentUser.uid ? `
                        <div class="post-context-menu">
                            <button class="context-trigger"><i class="fa-solid fa-ellipsis-v"></i></button>
                            <div class="context-dropdown">
                                <button class="danger delete-post-btn" data-id="${post.id}"><i class="fa-solid fa-trash"></i> Delete Post</button>
                            </div>
                        </div>` : ''}
                    </div>
                    <div class="post-text">${escapeHtml(post.text)}</div>
                    ${mediaTag}
                    <div class="post-stats">
                        <div><i class="fa-solid fa-thumbs-up" style="color:var(--primary-orange);"></i> ${post.likesCount || 0}</div>
                        <div>0 comments</div>
                    </div>
                    <div class="post-actions-row">
                        <div class="action-icon-group like-trigger ${hasLiked ? 'liked' : ''}" data-id="${post.id}"><i class="${hasLiked ? 'fa-solid' : 'fa-regular'} fa-thumbs-up"></i> Like</div>
                        <div class="action-icon-group"><i class="fa-regular fa-comment"></i> Comment</div>
                    </div>
                `;

                targetElement.appendChild(card);

                // Initialize Video Custom Controls
                const videos = card.querySelectorAll('video.post-attached-media');
                videos.forEach(vid => {
                    videoPlaybackObserver.observe(vid);
                    const wrapper = vid.closest('.custom-video-wrapper');
                    const playBtn = wrapper.querySelector('.play-pause-btn');
                    const muteBtn = wrapper.querySelector('.mute-btn');
                    const seekBar = wrapper.querySelector('.seek-bar');
                    const spinner = wrapper.querySelector('.video-spinner');

                    vid.addEventListener('waiting', () => { if(spinner) spinner.style.display = 'block'; });
                    vid.addEventListener('playing', () => { 
                        if(spinner) spinner.style.display = 'none'; 
                        playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                    });
                    vid.addEventListener('pause', () => playBtn.innerHTML = '<i class="fa-solid fa-play"></i>');
                    
                    vid.addEventListener('timeupdate', () => {
                        if(vid.duration) seekBar.value = (vid.currentTime / vid.duration) * 100;
                    });

                    playBtn.addEventListener('click', (e) => { e.stopPropagation(); if(vid.paused) vid.play(); else vid.pause(); });
                    muteBtn.addEventListener('click', (e) => { e.stopPropagation(); vid.muted = !vid.muted; muteBtn.innerHTML = vid.muted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>'; });
                    seekBar.addEventListener('input', (e) => { e.stopPropagation(); vid.currentTime = (seekBar.value / 100) * vid.duration; });
                });

                // Post Actions
                const delBtn = card.querySelector(`.delete-post-btn`);
                if(delBtn) delBtn.addEventListener('click', async () => {
                    await remove(ref(database, `social_posts/${post.id}`));
                    toast("Post deleted.");
                });

                card.querySelector('.like-trigger').addEventListener('click', function() {
                    const postRef = ref(database, `social_posts/${post.id}`);
                    get(postRef).then(snap => {
                        if (!snap.exists()) return;
                        const p = snap.val();
                        const cLikes = p.likes || {};
                        if (cLikes[currentUser.uid]) delete cLikes[currentUser.uid];
                        else cLikes[currentUser.uid] = true;
                        update(postRef, { likes: cLikes, likesCount: Object.keys(cLikes).length });
                    });
                });
            });
        }

        // Global click listener for Profile Navigation
        document.addEventListener('click', (e) => {
            const userClick = e.target.closest('.clickable-user');
            if (userClick) {
                const uid = userClick.getAttribute('data-uid');
                if (uid) openProfile(uid);
            }
        });

        function escapeHtml(str) { return (str||'').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
    </script>
</body>
</html>
