<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haba agent access</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#F6F7F8;--panel:#fff;--line:#E2E5E8;--ink:#14181B;--muted:#667078;--go:#0F7B4F;--go-bg:#E3F4EC;--off:#8A949B;--off-bg:#ECEEF0;--bad:#B3261E;--bad-bg:#FBE9E7;--btn:#14181B;--btn-ink:#fff;--sans:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#101315;--panel:#181C1F;--line:#2A3034;--ink:#EEF1F3;--muted:#99A3AA;--go:#4CC38A;--go-bg:#12301F;--off:#8A949B;--off-bg:#23282C;--bad:#FF8A80;--bad-bg:#3A1B19;--btn:#EEF1F3;--btn-ink:#101315}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.hidden{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:32px 20px 60px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 14px}
p.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:9px 14px;font-weight:600}
button.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
button.sm{padding:5px 10px;font-size:13px}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.seg button{border:0;border-radius:0;background:transparent;color:var(--muted)}
.seg button.on{background:var(--btn);color:var(--btn-ink)}
.msg{min-height:20px;font-size:13.5px;margin:2px 0 10px}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--go)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.agent{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.agent:first-child{border-top:0}
.agent .who{flex:1;min-width:200px}
.agent .who b{display:block}
.agent .who span{color:var(--muted);font-size:12.5px;word-break:break-all}
.pill{font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px}
.pill.on{background:var(--go-bg);color:var(--go)}.pill.off{background:var(--off-bg);color:var(--off)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:24px}
.login{max-width:380px;margin:12vh auto 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:8px;font-weight:600;z-index:9}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="wrap login hidden" id="s-login">
  <h1>Haba agent access</h1>
  <p class="sub">Admins only. Sign in to manage who can use Haba Support.</p>
  <div class="card">
    <div class="field"><label for="l-email">Email</label><input id="l-email" type="email" autocomplete="username"></div>
    <div class="field"><label for="l-pass">Password</label><input id="l-pass" type="password" autocomplete="current-password"></div>
    <div class="msg bad" id="l-msg"></div>
    <button class="primary" id="l-go" style="width:100%">Sign in</button>
  </div>
</div>

<div class="wrap login hidden" id="s-denied">
  <h1>Request access</h1>
  <p class="sub" id="d-sub"></p>
  <div class="card" id="d-form">
    <div class="field"><label for="d-name">Your name</label><input id="d-name" autocomplete="name"></div>
    <div class="msg" id="d-msg"></div>
    <button class="primary" id="d-req">Request access</button>
  </div>
  <button id="d-out">Sign out</button>
</div>

<div class="wrap hidden" id="s-app">
  <div class="top">
    <div><h1>Agent access</h1><p class="sub">Signed in as <b id="me-name"></b>. Agents can sign in to Haba Support while they’re active.</p></div>
    <button id="out">Sign out</button>
  </div>

  <div class="card">
    <h2>Add an agent</h2>
    <div class="seg"><button id="m-new" class="on">Create a login</button><button id="m-uid">I have a user ID</button></div>
    <div class="row2">
      <div class="field"><label for="a-name">Display name</label><input id="a-name" placeholder="Betty"></div>
      <div class="field"><label for="a-role">Role</label><select id="a-role"><option value="agent">Agent</option><option value="admin">Admin</option></select></div>
    </div>
    <div id="f-new">
      <div class="row2">
        <div class="field"><label for="a-email">Email</label><input id="a-email" type="email" placeholder="betty@habaapp.co.za"></div>
        <div class="field"><label for="a-pass">Temporary password</label><input id="a-pass" type="text" autocomplete="off" placeholder="At least 8 characters"></div>
      </div>
    </div>
    <div id="f-uid" class="hidden">
      <div class="field"><label for="a-uid">User ID</label><input id="a-uid" autocomplete="off" placeholder="8jDxwTR1FwecNdP8Dpy2wkg3nma2"></div>
      <div class="field"><label for="a-uemail">Email (optional, enables password reset)</label><input id="a-uemail" type="email"></div>
    </div>
    <div class="msg" id="a-msg"></div>
    <button class="primary" id="a-go">Give access</button>
  </div>

  <div class="card hidden" id="req-card">
    <h2>Access requests</h2>
    <div id="reqs"></div>
  </div>

  <div class="card">
    <h2>Team <span id="count" style="color:var(--muted);font-weight:400"></span></h2>
    <div id="list"><div class="empty">Loading…</div></div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getDatabase, ref, onValue, get, set, update, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

const cfg = {
  apiKey: "AIzaSyBQSPwpVbGrdCuOoyitAeWQHIeipj2MgIY",
  authDomain: "newstart-64c43.firebaseapp.com",
  databaseURL: "https://newstart-64c43-default-rtdb.firebaseio.com",
  projectId: "newstart-64c43",
  storageBucket: "newstart-64c43.firebasestorage.app",
  messagingSenderId: "941619830061",
  appId: "1:941619830061:web:de9e0f791eb8f6eacf87a4"
};
const app = initializeApp(cfg);
const auth = getAuth(app), db = getDatabase(app);
// Second app instance: creating a login here must not sign the admin out.
const app2 = initializeApp(cfg, "creator");
const auth2 = getAuth(app2);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, agents = {}, reqs = {}, unsub = null, mode = 'new', reqUser = null, reqA = null;

function show(id){ ['s-login','s-denied','s-app'].forEach(x => $('#'+x).classList.toggle('hidden', x !== id)); }
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add('hidden'), 2800); }
function say(t, cls=''){ const m = $('#a-msg'); m.textContent = t; m.className = 'msg ' + cls; }
function errText(e){
  const c = String(e.code || e.message || e);
  if (/email-already-in-use/.test(c)) return 'That email already has a login. Use “I have a user ID” with their existing ID instead.';
  if (/weak-password/.test(c)) return 'Password is too weak. Use at least 8 characters.';
  if (/invalid-email/.test(c)) return 'That email address isn’t valid.';
  if (/permission_denied/i.test(c)) return 'Permission denied. Check that your database rules let admins write to support_agents.';
  return c.replace(/^Firebase:\s*/, '');
}

onAuthStateChanged(auth, async user => {
  if (unsub) { unsub(); unsub = null; }
  me = null;
  if (!user) { show('s-login'); return; }
  try {
    const a = (await get(ref(db, 'support_agents/' + user.uid))).val();
    if (!a || a.active !== true || a.role !== 'admin') { await showRequest(user, a); return; }
    me = { uid: user.uid, name: a.name || user.email };
    $('#me-name').textContent = me.name;
    show('s-app');
    const u1 = onValue(ref(db, 'support_agents'), s => { agents = s.val() || {}; draw(); }, e => { $('#list').innerHTML = `<div class="empty">${esc(errText(e))}</div>`; });
    const u2 = onValue(ref(db, 'support_access_requests'), s => { reqs = s.val() || {}; drawReqs(); }, () => {});
    unsub = () => { u1(); u2(); };
  } catch (e) { await showRequest(user, null); }
});

// Any signed-in user lands here and can ask for access. An admin has to approve.
async function showRequest(user, a){
  reqUser = user; reqA = a; show('s-denied');
  $('#d-name').value = $('#d-name').value || user.displayName || '';
  const isAgent = !!(a && a.active === true);
  let pending = false;
  try { pending = !!(await get(ref(db, 'support_access_requests/' + user.uid))).val(); } catch (_) {}
  $('#d-sub').textContent = isAgent
    ? 'You already have agent access to Haba Support. This page is for admins, so you can ask for admin access below.'
    : pending ? 'Your request is with the admins. You’ll get in as soon as someone approves it.'
    : `Signed in as ${user.email || user.uid}. Send a request and an admin will review it.`;
  $('#d-form').classList.toggle('hidden', pending);
  $('#d-req').textContent = isAgent ? 'Request admin access' : 'Request access';
}
$('#d-req').onclick = async () => {
  const m = $('#d-msg'), name = $('#d-name').value.trim();
  if (!name) { m.textContent = 'Enter your name.'; m.className = 'msg bad'; return; }
  try {
    await set(ref(db, 'support_access_requests/' + reqUser.uid), { name, email: reqUser.email || '', role: reqA && reqA.active === true ? 'admin' : 'agent', status: 'pending', createdAt: serverTimestamp() });
    m.textContent = '';
    await showRequest(reqUser, reqA);
  } catch (e) { m.textContent = errText(e); m.className = 'msg bad'; }
};

function drawReqs(){
  const rows = Object.entries(reqs);
  $('#req-card').classList.toggle('hidden', !rows.length);
  $('#reqs').innerHTML = rows.map(([uid, r]) => `<div class="agent">
    <div class="who"><b>${esc(r.name || uid)}</b><span>${esc(r.email || uid)} · wants ${esc(r.role || 'agent')}</span></div>
    <div class="acts"><button class="sm primary" data-q="approve" data-u="${esc(uid)}">Approve</button><button class="sm danger" data-q="decline" data-u="${esc(uid)}">Decline</button></div>
  </div>`).join('');
}
$('#reqs').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const uid = b.dataset.u, r = reqs[uid]; if (!r) return;
  try {
    if (b.dataset.q === 'approve') {
      const rec = { name: r.name, role: r.role === 'admin' ? 'admin' : 'agent', active: true, addedBy: me.name, createdAt: serverTimestamp() };
      if (r.email) rec.email = r.email;
      await update(ref(db), { ['support_agents/' + uid]: rec, ['support_access_requests/' + uid]: null });
      toast(`${r.name} approved`);
    } else { await remove(ref(db, 'support_access_requests/' + uid)); toast('Request declined'); }
  } catch (err) { toast(errText(err)); }
});

$('#l-go').onclick = async () => {
  $('#l-msg').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('#l-email').value.trim(), $('#l-pass').value); }
  catch (e) { $('#l-msg').textContent = /credential|password|user-not-found/i.test(e.code + e.message) ? 'Email or password is incorrect.' : errText(e); }
};
$('#l-pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('#l-go').click(); });
$('#out').onclick = $('#d-out').onclick = () => signOut(auth);

function setMode(m){
  mode = m;
  $('#m-new').classList.toggle('on', m === 'new'); $('#m-uid').classList.toggle('on', m === 'uid');
  $('#f-new').classList.toggle('hidden', m !== 'new'); $('#f-uid').classList.toggle('hidden', m !== 'uid');
  say('');
}
$('#m-new').onclick = () => setMode('new');
$('#m-uid').onclick = () => setMode('uid');

$('#a-go').onclick = async () => {
  const name = $('#a-name').value.trim(), role = $('#a-role').value;
  if (!name) return say('Enter a display name.', 'bad');
  const btn = $('#a-go'); btn.disabled = true; say('Working…');
  try {
    let uid, email;
    if (mode === 'new') {
      email = $('#a-email').value.trim(); const pass = $('#a-pass').value;
      if (!email) throw { message: 'Enter an email address.' };
      if (pass.length < 8) throw { code: 'weak-password' };
      const cred = await createUserWithEmailAndPassword(auth2, email, pass);
      uid = cred.user.uid;
      await signOut(auth2);
    } else {
      uid = $('#a-uid').value.trim(); email = $('#a-uemail').value.trim();
      if (!uid) throw { message: 'Enter the user ID.' };
    }
    const rec = { name, role, active: true, addedBy: me.name, createdAt: serverTimestamp() };
    if (email) rec.email = email;
    await set(ref(db, 'support_agents/' + uid), rec);
    say(mode === 'new' ? `${name} can now sign in with ${email}. Share the temporary password with them directly.` : `${name} now has access.`, 'ok');
    ['a-name','a-email','a-pass','a-uid','a-uemail'].forEach(i => $('#'+i).value = '');
  } catch (e) { say(errText(e), 'bad'); }
  finally { btn.disabled = false; }
};

function draw(){
  const rows = Object.entries(agents).sort((a, b) => String(a[1].name).localeCompare(String(b[1].name)));
  $('#count').textContent = rows.length ? `(${rows.filter(r => r[1].active).length} active)` : '';
  if (!rows.length) { $('#list').innerHTML = '<div class="empty">No agents yet. Add the first one above.</div>'; return; }
  $('#list').innerHTML = rows.map(([uid, a]) => {
    const self = uid === me.uid;
    return `<div class="agent">
      <div class="who"><b>${esc(a.name || uid)}${self ? ' (you)' : ''}</b><span>${esc(a.email || uid)}</span></div>
      <span class="pill ${a.active ? 'on' : 'off'}">${a.active ? 'Active' : 'Disabled'}</span>
      <span style="text-transform:capitalize;color:var(--muted);min-width:46px">${esc(a.role || 'agent')}</span>
      <div class="acts">${self ? '' : `
        <button class="sm" data-a="toggle" data-u="${esc(uid)}">${a.active ? 'Disable' : 'Enable'}</button>
        <button class="sm" data-a="role" data-u="${esc(uid)}">Make ${a.role === 'admin' ? 'agent' : 'admin'}</button>
        ${a.email ? `<button class="sm" data-a="reset" data-u="${esc(uid)}">Reset password</button>` : ''}
        <button class="sm danger" data-a="remove" data-u="${esc(uid)}">Remove</button>`}</div>
    </div>`;
  }).join('');
}

$('#list').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const uid = b.dataset.u, a = agents[uid]; if (!a || uid === me.uid) return;
  try {
    if (b.dataset.a === 'toggle') { await update(ref(db, 'support_agents/' + uid), { active: !a.active }); toast(a.active ? `${a.name} disabled` : `${a.name} enabled`); }
    if (b.dataset.a === 'role') { await update(ref(db, 'support_agents/' + uid), { role: a.role === 'admin' ? 'agent' : 'admin' }); toast('Role updated'); }
    if (b.dataset.a === 'reset') { await sendPasswordResetEmail(auth, a.email); toast('Reset email sent to ' + a.email); }
    if (b.dataset.a === 'remove' && confirm(`Remove ${a.name}? They lose access immediately. Their login stays in Firebase Authentication until you delete it there.`)) {
      await remove(ref(db, 'support_agents/' + uid)); toast(`${a.name} removed`);
    }
  } catch (err) { toast(errText(err)); }
});
</script>
</body>
</html>
