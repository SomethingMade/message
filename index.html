<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#fafaf8">
    <title>Ona - Professional Social Stream</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ── Design System Variables (Quartz & Sapphire — light) ── */
        :root {
            --bg-body: #faf9f6;
            --bg-surface: #ffffff;
            --bg-sunken: #f3f2ee;
            --accent-blue: #2563eb;
            --accent-blue-dim: #eff4ff;
            --accent-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            --text-main: #14161a;
            --text-muted: #6b7280;
            --text-faint: #9ca3af;
            --border-dim: #e7e5e0;
            --border-soft: #efeee9;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-pill: 9999px;
            --shadow-card: 0 1px 2px rgba(20,22,26,0.04), 0 8px 24px -12px rgba(20,22,26,0.08);
            --shadow-pop: 0 20px 45px -15px rgba(20,22,26,0.25);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-body); color: var(--text-main); -webkit-font-smoothing: antialiased; }
        body { overflow: hidden; }
        .display-font { font-family: 'Fraunces', serif; }

        button, input, textarea { font-family: inherit; }

        /* ── App Shell ── */
        .app-wrapper {
            display: flex;
            max-width: 1250px;
            margin: 0 auto;
            height: 100%;
        }

        /* Left Column — desktop only */
        .sidebar {
            width: 264px;
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid var(--border-dim);
            flex-shrink: 0;
        }

        .brand-logo {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 34px;
        }
        .brand-logo i { color: var(--accent-blue); font-size: 19px; }

        .nav-links { display: flex; flex-direction: column; gap: 6px; }
        .nav-item { display: flex; align-items: center; gap: 16px; padding: 13px 18px; border-radius: var(--radius-pill); color: var(--text-main); font-weight: 600; font-size: 15px; text-decoration: none; transition: background 0.18s ease, color 0.18s ease; cursor: pointer; }
        .nav-item i { width: 20px; text-align: center; font-size: 17px; color: var(--text-muted); transition: color 0.18s ease; }
        .nav-item:hover { background: var(--bg-sunken); }
        .nav-item.active { color: var(--accent-blue); }
        .nav-item.active i { color: var(--accent-blue); }

        .sidebar-profile { display:flex; align-items:center; gap:12px; padding: 10px 8px; border-radius: var(--radius-pill); transition: background 0.18s ease; cursor: default; }
        .sidebar-profile:hover { background: var(--bg-sunken); }
        .user-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--bg-sunken); flex-shrink: 0; cursor: pointer; border: 2px solid var(--bg-surface); box-shadow: 0 0 0 1px var(--border-dim); transition: opacity 0.2s; }
        .user-avatar:hover { opacity: 0.85; }

        /* Center Column Feed */
        .feed-container {
            flex: 1;
            min-width: 0;
            max-width: 600px;
            border-right: 1px solid var(--border-dim);
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-body);
        }

        .header-sticky {
            position: sticky; top: 0; background: rgba(250, 249, 246, 0.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            padding: 18px 22px; border-bottom: 1px solid var(--border-dim); display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }
        .header-sticky h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }

        .scrollable-stream { flex: 1; overflow-y: auto; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .scrollable-stream::-webkit-scrollbar { width: 6px; }
        .scrollable-stream::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: 3px; }

        /* ── Composer Card ── */
        .composer {
            margin: 18px 18px 8px;
            padding: 18px 18px 14px;
            border: 1px solid var(--border-dim);
            border-radius: var(--radius-lg);
            display: flex;
            gap: 14px;
            background: var(--bg-surface);
            box-shadow: var(--shadow-card);
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .composer:focus-within { border-color: #c7d6fb; box-shadow: 0 0 0 4px var(--accent-blue-dim), var(--shadow-card); }

        .composer-body { flex: 1; min-width: 0; }
        .composer-input { width: 100%; background: transparent; border: none; outline: none; color: var(--text-main); font-size: 16px; font-family: inherit; resize: none; min-height: 48px; line-height: 1.55; }
        .composer-input::placeholder { color: var(--text-faint); }

        .media-preview-box { display: none; margin-top: 12px; position: relative; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-dim); max-height: 280px; }
        .media-preview-box img { width: 100%; height: 100%; object-fit: cover; max-height: 280px; display:block; }
        .clear-preview-btn { position: absolute; top: 10px; right: 10px; background: rgba(20, 22, 26, 0.55); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: transform 0.2s; }
        .clear-preview-btn:hover { transform: scale(1.06); }

        .composer-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-soft); }
        .tool-btn { color: var(--accent-blue); background: var(--accent-blue-dim); border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: background 0.18s; }
        .tool-btn:hover { background: #e2eaff; }

        .btn-primary { background: var(--accent-gradient); color: white; border: none; padding: 10px 22px; border-radius: var(--radius-pill); font-weight: 700; font-size: 14px; cursor: pointer; transition: opacity 0.2s, transform 0.1s, box-shadow .2s; box-shadow: 0 6px 16px -4px rgba(37, 99, 235, 0.45); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow:none; }

        /* ── Post Card ── */
        .post-card { padding: 18px 22px; border-bottom: 1px solid var(--border-soft); display: flex; gap: 14px; background: var(--bg-surface); transition: background-color 0.18s; }
        .post-card:hover { background-color: var(--bg-sunken); }
        .post-main { flex: 1; min-width: 0; }
        .post-meta { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; flex-wrap: wrap; }
        .author-name { font-weight: 700; color: var(--text-main); font-size: 14.5px; }
        .author-handle { color: var(--text-muted); font-size: 13px; }
        .post-time { color: var(--text-faint); font-size: 13px; }
        .post-text { font-size: 15px; line-height: 1.55; color: #1f2937; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
        .post-attached-media { width: 100%; border-radius: var(--radius-md); border: 1px solid var(--border-dim); max-height: 380px; object-fit: cover; margin-bottom: 12px; display:block; }

        .post-actions-row { display: flex; gap: 40px; color: var(--text-muted); margin-top: 6px; }
        .action-icon-group { display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; transition: color 0.18s; }
        .action-icon-group:hover { color: var(--accent-blue); }
        .action-icon-group.liked { color: #e11d48; }

        /* ── Shimmer Loading Skeletons ── */
        @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
        .shimmer { background: linear-gradient(90deg, #efeee9 0%, #f8f7f4 50%, #efeee9 100%); background-size: 800px 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: var(--radius-md); }
        .skeleton-card { padding: 18px 22px; display: flex; gap: 14px; border-bottom: 1px solid var(--border-soft); }
        .skeleton-avatar { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; }
        .skeleton-lines { flex:1; display:flex; flex-direction:column; gap:8px; }
        .skeleton-line { height: 11px; border-radius: 6px; }

        /* ── Comments Modal ── */
        .overlay-modal { position: fixed; inset: 0; background: rgba(20, 22, 26, 0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; z-index: 200; }
        .overlay-modal.active { display: flex; }
        .modal-sheet { background: var(--bg-surface); width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; border: 1px solid var(--border-dim); border-bottom: none; display: flex; flex-direction: column; max-height: 82vh; animation: modalUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: var(--shadow-pop); }
        @keyframes modalUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-header { padding: 18px 22px; border-bottom: 1px solid var(--border-dim); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-size: 16px; font-weight: 700; }
        .modal-body { padding: 8px 22px 22px; overflow-y: auto; flex: 1; }
        .comment-entry-box { display: flex; gap: 12px; align-items: flex-end; padding: 14px 22px; border-top: 1px solid var(--border-dim); background: var(--bg-sunken); }

        /* ── Toasts ── */
        #toast-box { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 500; display: flex; flex-direction: column; gap: 10px; align-items:center; }
        .toast { background: var(--text-main); color: white; padding: 12px 22px; border-radius: var(--radius-pill); font-size: 13.5px; font-weight: 600; box-shadow: 0 14px 30px -10px rgba(0,0,0,0.35); animation: toastIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes toastIn { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* ── Auth Gate ── */
        .auth-gate { position: fixed; inset: 0; background: var(--bg-body); z-index: 1000; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
        .auth-card { background: var(--bg-surface); border: 1px solid var(--border-dim); padding: 38px 30px; border-radius: 28px; width: 100%; max-width: 400px; text-align: center; box-shadow: var(--shadow-pop); }
        .auth-input { width: 100%; padding: 13px 16px; background: var(--bg-sunken); border: 1px solid var(--border-dim); border-radius: var(--radius-md); color: var(--text-main); margin-bottom: 12px; outline: none; font-family: inherit; font-size: 15px; transition: border-color 0.2s, background .2s; }
        .auth-input:focus { border-color: var(--accent-blue); background: var(--bg-surface); }
        .auth-btn-row { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }

        /* ── Bottom Nav (mobile/tablet, X-style hide on scroll) ── */
        .bottom-nav {
            position: fixed; left: 0; right: 0; bottom: 0;
            display: none;
            justify-content: space-around;
            align-items: center;
            background: rgba(250, 249, 246, 0.92);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid var(--border-dim);
            padding: 10px 6px calc(10px + env(safe-area-inset-bottom));
            z-index: 100;
            transform: translateY(0);
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .bottom-nav.nav-hidden { transform: translateY(110%); }
        .bn-item { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color: var(--text-muted); background:none; border:none; font-size: 19px; width: 50px; height: 46px; border-radius: var(--radius-md); cursor:pointer; transition: color .18s, background .18s; }
        .bn-item.active { color: var(--accent-blue); }
        .bn-item:active { background: var(--bg-sunken); }
        .bn-fab { width: 48px; height: 48px; border-radius: 50%; background: var(--accent-gradient); color: white; display:flex; align-items:center; justify-content:center; font-size: 19px; border:none; box-shadow: 0 8px 18px -6px rgba(37,99,235,.55); cursor:pointer; }

        /* ══ Device Adaptation ══ */

        /* Tablet: condensed icon-only sidebar, narrower feed, bottom nav appears for quick actions */
        @media (max-width: 980px) {
            .sidebar { width: 84px; padding: 24px 10px; align-items: center; }
            .sidebar span { display: none; }
            .brand-logo { justify-content: center; margin-bottom: 28px; }
            .brand-logo span { display:none; }
            .nav-item { justify-content: center; padding: 13px; width: 48px; }
            .sidebar-profile { padding: 8px; }
            .sidebar-profile > div:last-child { display:none; }
            .feed-container { max-width: none; }
        }

        /* Mobile: sidebar replaced entirely by bottom nav */
        @media (max-width: 700px) {
            body { overflow: auto; }
            .app-wrapper { display: block; height: auto; min-height: 100%; }
            .sidebar { display: none; }
            .feed-container { border-right: none; height: auto; min-height: 100vh; max-width: none; }
            .scrollable-stream { overflow-y: visible; height: auto; }
            .header-sticky { padding: 14px 16px; }
            .composer { margin: 14px 12px 6px; padding: 14px 14px 10px; border-radius: var(--radius-md); }
            .post-card { padding: 16px; gap: 12px; }
            .post-actions-row { gap: 30px; }
            .bottom-nav { display: flex; }
            .scrollable-stream { padding-bottom: 78px; }
        }

        @media (min-width: 701px) and (max-width: 980px) {
            .bottom-nav { display: none; }
        }

        @media (min-width: 981px) {
            .bottom-nav { display: none; }
        }
    </style>
</head>
<body>

    <div id="auth-screen" class="auth-gate">
        <div class="auth-card">
            <div class="brand-logo display-font" style="justify-content: center; font-size:26px;">
                <i class="fa-solid fa-atom"></i><span>Ona</span>
            </div>
            <p style="color: var(--text-muted); margin-bottom: 26px; font-size: 14px; line-height: 1.5;">Access your clean social feed space.</p>
            <input type="email" id="login-email" class="auth-input" placeholder="Email Address">
            <input type="password" id="login-pass" class="auth-input" placeholder="Password">

            <div class="auth-btn-row">
                <button class="btn-primary" id="action-login" style="width:100%">Sign In</button>
                <button class="btn-primary" id="action-signup" style="width:100%; background: transparent; color: var(--text-main); border: 1px solid var(--border-dim); box-shadow: none;">Create Account</button>
                <div style="color: var(--text-faint); font-size: 12.5px; margin: 4px 0;">or</div>
                <button class="btn-primary" id="action-google" style="width:100%; background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-dim); display:flex; align-items:center; justify-content:center; gap:10px; box-shadow: none;">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:18px" alt=""> Continue with Google
                </button>
            </div>
        </div>
    </div>

    <div class="app-wrapper">

        <aside class="sidebar">
            <div class="nav-stack">
                <div class="brand-logo display-font"><i class="fa-solid fa-atom"></i><span>Ona</span></div>
                <nav class="nav-links">
                    <div class="nav-item active"><i class="fa-solid fa-house"></i><span>Feed</span></div>
                    <div class="nav-item" id="logout-trigger"><i class="fa-solid fa-arrow-right-from-bracket"></i><span>Logout</span></div>
                </nav>
            </div>
            <div class="sidebar-profile">
                <label style="position:relative; cursor:pointer;" title="Change Profile Picture">
                    <img id="my-profile-avatar" src="https://ui-avatars.com/api/?name=Ona+User&background=2563eb&color=fff" class="user-avatar">
                    <input type="file" id="avatar-input" accept="image/*" style="display:none;">
                </label>
                <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                    <div id="my-profile-name" style="font-weight:700; font-size:14px; color: var(--text-main);">Loading...</div>
                    <div id="my-profile-handle" style="color:var(--text-muted); font-size:12px;">@user</div>
                </div>
            </div>
        </aside>

        <main class="feed-container">
            <div class="header-sticky">
                <h1 class="display-font">Stream Pipeline</h1>
                <i class="fa-solid fa-bolt-lightning" style="color: var(--accent-blue)"></i>
            </div>

            <div class="scrollable-stream" id="scroll-region">
                <div class="composer">
                    <img id="composer-user-avatar" src="https://ui-avatars.com/api/?name=Ona+User&background=2563eb&color=fff" class="user-avatar">
                    <div class="composer-body">
                        <textarea id="composer-text" class="composer-input" placeholder="What's on your mind? Share text or high-res media..."></textarea>

                        <div id="preview-box" class="media-preview-box">
                            <button class="clear-preview-btn" id="clear-media-btn"><i class="fa-solid fa-xmark"></i></button>
                            <img id="media-img-target" src="">
                        </div>

                        <div class="composer-footer">
                            <div class="composer-tools">
                                <label class="tool-btn" title="Attach Media Image">
                                    <i class="fa-regular fa-image"></i>
                                    <input type="file" id="post-media-file" accept="image/*,video/*" style="display:none;">
                                </label>
                            </div>
                            <button class="btn-primary" id="submit-post-btn">Post</button>
                        </div>
                    </div>
                </div>

                <div id="skeleton-stream">
                    <div class="skeleton-card"><div class="skeleton-avatar shimmer"></div><div class="skeleton-lines"><div class="skeleton-line shimmer" style="width:40%;"></div><div class="skeleton-line shimmer" style="width:85%;"></div><div class="skeleton-line shimmer" style="width:65%;"></div></div></div>
                    <div class="skeleton-card"><div class="skeleton-avatar shimmer"></div><div class="skeleton-lines"><div class="skeleton-line shimmer" style="width:30%;"></div><div class="skeleton-line shimmer" style="width:90%;"></div><div class="skeleton-line shimmer" style="width:50%;"></div></div></div>
                    <div class="skeleton-card"><div class="skeleton-avatar shimmer"></div><div class="skeleton-lines"><div class="skeleton-line shimmer" style="width:45%;"></div><div class="skeleton-line shimmer" style="width:70%;"></div><div class="skeleton-line shimmer" style="width:80%;"></div></div></div>
                </div>

                <div id="posts-stream-target"></div>
            </div>
        </main>
    </div>

    <nav class="bottom-nav" id="bottom-nav">
        <button class="bn-item active"><i class="fa-solid fa-house"></i></button>
        <button class="bn-item" id="bn-avatar-trigger"><i class="fa-regular fa-circle-user"></i></button>
        <button class="bn-fab" id="bn-compose-btn"><i class="fa-solid fa-plus"></i></button>
        <button class="bn-item" id="bn-logout-trigger"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </nav>

    <div id="comments-modal" class="overlay-modal">
        <div class="modal-sheet">
            <div class="modal-header">
                <h3>Discussion Thread</h3>
                <button class="clear-preview-btn" onclick="closeCommentThread()" style="position:static; background: var(--bg-sunken); color: var(--text-main);"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="modal-comments-target">
                </div>
            <div class="comment-entry-box">
                <textarea id="comment-text-input" class="composer-input" placeholder="Post your reply to this stream..." style="min-height:38px; font-size:15px; background: var(--bg-surface); border:1px solid var(--border-dim); border-radius: var(--radius-md); padding: 8px 12px;"></textarea>
                <button class="btn-primary" id="submit-reply-btn" style="padding: 9px 18px;">Reply</button>
            </div>
        </div>
    </div>

    <div id="toast-box"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut as fbSignOut, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, push, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Verified Native Database and Authentication Configurations
        const firebaseConfig = {
            apiKey: "AIzaSyBQSPwpVbGrdCuOoyitAeWQHIeipj2MgIY",
            authDomain: "newstart-64c43.firebaseapp.com",
            databaseURL: "https://newstart-64c43-default-rtdb.firebaseio.com",
            projectId: "newstart-64c43",
            storageBucket: "newstart-64c43.firebasestorage.app",
            messagingSenderId: "941619830061",
            appId: "1:941619830061:web:de9e0f791eb8f6eacf87a4"
        };

        // Unsigned High-Performance Cloudinary Assets Routing Endpoints
        const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/dmod7co6g/image/upload";
        const CLOUDINARY_PRESET = "pace_unsigned";

        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const database = getDatabase(fbApp);
        const provider = new GoogleAuthProvider();

        // Reactive Application State Holders
        let currentUser = null;
        let userProfile = {};
        let selectedMediaBlob = null;
        let activeTargetThreadId = null;

        function toast(msg) {
            const box = document.getElementById('toast-box');
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerText = msg;
            box.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }

        // Direct Cloudinary REST Upload Engine (Bypasses Widget Dependencies)
        async function uploadMediaFile(file) {
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", CLOUDINARY_PRESET);

            try {
                const response = await fetch(CLOUDINARY_URL, {
                    method: "POST",
                    body: formData
                });
                if (!response.ok) throw new Error("Cloudinary pipeline authentication error.");
                const data = await response.json();
                return data.secure_url;
            } catch (err) {
                console.error(err);
                toast("Media processing framework error.");
                return null;
            }
        }

        // Realtime User Authentication Flow Controller
        onAuthStateChanged(auth, async (user) => {
            const gate = document.getElementById('auth-screen');
            if (user) {
                currentUser = user;
                gate.style.display = 'none';
                listenToUserProfile(user);
                attachRealtimeTimelineFeed();
            } else {
                currentUser = null;
                gate.style.display = 'flex';
            }
        });

        function listenToUserProfile(user) {
            const userRef = ref(database, `users/${user.uid}`);
            onValue(userRef, async (snap) => {
                let p = snap.exists() ? snap.val() : {};
                let forcedUpdates = false;

                if (!p.name) { p.name = user.displayName || 'Ona User'; forcedUpdates = true; }
                if (!p.photoURL) { p.photoURL = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=2563eb&color=fff`; forcedUpdates = true; }
                if (!p.handle) { p.handle = `@user_${user.uid.slice(0, 5)}`; forcedUpdates = true; }

                userProfile = p;
                if (forcedUpdates) {
                    await update(userRef, { name: p.name, photoURL: p.photoURL, handle: p.handle });
                }

                // Synchronize Structural UI Interface Elements
                document.getElementById('my-profile-avatar').src = p.photoURL;
                document.getElementById('composer-user-avatar').src = p.photoURL;
                document.getElementById('my-profile-name').innerText = p.name;
                document.getElementById('my-profile-handle').innerText = p.handle;
            });
        }

        // Native Authentication Action Assertions
        document.getElementById('action-login').addEventListener('click', () => {
            const em = document.getElementById('login-email').value.trim();
            const pa = document.getElementById('login-pass').value;
            if(!em || !pa) return toast("Form fields cannot be blank.");
            signInWithEmailAndPassword(auth, em, pa).catch(e => toast(e.message));
        });

        document.getElementById('action-signup').addEventListener('click', () => {
            const em = document.getElementById('login-email').value.trim();
            const pa = document.getElementById('login-pass').value;
            if(!em || !pa) return toast("Please complete your parameters.");
            createUserWithEmailAndPassword(auth, em, pa).catch(e => toast(e.message));
        });

        document.getElementById('action-google').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(e => toast(e.message));
        });

        function doLogout() { fbSignOut(auth).then(() => window.location.reload()); }
        document.getElementById('logout-trigger').addEventListener('click', doLogout);
        document.getElementById('bn-logout-trigger').addEventListener('click', doLogout);
        document.getElementById('bn-avatar-trigger').addEventListener('click', () => document.getElementById('avatar-input').click());
        document.getElementById('bn-compose-btn').addEventListener('click', () => {
            document.getElementById('composer-text').focus();
            document.getElementById('scroll-region').scrollIntoView({behavior:'smooth'});
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Dynamic Profile Image Swap Pipeline
        document.getElementById('avatar-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            toast("Syncing new avatar data...");
            const cloudUrl = await uploadMediaFile(file);
            if (cloudUrl && currentUser) {
                await update(ref(database, `users/${currentUser.uid}`), { photoURL: cloudUrl });
                toast("Avatar synced to cloud node repository.");
            }
        });

        // Composer Input File Handling Logic
        document.getElementById('post-media-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedMediaBlob = file;
                document.getElementById('media-img-target').src = URL.createObjectURL(file);
                document.getElementById('preview-box').style.display = 'block';
            }
        });

        document.getElementById('clear-media-btn').addEventListener('click', () => {
            selectedMediaBlob = null;
            document.getElementById('post-media-file').value = '';
            document.getElementById('preview-box').style.display = 'none';
        });

        // Transmit Unified Stream Element Object
        document.getElementById('submit-post-btn').addEventListener('click', async () => {
            const textVal = document.getElementById('composer-text').value.trim();
            if (!textVal && !selectedMediaBlob) return toast("Stream elements require content parameters.");

            const btn = document.getElementById('submit-post-btn');
            btn.disabled = true;
            btn.innerText = "Dispatching...";

            let resolvedMediaUrl = null;
            if (selectedMediaBlob) {
                resolvedMediaUrl = await uploadMediaFile(selectedMediaBlob);
            }

            const postsRef = ref(database, 'social_posts');
            const postObject = {
                text: textVal,
                mediaUrl: resolvedMediaUrl || "",
                uid: currentUser.uid,
                authorName: userProfile.name,
                authorHandle: userProfile.handle,
                authorAvatar: userProfile.photoURL,
                timestamp: Date.now(),
                likesCount: 0
            };

            push(postsRef, postObject).then(() => {
                document.getElementById('composer-text').value = '';
                document.getElementById('clear-media-btn').click();
                btn.disabled = false;
                btn.innerText = "Post";
                toast("Stream payload dispatched.");
            }).catch(() => {
                btn.disabled = false;
                btn.innerText = "Post";
            });
        });

        // Live Bi-directional DB Core Loop Listener
        let feedLoadedOnce = false;
        function attachRealtimeTimelineFeed() {
            const streamTarget = document.getElementById('posts-stream-target');
            const skeleton = document.getElementById('skeleton-stream');

            onValue(ref(database, 'social_posts'), (snapshot) => {
                skeleton.style.display = 'none';
                feedLoadedOnce = true;
                streamTarget.innerHTML = '';
                if (!snapshot.exists()) {
                    streamTarget.innerHTML = `<div style="padding:48px 22px; text-align:center; color:var(--text-muted);"><i class="fa-regular fa-comment-dots" style="font-size:26px; color:var(--text-faint); margin-bottom:10px; display:block;"></i>Nothing in the stream yet. Be the first to post.</div>`;
                    return;
                }

                const postsArray = [];
                snapshot.forEach((child) => {
                    postsArray.push({ id: child.key, ...child.val() });
                });

                // Sort reverse chronologically
                postsArray.sort((a, b) => b.timestamp - a.timestamp);

                postsArray.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'post-card';

                    const mediaTag = post.mediaUrl ? `<img src="${post.mediaUrl}" class="post-attached-media" alt="Attached Stream Data" loading="lazy">` : '';
                    const timeString = new Date(post.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    card.innerHTML = `
                        <img src="${post.authorAvatar}" class="user-avatar" alt="User node profile logo">
                        <div class="post-main">
                            <div class="post-meta">
                                <span class="author-name">${post.authorName}</span>
                                <span class="author-handle">${post.authorHandle}</span>
                                <span class="post-time">· ${timeString}</span>
                            </div>
                            <div class="post-text">${escapeHtml(post.text)}</div>
                            ${mediaTag}
                            <div class="post-actions-row">
                                <div class="action-icon-group" id="comment-trigger-${post.id}">
                                    <i class="fa-regular fa-comment"></i> <span id="comment-count-${post.id}">0</span>
                                </div>
                                <div class="action-icon-group" id="like-trigger-${post.id}">
                                    <i class="fa-regular fa-heart"></i> <span>${post.likesCount || 0}</span>
                                </div>
                            </div>
                        </div>
                    `;

                    streamTarget.appendChild(card);

                    // Dynamic Sub-Path Counter Resolution for replies sub-nodes
                    onValue(ref(database, `post_replies/${post.id}`), (replySnap) => {
                        const countEl = document.getElementById(`comment-count-${post.id}`);
                        if(countEl) countEl.innerText = replySnap.exists() ? replySnap.size : 0;
                    });

                    // Direct Interactive Core Operations Hooks
                    document.getElementById(`comment-trigger-${post.id}`).addEventListener('click', () => openCommentThread(post.id));
                    document.getElementById(`like-trigger-${post.id}`).addEventListener('click', () => {
                        const newLikes = (post.likesCount || 0) + 1;
                        update(ref(database, `social_posts/${post.id}`), { likesCount: newLikes });
                    });
                });
            });
        }

        // Relational Node Comment Database Pipelines Manager
        window.openCommentThread = function(postId) {
            activeTargetThreadId = postId;
            document.getElementById('comments-modal').classList.add('active');
            const target = document.getElementById('modal-comments-target');
            target.innerHTML = `<div class="skeleton-card" style="padding:14px 0; border:none;"><div class="skeleton-avatar shimmer" style="width:34px;height:34px;"></div><div class="skeleton-lines"><div class="skeleton-line shimmer" style="width:35%;"></div><div class="skeleton-line shimmer" style="width:75%;"></div></div></div>`;

            onValue(ref(database, `post_replies/${postId}`), (snap) => {
                target.innerHTML = '';
                if(!snap.exists()) {
                    target.innerHTML = `<p style="color:var(--text-muted); text-align:center; padding:32px 20px; font-size:14px;">This discussion pipeline is empty. Post a reply below.</p>`;
                    return;
                }
                snap.forEach(child => {
                    const c = child.val();
                    const replyRow = document.createElement('div');
                    replyRow.className = 'post-card';
                    replyRow.style.padding = '14px 0';
                    replyRow.style.background = 'transparent';
                    replyRow.style.borderBottom = '1px solid var(--border-soft)';
                    replyRow.innerHTML = `
                        <img src="${c.avatar}" class="user-avatar" style="width:34px; height:34px;">
                        <div class="post-main">
                            <div class="post-meta">
                                <span class="author-name" style="font-size:14px;">${c.author}</span>
                                <span class="author-handle" style="font-size:12px;">${c.handle}</span>
                            </div>
                            <div class="post-text" style="font-size:14px; margin-bottom:0; color:#374151;">${escapeHtml(c.text)}</div>
                        </div>
                    `;
                    target.appendChild(replyRow);
                });
            });
        };

        window.closeCommentThread = function() {
            document.getElementById('comments-modal').classList.remove('active');
            activeTargetThreadId = null;
        };

        document.getElementById('submit-reply-btn').addEventListener('click', () => {
            const input = document.getElementById('comment-text-input');
            const txt = input.value.trim();
            if(!txt || !activeTargetThreadId) return;

            const replyObject = {
                text: txt,
                uid: currentUser.uid,
                author: userProfile.name,
                handle: userProfile.handle,
                avatar: userProfile.photoURL,
                timestamp: Date.now()
            };

            push(ref(database, `post_replies/${activeTargetThreadId}`), replyObject).then(() => {
                input.value = '';
            });
        });

        // HTML Clean Sanitizer System Helper
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // ── X-style Bottom Nav: hide on scroll down, reveal on scroll up ──
        (function setupNavAutoHide() {
            const nav = document.getElementById('bottom-nav');
            let lastY = 0;
            let ticking = false;

            function getScrollSource() {
                // Desktop/tablet shell scrolls inside #scroll-region; mobile shell scrolls the window
                return window.innerWidth <= 700 ? window : document.getElementById('scroll-region');
            }

            function currentY(source) {
                return source === window ? window.scrollY : source.scrollTop;
            }

            function handleScroll() {
                const source = getScrollSource();
                const y = currentY(source);
                if (Math.abs(y - lastY) < 6) { ticking = false; return; }
                if (y > lastY && y > 60) {
                    nav.classList.add('nav-hidden');
                } else {
                    nav.classList.remove('nav-hidden');
                }
                lastY = y;
                ticking = false;
            }

            function onScroll() {
                if (!ticking) {
                    window.requestAnimationFrame(handleScroll);
                    ticking = true;
                }
            }

            window.addEventListener('scroll', onScroll, { passive: true });
            document.getElementById('scroll-region').addEventListener('scroll', onScroll, { passive: true });
        })();
    </script>
</body>
</html>
